[package]
name = "recon-host"
version = "0.0.1"
edition = "2021"
description = "Recon host process: tray, global hotkey, capture, decode, store, clipboard."
publish = false

[workspace]
members = ["pixels"]

[features]
# The diagnostic runs and the commands they need: --selftest, --bench, --editor-check,
# --editor-demo, --capture-demo, --measure, --platform-report. A product build has none of them, so no command lets the
# page freeze the screen or write a file (part 5's boundary, review T7).
stage0-checks = ["dep:tiff"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
# One window, ever: a second activation hands its arguments to the running instance (§3.1).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The overlay and the freeze are hand-written Win32: part 5 keeps the web view off the
# screen entirely. Pinned to the version already in the tree via tauri, so there is one.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Devices_Display",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

# The one decode route (part 6a): PNG, JPEG, BMP, GIF and WebP here, SVG through resvg,
# TIFF, HEIC and AVIF through the Windows imaging stack (windows crate, above). qcms
# converts an embedded colour profile to sRGB once, at decode. PNG encoding is also how a
# Stage 0 run leaves evidence on disk.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
qcms = "0.3"
resvg = "0.48"
# Only the fixture generator writes TIFF; the product reads it through WIC.
tiff = { version = "0.9", optional = true }

# The per-pixel work on the interactive path, optimised in every profile (see below).
recon-pixels = { path = "pixels" }

# S0.1 is a diagnostic build, so keep the debug profile honest and fast to iterate.
[profile.dev]
incremental = true

# The per-pixel work runs in debug during Stage 0. A generic function is compiled in the
# crate that calls it, so optimising the image crate alone did nothing for the resample
# (that is why a fit view cost 1.1 s, F43): the calls live in recon-pixels, and that crate
# is optimised here along with the encoders, while the rest stays debuggable.
[profile.dev.package.recon-pixels]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

# The decoders and the SVG renderer, for the same reason: a debug-profile decode of a
# large file would be a number about the profile, not about the format.
[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.image-webp]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.resvg]
opt-level = 3

[profile.dev.package.usvg]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3

[profile.dev.package.qcms]
opt-level = 3
