[package]
name = "recon-host"
version = "0.0.1"
edition = "2021"
description = "Recon host process: tray, global hotkey, capture, decode, store, clipboard."
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The overlay and the freeze are hand-written Win32: part 5 keeps the web view off the
# screen entirely. Pinned to the version already in the tree via tauri, so there is one.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
] }

# Only to write the evidence PNG for a Stage 0 run; the composer is not this crate yet.
image = { version = "0.25", default-features = false, features = ["png"] }

# S0.1 is a diagnostic build, so keep the debug profile honest and fast to iterate.
[profile.dev]
incremental = true

# The resampler runs in debug during Stage 0, and an unoptimised image crate turns a
# 40 ms downscale into most of a minute. Optimising just these two keeps the rest of the
# crate debuggable while the pixels move at a realistic speed.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.png]
opt-level = 3
