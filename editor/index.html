<!doctype html>
<meta charset="utf-8" />
<title>Recon</title>
<style>
  /* S0.4: the editor window, the scene, and one callout.
     No toolbar, no document strip, no persistence, no export. Those are later steps, and
     this file has to stay small enough to be the thing the composition contract is proved
     on rather than the thing it is buried in. */
  :root { color-scheme: dark; --ink: #f0f0f0; --paper: #101214; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink);
               font: 13px/1.45 ui-sans-serif, "Segoe UI", system-ui, sans-serif;
               overflow: hidden; }

  #stage { position: absolute; inset: 0; overflow: hidden; cursor: crosshair; }
  /* The timeline (S2.1): every document along the bottom, newest last, the current one
     marked. The stage ends above it while it is shown; fullscreen puts it away. */
  body.strip #stage { bottom: 96px; }
  #strip { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; display: none;
           gap: 8px; padding: 8px; overflow-x: auto; overflow-y: hidden;
           background: #14171b; border-top: 1px solid #2a3037; }
  body.strip #strip { display: flex; }
  .thumb { flex: 0 0 auto; height: 78px; width: 124px; border-radius: 4px; overflow: hidden;
           border: 2px solid transparent; background: #1b1f24; cursor: pointer;
           display: grid; place-items: center; color: #6b7480; font-size: 11px; }
  .thumb img { max-width: 100%; max-height: 100%; display: block; }
  .thumb.current { border-color: #7aa7ff; }
  .thumb { position: relative; }
  .thumb .x { position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border-radius: 9px;
              border: none; background: rgba(10,12,14,.75); color: #f2f2f2; font: 13px/18px system-ui, sans-serif;
              cursor: pointer; display: none; padding: 0; }
  .thumb:hover .x { display: block; }
  .thumb .x:hover { background: #c0392b; }
  /* The trash (S2.7): a chip at the end of the timeline opens it in the same strip, each
     trashed document with a way back; another chip returns. Provisional, Rotem's to restyle. */
  .chip { flex: 0 0 auto; align-self: center; padding: 6px 10px; border-radius: 6px; border: 1px solid #3a4149;
          background: #1b1f24; color: #cfd4da; font: 12px system-ui, sans-serif; cursor: pointer; }
  .chip:hover { border-color: #7aa7ff; }
  body.trash #strip { background: #1a1416; }
  .thumb .restore { position: absolute; left: 2px; bottom: 2px; padding: 2px 6px; border-radius: 4px; border: none;
                    background: rgba(10,12,14,.8); color: #f2f2f2; font: 11px system-ui, sans-serif; cursor: pointer; }
  .thumb .restore:hover { background: #2e7d32; }
  #canvas { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; }
  /* The annotation margin, drawn under the picture in the same colour the host puts in the
     output, so what is on screen is what a copy contains (§3.5, §3.6). */
  #mat { position: absolute; left: 0; top: 0; display: none; background: #e9eaec; }

  /* Everything below is laid out in IMAGE pixels and scaled by one transform on this
     container. Part 5: layout is computed before the transform exists, so zoom cannot
     re-wrap a single line of text. */
  #scene { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #arrows { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

  /* The text size is set per note, from the model, in image pixels. Everything else
     about the bubble is a proportion of it, so a bigger note is a bigger note rather than
     a large font crammed into a small box. At the default of 20 these ems are exactly the
     6, 8, 10 and 8 pixels the first version hard-coded. */
  .callout { position: absolute; display: flex; gap: .3em; align-items: flex-start;
             padding: .4em .5em; border-radius: .4em; background: #1b1f24; color: #f2f2f2;
             border: 1px solid #3a4149; box-shadow: 0 2px 10px rgba(0,0,0,.45);
             line-height: 1.35; }
  .callout.selected { border-color: #7aa7ff; }
  .callout .n { flex: 0 0 auto; font-size: .7em; min-width: 1.6em; height: 1.6em;
                border-radius: .8em; background: #7aa7ff; color: #0d1014; font-weight: 700;
                display: grid; place-items: center; }
  /* Outline and background only: a caret or a selection ring must never change layout,
     because the export has to agree with what is on screen (part 5's third remedy). */
  .callout .t { flex: 1 1 auto; min-width: 1ch; outline: none; white-space: pre-wrap;
                word-break: break-word; }
  .callout .t:focus { background: rgba(122,167,255,.14); outline: 1px solid #7aa7ff;
                      outline-offset: 2px; }
  .anchor { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px;
            border-radius: 50%; background: #7aa7ff; border: 2px solid #0d1014;
            cursor: grab; }
  /* Plain: no editing decoration at all, for the moment the scene is serialized into the
     output and for the moment the screen is compared against it (S0.6 check 3). Colours
     only, never a layout property, so switching it cannot move a pixel of text. */
  body.plain .callout.selected { border-color: #3a4149; }
  body.plain .callout .t:focus { background: transparent; outline: none; }
  body.plain .callout .t { caret-color: transparent; }
  /* Viewing mode (§3.3): the notes are shown but nothing on the scene takes the pointer,
     so a click or a drag reaches the stage and pans, and can never land on a note or
     create one. */
  body.viewing #scene { pointer-events: none; }

  #hud { position: absolute; left: 12px; bottom: 10px; padding: 6px 10px; border-radius: 6px;
         background: rgba(10,12,14,.82); color: #cfd4da; font-size: 12px;
         font-family: ui-monospace, Consolas, monospace; pointer-events: none;
         white-space: pre; }
  #probe { position: absolute; inset: 0; display: none; }
  /* The mode button (§3.3), the other half of the Annotate control beside the A key:
     Rotem's call on 2026-09-14, both. Outside the stage so a click on it reaches no
     canvas handler. */
  /* The controls (§3.3, S1.5, S2.3): the mode, and the two ways out that daily use asked
     for by hand, beside the keys that do the same. Outside the stage so a click on them
     reaches no canvas handler. Provisional, Rotem's to restyle. */
  #controls { position: absolute; right: 12px; top: 10px; display: flex; gap: 6px; }
  #controls button { padding: 6px 12px; border-radius: 6px; border: 1px solid #3a4149;
                     background: #1b1f24; color: #f2f2f2; font: 13px system-ui, sans-serif;
                     cursor: pointer; }
  #controls button:hover { border-color: #7aa7ff; }
  body.checking #stage { cursor: progress; }
  #report { position: absolute; inset: 0; display: none; padding: 18px 22px; overflow: auto;
            background: #0c0e10; font-family: ui-monospace, Consolas, monospace;
            font-size: 12px; white-space: pre-wrap; }
  body.reporting #report { display: block; }
</style>

<div id="stage">
  <div id="mat"></div>
  <canvas id="canvas"></canvas>
  <div id="scene">
    <svg id="arrows"></svg>
  </div>
</div>
<div id="hud"></div>
<div id="strip"></div>
<div id="controls" hidden>
  <button id="copy" type="button" title="Copy the image to the clipboard (Ctrl+C)">Copy</button>
  <button id="saveas" type="button" title="Save As a new PNG file (Ctrl+S)">Save As</button>
  <button id="mode" type="button">Annotate</button>
</div>
<div id="report"></div>

<script>
(() => {
  const invoke = window.__TAURI__.core.invoke;
  // A command that only the stage0-checks build registers answers false in the product,
  // where asking for it is an error rather than a no.
  const flag = async (name) => { try { return await invoke(name); } catch { return false; } };

  // Everything this page says goes to the terminal as well. A web view that throws inside a
  // hidden window is otherwise completely silent, which cost one whole run.
  const toHost = (level, line) => { invoke('editor_log', { level, line }).catch(() => {}); };
  for (const level of ['log', 'warn', 'error']) {
    const original = console[level].bind(console);
    console[level] = (...args) => {
      original(...args);
      toHost(level, args.map((a) => (a && a.stack) ? a.stack : String(a)).join(' '));
    };
  }
  window.addEventListener('error', (e) => toHost('error', `${e.message} at ${e.filename}:${e.lineno}`));
  window.addEventListener('unhandledrejection', (e) => toHost('error', `unhandled rejection: ${e.reason && e.reason.stack ? e.reason.stack : e.reason}`));
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const mat = document.getElementById('mat');
  const scene = document.getElementById('scene');
  const arrows = document.getElementById('arrows');
  const hud = document.getElementById('hud');
  const modeButton = document.getElementById('mode');
  const controls = document.getElementById('controls');
  const strip = document.getElementById('strip');
  const context = canvas.getContext('2d', { alpha: false });

  // ---------------------------------------------------------------- the scene
  //
  // Coordinates. There are exactly two spaces in this file and they are never mixed:
  //
  //   image  pixels of the source image, origin at its top-left. Everything stored lives
  //          here: anchors, bubbles, text boxes.
  //   view   what is on screen. Reached from image space by ONE transform on #scene, and
  //          from a pointer event by the inverse. Nothing is stored in this space.
  //
  // zoom is DEVICE pixels per image pixel, so zoom === 1 is actual size on this display
  // whatever its scaling. The canvas backing store is in device pixels and its CSS size is
  // that divided by the device pixel ratio, which is what makes a 1:1 view genuinely 1:1.

  const model = {
    image: { width: 0, height: 0, source: '' },
    zoom: 1,
    fitZoom: 1,
    // Top-left of the visible region, in image pixels.
    pan: { x: 0, y: 0 },
    // Where the canvas sits inside the viewport, in CSS pixels. Non-zero whenever the
    // image is smaller than the window, which at fit-to-window is most of the time: found
    // by looking at the thing, where a 5120x1440 capture sat in the top-left corner of a
    // 1280x800 window with two thirds of the window empty below it.
    offset: { x: 0, y: 0 },
    // The size the NEXT note gets, in image pixels. Each note then carries its own, so
    // changing the size later never rewrites the notes already written.
    textSize: 20,
    // The annotation margin, image pixels per edge (§3.5). Canvas space is image space
    // plus this, and the output is the source plus this (§3.6). Set explicitly for now;
    // growing it automatically when a bubble cannot fit is the placement work of S1.2.
    margin: { left: 0, top: 0, right: 0, bottom: 0 },
    // The least margin, under the automatic one. Zero in the product; the checks raise it
    // to build a document with a margin on purpose.
    marginFloor: { left: 0, top: 0, right: 0, bottom: 0 },
    // Undo and redo over the objects (§3.6): snapshots of the notes, one per completed
    // operation. Typing has the engine's own undo while a note is being edited; the
    // committed text change joins this history as one grouped step.
    history: { steps: [], index: -1 },
    // What the store holds, for the HUD (§3.8): refreshed with the timeline.
    storage: { documents: 0, bytes: 0 },
    // The save state of this document's notes (§3.8): 'saved', 'saving', or 'failed' with
    // the reason, which stays on screen until a save succeeds. Never "saved" unless the
    // host said so.
    save: { state: 'saved', error: '', dirty: false },
    callouts: [],
    nextNumber: 1,
    selected: null,
    editing: null,
    fullscreen: false,
    // 'view' or 'annotate' (§3.3). A capture opens in annotation; a file opens in viewing,
    // where no click creates anything, and Annotate switches. Leaving annotation keeps
    // the work: the notes stay in the model and the host keeps the document.
    mode: 'view',
  };

  // The ratio of physical pixels to CSS pixels for THIS window, measured rather than
  // believed. This web view reports devicePixelRatio 1 on a 225% display, so trusting it
  // would make "actual size" wrong by a factor of the display scale, quietly.
  let ratio = 1;
  const dpr = () => ratio;

  const measureRatio = async () => {
    const metrics = await invoke('editor_window_metrics');
    const css = viewport();
    const measured = css.w > 0 ? metrics.physical_width / css.w : 1;
    ratio = Math.max(0.5, Math.min(4, measured));
    console.log(
      `window ${metrics.physical_width}x${metrics.physical_height} physical, ` +
      `${css.w}x${css.h} css, ratio ${ratio.toFixed(3)}, ` +
      `scale factor ${metrics.scale_factor}, window dpi ${metrics.window_dpi} (${Math.round(metrics.window_dpi/96*100)}%), devicePixelRatio ${window.devicePixelRatio}`
    );
    return ratio;
  };
  const viewport = () => ({ w: stage.clientWidth, h: stage.clientHeight });

  // The pan is the image coordinate at the viewport's top-left. Per axis: when the
  // composition fits the window it is centred and the pan stays 0; when it does not, the
  // pan runs over the whole composition, margin included, so a note placed in the margin
  // can be reached at any zoom (F56).
  const clampPan = () => {
    const vp = viewport();
    const visibleW = (vp.w * dpr()) / model.zoom;
    const visibleH = (vp.h * dpr()) / model.zoom;
    const comp = compositionSize();
    const minX = comp.w <= visibleW ? 0 : -model.margin.left;
    const maxX = comp.w <= visibleW ? 0 : model.image.width + model.margin.right - visibleW;
    const minY = comp.h <= visibleH ? 0 : -model.margin.top;
    const maxY = comp.h <= visibleH ? 0 : model.image.height + model.margin.bottom - visibleH;
    model.pan.x = Math.min(Math.max(minX, model.pan.x), maxX);
    model.pan.y = Math.min(Math.max(minY, model.pan.y), maxY);
  };

  const toImage = (event) => {
    const box = stage.getBoundingClientRect();
    const cssX = event.clientX - box.left - model.offset.x;
    const cssY = event.clientY - box.top - model.offset.y;
    return {
      x: model.pan.x + (cssX * dpr()) / model.zoom,
      y: model.pan.y + (cssY * dpr()) / model.zoom,
    };
  };

  // ---------------------------------------------------------------- the pixels
  //
  // The host is asked for the region that is visible, at the size it will be shown. At
  // zoom 1 that is a 1:1 copy and the host does not resample at all; at fit it is a
  // downscale of only what is on screen. An enlarged preview of a smaller view is never
  // what a closer view is made of, which is the policy in part 5.

  let regionRequest = 0;
  let lastRegion = null;

  // The notes of every document this page has held, by the host's document number, so a
  // new capture never overwrites the previous one's work (§3.3): the current document's
  // notes are stashed here when another arrives, and S1.9 brings them back.
  const documents = new Map();

  const stashCurrent = () => {
    if (!model.image.document_id) return;
    if (model.editing) commitEditing();
    saveNow().catch(() => {});
    documents.set(model.image.document_id, {
      callouts: model.callouts,
      nextNumber: model.nextNumber,
      margin: { ...model.margin },
      marginFloor: { ...model.marginFloor },
      textSize: model.textSize,
      history: model.history,
    });
  };

  const emptyStateText = (hotkey) => (hotkey ? `Press ${hotkey} to capture` : 'no capture yet');

  const paintRegion = async () => {
    const vp = viewport();
    if (!model.image.width || vp.w < 2 || vp.h < 2) return;
    clampPan();

    const visibleW = (vp.w * dpr()) / model.zoom;
    const visibleH = (vp.h * dpr()) / model.zoom;
    // The image's part of the view: a pan inside the margin leaves the image starting
    // right of, or below, the viewport's edge, and the region stops at the image's edge.
    const x = Math.max(0, Math.round(model.pan.x));
    const y = Math.max(0, Math.round(model.pan.y));
    const srcW = Math.round(Math.min(model.image.width, model.pan.x + visibleW) - x);
    const srcH = Math.round(Math.min(model.image.height, model.pan.y + visibleH) - y);
    const shown = srcW >= 1 && srcH >= 1;
    canvas.style.display = shown ? '' : 'none';
    const outW = Math.max(1, Math.round(srcW * model.zoom));
    const outH = Math.max(1, Math.round(srcH * model.zoom));

    const ticket = ++regionRequest;
    if (!shown) {
      // Only margin in view: nothing to fetch, but the mat and the notes still move.
      placeComposition(vp);
      layoutScene();
      drawHud();
      return;
    }
    const url = `http://region.localhost/?x=${x}&y=${y}&w=${srcW}&h=${srcH}&ow=${outW}&oh=${outH}`;
    const askedAt = performance.now();
    const response = await fetch(url, { cache: 'no-store' });
    // 409 is the host saying a newer request replaced this one, which is the design, not
    // an error: the newer one paints. Anything else is a real refusal.
    if (response.status === 409) return;
    if (!response.ok) throw new Error(`the region was refused: ${response.status}`);
    const whole = new Uint8Array(await response.arrayBuffer());
    const header = new DataView(whole.buffer, 0, 8);
    const width = header.getUint32(0, true);
    const height = header.getUint32(4, true);
    const bytes = whole.subarray(8);
    // A late answer for a view the user has already left is dropped rather than painted,
    // which is the stale-response half of part 5's display policy.
    if (ticket !== regionRequest) return;
    if (bytes.length !== width * height * 4) {
      throw new Error(`the region is ${bytes.length} bytes for ${width}x${height}`);
    }

    canvas.width = width;
    canvas.height = height;
    canvas.style.width = `${width / dpr()}px`;
    canvas.style.height = `${height / dpr()}px`;
    placeComposition(vp);
    context.putImageData(new ImageData(new Uint8ClampedArray(bytes), width, height), 0, 0);
    lastRegion = { x, y, w: srcW, h: srcH, width, height, ms: Math.round(performance.now() - askedAt) };
    console.log(`painted ${width}x${height} at zoom ${model.zoom.toFixed(3)} in ${lastRegion.ms} ms`);
    layoutScene();
    drawHud();
  };

  // Where the image and the mat sit in the viewport. Centred when the composition does
  // not fill the window, which is what anyone expects of a viewer and is not what the
  // first version did; otherwise the pan says where the image starts, which is left of
  // the viewport for a pan into the image and right of it for a pan into the margin. The
  // offset is where the IMAGE starts; the mat is the composition around it.
  const placeComposition = (vp) => {
    const comp = compositionSize();
    const compW = (comp.w * model.zoom) / dpr();
    const compH = (comp.h * model.zoom) / dpr();
    // The offset lands on a PHYSICAL pixel, so it may be a fraction of a CSS pixel. On a
    // 225% display a whole CSS pixel is 2.25 physical ones, and a picture or a note placed
    // at a whole CSS offset sits between physical pixels and is resampled: the live editor
    // and the copy then differed on 12% of the text's pixels while agreeing at 100%
    // (S1.1, F74).
    const snap = (css) => Math.round(css * dpr()) / dpr();
    // The image's origin sits at offset minus the pan, in every formula of this page; when
    // the composition does not fit, the offset is 0 and the pan alone says where it is.
    model.offset.x = compW <= vp.w
      ? snap((vp.w - compW) / 2 + (model.margin.left * model.zoom) / dpr())
      : 0;
    model.offset.y = compH <= vp.h
      ? snap((vp.h - compH) / 2 + (model.margin.top * model.zoom) / dpr())
      : 0;
    // The canvas holds the image from its first visible column, so it starts at the
    // image's origin or at the viewport's edge, whichever is further right or down.
    canvas.style.left = `${Math.max(0, snap(model.offset.x - (model.pan.x * model.zoom) / dpr()))}px`;
    canvas.style.top = `${Math.max(0, snap(model.offset.y - (model.pan.y * model.zoom) / dpr()))}px`;
    const hasMargin = comp.w !== model.image.width || comp.h !== model.image.height;
    mat.style.display = hasMargin ? 'block' : 'none';
    if (hasMargin) {
      mat.style.left = `${model.offset.x - ((model.pan.x + model.margin.left) * model.zoom) / dpr()}px`;
      mat.style.top = `${model.offset.y - ((model.pan.y + model.margin.top) * model.zoom) / dpr()}px`;
      mat.style.width = `${compW}px`;
      mat.style.height = `${compH}px`;
    }
  };

  // ---------------------------------------------------------------- the callout layer

  const strongDirection = (text) => {
    // The first strong character decides, which is §3.5's rule written out rather than
    // handed to a CSS keyword that resolves per paragraph and ignores an override (F36).
    for (const ch of text) {
      if (/[֐-ࣿיִ-﷿ﹰ-﻿]/.test(ch)) return 'rtl';
      if (/[A-Za-zÀ-ʯͰ-֏]/.test(ch)) return 'ltr';
    }
    return null;
  };

  const resolveDirection = (callout) => {
    if (callout.dirMode === 'ltr' || callout.dirMode === 'rtl') return callout.dirMode;
    return strongDirection(callout.text) || 'ltr';
  };

  // The sizes a note can take, in image pixels, with 20 as the default. A ladder rather
  // than a multiplier: the same key press has to land on the same size every time.
  const TEXT_SIZES = [10, 12, 14, 16, 18, 20, 24, 28, 32, 40, 48, 64, 80];

  const stepTextSize = (from, direction) => {
    const at = TEXT_SIZES.findIndex((size) => size >= from);
    const index = at < 0 ? TEXT_SIZES.length - 1 : at;
    return TEXT_SIZES[Math.min(TEXT_SIZES.length - 1, Math.max(0, index + direction))];
  };

  // One step up or down. It applies to the note being edited, or the selected one, and it
  // always becomes the default for the next note: the size last used is the size wanted.
  const nudgeTextSize = (direction) => {
    const target = model.editing || model.selected;
    const next = stepTextSize(target ? target.textSize : model.textSize, direction);
    model.textSize = next;
    if (target) target.textSize = next;
    settle();
    if (target && target !== model.editing) record();
    drawHud();
    return next;
  };

  // A bubble's height: laid out when it is on screen, estimated from its size before
  // that (one line: the padding, the line, the border).
  const heightOf = (callout) => {
    const el = scene.querySelector(`[data-id="${callout.id}"]`);
    return el ? el.offsetHeight : Math.round((callout.textSize || model.textSize) * 2.15) + 2;
  };

  const rectOf = (callout) => ({ x: callout.box.x, y: callout.box.y, w: callout.box.width, h: heightOf(callout) });
  const overlaps = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  const covers = (r, point) => point.x >= r.x && point.x < r.x + r.w && point.y >= r.y && point.y < r.y + r.h;

  // Placement (§3.5): a small deterministic set of candidates near the anchor, in a fixed
  // order, none covering the anchor. The first one inside the composition and clear of
  // the existing bubbles and their anchors wins; failing that, the first clear one, and
  // the margin grows to hold it (fitMargin); failing that, the first. Never content-aware.
  // The gaps are proportions of the text size, so the same picture places the same way
  // at every size: 28 and 24 at the default of 20, which the first version hard-coded.
  const placeCallout = (anchor, width, height, textSize, others) => {
    const gx = Math.round(textSize * 1.4);
    const gy = Math.round(textSize * 1.2);
    const candidates = [
      { x: anchor.x + gx, y: anchor.y + gy }, // below right, the first version's one place
      { x: anchor.x - gx - width, y: anchor.y + gy }, // below left
      { x: anchor.x + gx, y: anchor.y - gy - height }, // above right
      { x: anchor.x - gx - width, y: anchor.y - gy - height }, // above left
      { x: anchor.x + gx, y: anchor.y - Math.round(height / 2) }, // right
      { x: anchor.x - gx - width, y: anchor.y - Math.round(height / 2) }, // left
      { x: anchor.x - Math.round(width / 2), y: anchor.y + gy }, // below
      { x: anchor.x - Math.round(width / 2), y: anchor.y - gy - height }, // above
    ];
    const comp = compositionSize();
    const inside = (c) => c.x >= -model.margin.left && c.y >= -model.margin.top
      && c.x + width <= comp.w - model.margin.left && c.y + height <= comp.h - model.margin.top;
    const clear = (c) => {
      const r = { x: c.x, y: c.y, w: width, h: height };
      return !others.some((o) => overlaps(r, rectOf(o)) || covers(r, o.anchor));
    };
    return candidates.find((c) => inside(c) && clear(c)) || candidates.find(clear) || candidates[0];
  };

  const createCallout = (anchor) => {
    const textSize = model.textSize;
    // Proportional to the text, so a note at 48 px is not three words per line. Thirteen
    // times the size is the 260 px the first version used, at the default of 20.
    const width = Math.round(textSize * 13);
    const at = { x: Math.round(anchor.x), y: Math.round(anchor.y) };
    const height = Math.round(textSize * 2.15) + 2;
    const place = placeCallout(at, width, height, textSize, model.callouts);
    const callout = {
      id: `c${model.nextNumber}`,
      number: model.nextNumber++,
      anchor: at,
      box: { x: place.x, y: place.y, width },
      text: '',
      textSize,
      dirMode: 'auto',
      resolvedDir: 'ltr',
    };
    model.callouts.push(callout);
    // A bubble that could not fit gets its margin now, before it is laid out, so the
    // first paint already shows the room it took.
    if (fitMargin()) paintRegion();
    return callout;
  };

  // The margin the notes need (§3.5): every bubble inside the composition, with its own
  // padding as breathing room, over the floor the checks may set. Recomputed when a note
  // is created, committed, resized, removed or dropped after a drag, never during one, so
  // a bubble being moved does not have the picture shift under it. It shrinks back when
  // the notes no longer need it. Returns whether the margin changed; the fit view follows
  // when the view was at fit, so the whole composition stays in sight.
  const fitMargin = () => {
    if (drag || !model.image.width) return false;
    const need = { ...model.marginFloor };
    for (const callout of model.callouts) {
      const r = rectOf(callout);
      const pad = Math.round((callout.textSize || model.textSize) * 0.4);
      need.left = Math.max(need.left, pad - r.x);
      need.top = Math.max(need.top, pad - r.y);
      need.right = Math.max(need.right, r.x + r.w + pad - model.image.width);
      need.bottom = Math.max(need.bottom, r.y + r.h + pad - model.image.height);
    }
    let changed = false;
    for (const edge of ['left', 'top', 'right', 'bottom']) {
      const value = Math.max(0, Math.round(need[edge]));
      if (value !== model.margin[edge]) { model.margin[edge] = value; changed = true; }
    }
    if (!changed) return false;
    const wasFit = Math.abs(model.zoom - model.fitZoom) < 0.0005;
    model.fitZoom = computeFit();
    if (wasFit) model.zoom = model.fitZoom;
    return true;
  };

  // ---------------------------------------------------------------- saving
  //
  // §3.8: new captures save automatically and later edits save with no Apply action. The
  // notes go to the host as one object, keyed by the document's number, so a save that
  // lands after the page moved on still reaches the right document. Debounced while
  // typing; forced on blur, before navigation, before another document, before a hide and
  // at quit. A failure is shown and the work stays; the next change tries again.
  let saveTimer = null;
  let saving = null;
  const notesOf = () => ({
    callouts: model.callouts,
    nextNumber: model.nextNumber,
    margin: { ...model.margin },
    textSize: model.textSize,
  });
  const markDirty = () => {
    if (!model.image.managed) return;
    model.save.dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { saveNow().catch(() => {}); }, 800);
  };
  const saveNow = async () => {
    clearTimeout(saveTimer);
    if (!model.save.dirty || !model.image.managed || !model.image.document_id) {
      if (saving) await saving;
      return model.save.state;
    }
    // Taken now, before any wait: the page may move to another document meanwhile, and
    // what was pending belongs to this one.
    const documentId = model.image.document_id;
    const notes = JSON.parse(JSON.stringify(notesOf()));
    const save = model.save;
    if (saving) await saving;
    save.dirty = false;
    save.state = 'saving';
    drawHud();
    saving = invoke('editor_save_notes', { documentId, notes }).then(() => {
      save.state = 'saved';
      save.error = '';
    }, (err) => {
      save.dirty = true;
      save.state = 'failed';
      save.error = String(err);
      console.error('save failed', err);
    }).finally(() => { saving = null; drawHud(); });
    await saving;
    return save.state;
  };
  window.addEventListener('blur', () => { saveNow().catch(() => {}); });

  // ---------------------------------------------------------------- undo and redo
  //
  // One snapshot per completed operation: a note committed with its text, moved, its anchor
  // moved, resized, or removed. Recording compares with the step at the cursor, so an
  // operation that changed nothing, an empty bubble discarded at commit for one, adds no
  // step. Undo restores a note with the number it had (§3.5); the margin follows the
  // restored notes through settle.
  const snapshot = () => JSON.stringify({ callouts: model.callouts, nextNumber: model.nextNumber });

  const record = () => {
    const h = model.history;
    const now = snapshot();
    if (h.steps[h.index] === now) return false;
    h.steps.splice(h.index + 1);
    h.steps.push(now);
    h.index = h.steps.length - 1;
    markDirty();
    return true;
  };

  const restore = (step) => {
    const saved = JSON.parse(step);
    model.callouts = saved.callouts;
    model.nextNumber = saved.nextNumber;
    model.selected = null;
    model.editing = null;
    settle();
    markDirty();
    drawHud();
  };

  const undo = () => {
    const h = model.history;
    if (h.index <= 0) return false;
    h.index -= 1;
    restore(h.steps[h.index]);
    return true;
  };

  const redo = () => {
    const h = model.history;
    if (h.index >= h.steps.length - 1) return false;
    h.index += 1;
    restore(h.steps[h.index]);
    return true;
  };

  // Lay the notes out, then give them the margin they need, then paint if that changed.
  const settle = () => {
    layoutScene();
    if (fitMargin()) return paintRegion();
    return Promise.resolve();
  };

  const removeCallout = (callout) => {
    model.callouts = model.callouts.filter((c) => c !== callout);
    if (model.selected === callout) model.selected = null;
    if (model.editing === callout) model.editing = null;
    // The number is NOT reused and the others are not renumbered: gaps stay, in the editor
    // and in every output, which is the decision in §3.5.
  };

  const layoutScene = () => {
    // The same offset the canvas got, so the callout layer stays registered with the
    // pixels it is annotating.
    scene.style.transform =
      `translate(${model.offset.x - (model.pan.x * model.zoom) / dpr()}px, ` +
      `${model.offset.y - (model.pan.y * model.zoom) / dpr()}px)` +
      ` scale(${model.zoom / dpr()})`;

    for (const callout of model.callouts) {
      let el = scene.querySelector(`[data-id="${callout.id}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'callout';
        el.dataset.id = callout.id;
        el.innerHTML = '<div class="n"></div><div class="t" contenteditable="true" spellcheck="false"></div>';
        scene.appendChild(el);

        const anchorEl = document.createElement('div');
        anchorEl.className = 'anchor';
        anchorEl.dataset.anchorFor = callout.id;
        scene.appendChild(anchorEl);
      }
      callout.resolvedDir = resolveDirection(callout);
      el.style.left = `${callout.box.x}px`;
      el.style.top = `${callout.box.y}px`;
      el.style.width = `${callout.box.width}px`;
      // In IMAGE pixels, like every other number in this layer, so one transform scales
      // the text with the picture and the wrapping is decided before the zoom exists.
      el.style.fontSize = `${callout.textSize || model.textSize}px`;
      el.style.direction = callout.resolvedDir;
      el.style.textAlign = callout.resolvedDir === 'rtl' ? 'right' : 'left';
      el.classList.toggle('selected', model.selected === callout);
      el.querySelector('.n').textContent = String(callout.number);
      const textEl = el.querySelector('.t');
      if (textEl.textContent !== callout.text && model.editing !== callout) {
        textEl.textContent = callout.text;
      }

      const anchorEl = scene.querySelector(`[data-anchor-for="${callout.id}"]`);
      anchorEl.style.left = `${callout.anchor.x}px`;
      anchorEl.style.top = `${callout.anchor.y}px`;
    }

    for (const el of [...scene.querySelectorAll('.callout')]) {
      if (!model.callouts.some((c) => c.id === el.dataset.id)) el.remove();
    }
    for (const el of [...scene.querySelectorAll('.anchor')]) {
      if (!model.callouts.some((c) => c.id === el.dataset.anchorFor)) el.remove();
    }

    drawArrows();
  };

  const drawArrows = () => {
    arrows.setAttribute('width', String(model.image.width || 1));
    arrows.setAttribute('height', String(model.image.height || 1));
    let markup = '';
    for (const callout of model.callouts) {
      const el = scene.querySelector(`[data-id="${callout.id}"]`);
      const height = el ? el.offsetHeight : 40;
      const box = {
        x: callout.box.x,
        y: callout.box.y,
        w: callout.box.width,
        h: height,
      };
      const centre = { x: box.x + box.w / 2, y: box.y + box.h / 2 };
      const end = edgePoint(box, callout.anchor, centre);
      markup +=
        `<line x1="${callout.anchor.x}" y1="${callout.anchor.y}" x2="${end.x}" y2="${end.y}"` +
        ` stroke="#7aa7ff" stroke-width="2" stroke-linecap="round" />`;
    }
    arrows.innerHTML = markup;
  };

  /// Where the line from the anchor meets the bubble's edge, so the arrow touches the box
  /// instead of ending under it.
  const edgePoint = (box, from, centre) => {
    const dx = centre.x - from.x;
    const dy = centre.y - from.y;
    if (dx === 0 && dy === 0) return centre;
    const halfW = box.w / 2;
    const halfH = box.h / 2;
    const scale = Math.min(
      dx === 0 ? Infinity : halfW / Math.abs(dx),
      dy === 0 ? Infinity : halfH / Math.abs(dy)
    );
    return { x: centre.x - dx * scale, y: centre.y - dy * scale };
  };

  let currentNotice = '';
  let emptyText = '';
  const drawHud = () => {
    if (!model.image.width) {
      hud.textContent = emptyText + (currentNotice ? `\n${currentNotice}` : '');
      return;
    }
    const target = model.editing || model.selected;
    const sizeShown = target ? (target.textSize || model.textSize) : model.textSize;
    const zoomText = Math.abs(model.zoom - model.fitZoom) < 0.0005
      ? `fit (${(model.zoom * 100).toFixed(0)}%)`
      : `${(model.zoom * 100).toFixed(0)}%`;
    const where = (model.image.file
      ? `${model.image.file}  ${model.image.kind}` +
        (model.image.count > 1 ? `  ${model.image.index + 1} of ${model.image.count}  [ ] to step` : '')
      : model.image.source) +
      (model.image.total > 0 ? `  ${model.image.position} of ${model.image.total} in ${model.image.context}` : '') +
      (model.storage.documents > 0 ? `   ${model.storage.documents} documents, ${(model.storage.bytes / (1024 * 1024)).toFixed(1)} MB on disk` : '');
    const ago = (s) => (s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`);
    const saveText = model.save.state === 'failed' ? `   NOT SAVED: ${model.save.error}`
      : model.save.state === 'saving' ? '   saving' : (model.image.managed ? '   saved' : '');
    const modeLine = model.mode === 'annotate'
      ? `mode annotate   A to view${model.image.source_changed ? '   the file on disk has changed since; this document keeps its own pixels' : ''}${saveText}`
      : `mode view   A to annotate${model.image.edited_ago_s != null ? `   annotated before, ${ago(model.image.edited_ago_s)}; A resumes it` : ''}`;
    hud.textContent =
      `${model.image.width}x${model.image.height}  ${where}\n` +
      `${modeLine}\n` +
      `zoom ${zoomText}   pan ${Math.round(model.pan.x)},${Math.round(model.pan.y)}   ` +
      `callouts ${model.callouts.length}   text ${sizeShown}px   dpr ${dpr()}\n` +
      `0 fit  1 actual size  +/- zoom  wheel pan  Ctrl+wheel zoom  F11 fullscreen  PgUp/PgDn previous next  Ctrl +/- text size  arrows pan  ${model.mode === 'annotate' ? 'click to add' : 'drag to pan'}  Esc commit  Del remove  Ctrl+Z/Y undo redo  Ctrl+C copy  Ctrl+Enter copy and return  Ctrl+S save as  Ctrl+Del delete document  Ctrl+O open` +
      (currentNotice ? `\n${currentNotice}` : '');
  };

  // ---------------------------------------------------------------- the timeline
  //
  // S2.1: the documents, oldest first, as thumbnails the host makes once and keeps beside
  // each document. A click shows that document with its notes; the keys walk the same list
  // as history. Refreshed whenever a document is loaded or created.
  const thumbUrls = new Map();
  const thumbFor = async (id) => {
    if (thumbUrls.has(id)) return thumbUrls.get(id);
    const response = await fetch(`http://region.localhost/?thumb=${id}`, { cache: 'no-store' });
    if (!response.ok) throw new Error(`thumbnail ${id}: ${response.status}`);
    const url = URL.createObjectURL(await response.blob());
    thumbUrls.set(id, url);
    return url;
  };
  let stripMode = 'documents';
  const refreshStrip = async () => {
    if (stripMode === 'trash') return renderTrash();
    document.body.classList.remove('trash');
    const docs = await invoke('editor_documents').catch(() => []);
    const trashed = await invoke('editor_trash_documents').catch(() => []);
    model.storage = await invoke('editor_storage').catch(() => model.storage);
    document.body.classList.toggle('strip', (docs.length > 0 || trashed.length > 0) && !model.fullscreen);
    for (const el of [...strip.querySelectorAll('.chip, .thumb.trashed')]) el.remove();
    const seen = new Set();
    for (const doc of docs) {
      seen.add(doc.id);
      let el = strip.querySelector(`[data-id="${doc.id}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'thumb';
        el.dataset.id = String(doc.id);
        el.textContent = `${doc.width}x${doc.height}`;
        el.addEventListener('click', () => {
          invoke('editor_show_document', { id: doc.id }).then((info) => loadImage(info)).catch((err) => console.error('timeline', err));
        });
        // The delete (§3.8, S2.5): into Recon's trash for thirty days; one click, no dialog.
        const x = document.createElement('button');
        x.className = 'x';
        x.type = 'button';
        x.textContent = '×';
        x.title = 'Delete this document (Recon keeps it in its trash for 30 days)';
        x.addEventListener('click', (event) => {
          event.stopPropagation();
          deleteDocument(doc.id).catch((err) => console.error('delete', err));
        });
        el.appendChild(x);
        strip.appendChild(el);
        thumbFor(doc.id).then((url) => {
          const img = document.createElement('img');
          img.src = url;
          img.alt = '';
          el.insertBefore(img, el.firstChild);
          for (const node of [...el.childNodes]) if (node.nodeType === Node.TEXT_NODE) node.remove();
        }).catch((err) => console.warn(String(err)));
      }
      const when = new Date(doc.created_ms);
      el.title = `${doc.file || 'capture'}  ${doc.width}x${doc.height}  ${when.toLocaleString()}`;
      el.classList.toggle('current', doc.current);
      strip.appendChild(el); // in list order
    }
    for (const el of [...strip.children]) {
      if (!seen.has(Number(el.dataset.id))) el.remove();
    }
    if (trashed.length > 0) {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.type = 'button';
      chip.id = 'trash-chip';
      chip.textContent = `Trash · ${trashed.length}`;
      chip.title = 'What was deleted in the last 30 days';
      chip.addEventListener('click', () => { stripMode = 'trash'; renderTrash().catch(() => {}); chip.blur(); });
      strip.appendChild(chip);
    }
    const current = strip.querySelector('.thumb.current');
    if (current) current.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  };

  const renderTrash = async () => {
    const trashed = await invoke('editor_trash_documents').catch(() => []);
    document.body.classList.add('trash');
    document.body.classList.toggle('strip', !model.fullscreen);
    strip.replaceChildren();
    const back = document.createElement('button');
    back.className = 'chip';
    back.type = 'button';
    back.id = 'trash-back';
    back.textContent = trashed.length ? 'Back' : 'The trash is empty; back';
    back.addEventListener('click', () => { stripMode = 'documents'; refreshStrip().catch(() => {}); back.blur(); });
    strip.appendChild(back);
    for (const doc of trashed) {
      const el = document.createElement('div');
      el.className = 'thumb trashed';
      el.dataset.id = String(doc.id);
      el.title = `${doc.file || 'capture'}  ${doc.width}x${doc.height}  deleted ${doc.days} day${doc.days === 1 ? '' : 's'} ago; gone for good after 30`;
      el.textContent = `${doc.width}x${doc.height}`;
      const restore = document.createElement('button');
      restore.className = 'restore';
      restore.type = 'button';
      restore.textContent = 'Restore';
      restore.addEventListener('click', (event) => {
        event.stopPropagation();
        invoke('editor_trash_restore', { id: doc.id }).then(async (info) => {
          stripMode = 'documents';
          await loadImage(info);
          await refreshStrip();
          notice('restored from the trash', 3000);
        }).catch((err) => { notice(`NOT RESTORED: ${err}`, 0); });
      });
      el.appendChild(restore);
      strip.appendChild(el);
      thumbFor(doc.id).then((url) => {
        const img = document.createElement('img');
        img.src = url;
        img.alt = '';
        el.insertBefore(img, el.firstChild);
        for (const node of [...el.childNodes]) if (node.nodeType === Node.TEXT_NODE) node.remove();
      }).catch(() => {});
    }
  };

  // A document deleted: out of the timeline and, when it was the one on screen, the
  // neighbour shows or the editor is empty. The host says what remains.
  const deleteDocument = async (id) => {
    const info = await invoke('editor_delete_document', { id });
    documents.delete(id);
    if (info) {
      await loadImage(info);
      await refreshStrip();
    } else {
      await showEmpty();
    }
    notice('deleted; Recon keeps it in its trash for 30 days', 4000);
  };

  const showEmpty = async () => {
    model.image = { width: 0, height: 0, source: '' };
    model.callouts = [];
    model.selected = null;
    model.editing = null;
    canvas.style.display = 'none';
    mat.style.display = 'none';
    layoutScene();
    applyMode();
    await refreshStrip();
    const hotkey = await invoke('editor_hotkey').catch(() => '');
    emptyText = emptyStateText(hotkey);
    drawHud();
  };

  // ---------------------------------------------------------------- the mode
  //
  // §3.3: viewing arms no tool, annotation arms the callout. The mode is the page's; the
  // document behind it is the host's, and Annotate asks the host for it: created for the
  // file on screen, or resumed if one exists for that file and frame, never a second one.
  const applyMode = () => {
    document.body.classList.toggle('viewing', model.mode !== 'annotate');
    modeButton.textContent = model.mode === 'annotate' ? 'View' : 'Annotate';
    controls.hidden = !model.image.width;
    drawHud();
  };
  modeButton.addEventListener('click', () => {
    setMode(model.mode === 'annotate' ? 'view' : 'annotate').catch((err) => console.error('mode', err));
    // The keys stay the page's: a focused button would swallow Space and Enter.
    modeButton.blur();
  });
  // The image, with the note being typed if there is one, as Ctrl+C outside typing does.
  document.getElementById('copy').addEventListener('click', (event) => {
    copyComposed().catch(() => {});
    event.currentTarget.blur();
  });
  document.getElementById('saveas').addEventListener('click', (event) => {
    saveAs().catch(() => {});
    event.currentTarget.blur();
  });

  const setMode = async (mode) => {
    if (mode === model.mode) return model.mode;
    if (mode === 'annotate') {
      const info = await invoke('editor_annotate');
      // A resumed document is another number, so its notes come back through loadImage;
      // the view stays where it was when the image is the same size, so nothing jumps.
      const view = { zoom: model.zoom, pan: { ...model.pan } };
      const sameSize = info.width === model.image.width && info.height === model.image.height;
      await loadImage(info);
      if (sameSize) {
        model.zoom = view.zoom;
        model.pan = view.pan;
        await paintRegion();
      }
      model.mode = 'annotate';
      refreshStrip().catch(() => {});
    } else {
      if (model.editing) commitEditing();
      model.selected = null;
      layoutScene();
      model.mode = 'view';
    }
    applyMode();
    return model.mode;
  };

  // ---------------------------------------------------------------- editing

  const startEditing = (callout) => {
    // Another note still being typed is committed first. Without this its typed text was
    // never read back: layoutScene rewrote its element from the stale model text, and what
    // had been typed was gone (review of 2026-09-13, R1).
    if (model.editing && model.editing !== callout) commitEditing();
    model.editing = callout;
    model.selected = callout;
    layoutScene();
    const el = scene.querySelector(`[data-id="${callout.id}"] .t`);
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  };

  const commitEditing = () => {
    const callout = model.editing;
    if (!callout) return;
    const el = scene.querySelector(`[data-id="${callout.id}"] .t`);
    // innerText, not textContent: the engine keeps a typed line break as a block, and
    // textContent joins blocks with nothing between them, so a two-line note came back as
    // one line (review T6). innerText turns the blocks into newlines, which pre-wrap shows.
    callout.text = el
      ? el.innerText.replace(/\u00a0/g, ' ').replace(/\r\n?/g, '\n').replace(/\n+$/, '')
      : callout.text;
    model.editing = null;
    if (el) el.blur();
    // An empty bubble is discarded when editing ends, so it never reaches the output.
    if (callout.text.trim() === '') {
      removeCallout(callout);
    }
    settle();
    record();
    drawHud();
  };

  // ---------------------------------------------------------------- input

  let drag = null;

  stage.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) return;
    const target = event.target;

    // Viewing mode: the drag pans, whatever it started on, and nothing is created or
    // selected (§3.3). The scene takes no pointer in this mode, so the target is the
    // stage or the canvas either way.
    if (model.mode !== 'annotate') {
      if (!model.image.width) return;
      drag = { kind: 'pan', x: event.clientX, y: event.clientY, pan: { ...model.pan } };
      try { stage.setPointerCapture(event.pointerId); } catch (e) { /* a synthetic pointer */ }
      event.preventDefault();
      return;
    }

    if (target.classList.contains('t')) {
      const callout = model.callouts.find((c) => c.id === target.closest('.callout').dataset.id);
      startEditing(callout);
      return;
    }

    if (target.classList.contains('anchor')) {
      const callout = model.callouts.find((c) => c.id === target.dataset.anchorFor);
      const point = toImage(event);
      drag = { kind: 'anchor', callout, dx: callout.anchor.x - point.x, dy: callout.anchor.y - point.y };
      try { target.setPointerCapture(event.pointerId); } catch (e) { /* a synthetic pointer */ }
      event.preventDefault();
      return;
    }

    const box = target.closest('.callout');
    if (box) {
      const callout = model.callouts.find((c) => c.id === box.dataset.id);
      model.selected = callout;
      const point = toImage(event);
      drag = { kind: 'box', callout, dx: callout.box.x - point.x, dy: callout.box.y - point.y };
      try { stage.setPointerCapture(event.pointerId); } catch (e) { /* a synthetic pointer */ }
      layoutScene();
      event.preventDefault();
      return;
    }

    // Empty canvas. Committing first means a click somewhere else ends the note being
    // typed, which is what "no Apply step" has to feel like.
    if (model.editing) {
      commitEditing();
      return;
    }
    if (model.selected) {
      model.selected = null;
      layoutScene();
      return;
    }
    const callout = createCallout(toImage(event));
    layoutScene();
    startEditing(callout);
  });

  stage.addEventListener('pointermove', (event) => {
    if (!drag) return;
    if (drag.kind === 'pan') {
      model.pan.x = drag.pan.x - ((event.clientX - drag.x) * dpr()) / model.zoom;
      model.pan.y = drag.pan.y - ((event.clientY - drag.y) * dpr()) / model.zoom;
      paintRegion();
      return;
    }
    const point = toImage(event);
    if (drag.kind === 'anchor') {
      drag.callout.anchor.x = Math.round(point.x + drag.dx);
      drag.callout.anchor.y = Math.round(point.y + drag.dy);
    } else {
      drag.callout.box.x = Math.round(point.x + drag.dx);
      drag.callout.box.y = Math.round(point.y + drag.dy);
    }
    layoutScene();
  });

  // Pasted text arrives as text. Rich HTML in a bubble would be markup the export never
  // agreed to carry.
  stage.addEventListener('paste', (event) => {
    if (!model.editing) return;
    event.preventDefault();
    const text = (event.clipboardData || window.clipboardData).getData('text/plain');
    if (text) document.execCommand('insertText', false, text.replace(/\r\n?/g, '\n'));
  });

  const endDrag = () => {
    if (!drag) return;
    const moved = drag.kind !== 'pan';
    drag = null;
    // A dropped bubble takes, or gives back, its margin, and is one step of history.
    settle();
    if (moved) record();
  };
  // A note growing as it is typed takes its room as it goes, so nothing it holds is ever
  // outside the composition an export would cut at.
  stage.addEventListener('input', () => {
    if (!model.editing) return;
    // The typed text is read into the model at commit; saving it before that would save
    // the previous text under the new timestamp, so a keystroke commits the text to the
    // model first, without ending the editing.
    const el = scene.querySelector(`[data-id="${model.editing.id}"] .t`);
    if (el) model.editing.text = el.innerText.replace(/\u00a0/g, ' ').replace(/\r\n?/g, '\n').replace(/\n+$/, '');
    markDirty();
    if (fitMargin()) paintRegion();
  });
  // The wheel pans; with Ctrl it zooms around the pointer (§3.4). The wheel's numbers are
  // CSS pixels, so they become image pixels through the ratio and the zoom.
  stage.addEventListener('wheel', (event) => {
    if (!model.image.width) return;
    event.preventDefault();
    if (event.ctrlKey) {
      const factor = event.deltaY < 0 ? 1.25 : 1 / 1.25;
      const box = stage.getBoundingClientRect();
      setZoomAround(model.zoom * factor, event.clientX - box.left, event.clientY - box.top);
      return;
    }
    const step = event.deltaMode === 1 ? 40 : 1;
    model.pan.x += (event.deltaX * step * dpr()) / model.zoom;
    model.pan.y += (event.deltaY * step * dpr()) / model.zoom;
    paintRegion();
  }, { passive: false });

  const setFullscreen = async (on) => {
    model.fullscreen = await invoke('editor_fullscreen', { on });
    document.body.classList.toggle('strip', strip.children.length > 0 && !model.fullscreen);
    await measureRatio();
    model.fitZoom = computeFit();
    await paintRegion();
    return model.fullscreen;
  };

  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', (event) => {
    // Copy the composed image, current text edits included, from anywhere (§3.6).
    // By physical key, so the shortcut is the same under a Hebrew layout, where event.key
    // for that key is a Hebrew letter. The rest of the keyboard contract is S1.7.
    if (event.ctrlKey && event.shiftKey && !event.altKey && event.code === 'KeyC') {
      copyComposed().catch((err) => console.error('copy failed', err && err.stack ? err.stack : String(err)));
      event.preventDefault();
      return;
    }
    // Ctrl+O opens a file through Windows' own picker (§3.1); by physical key, like the
    // copy above.
    if (event.ctrlKey && !event.shiftKey && !event.altKey && event.code === 'KeyO') {
      invoke('editor_open_dialog').catch((err) => console.error('open', err));
      event.preventDefault();
      return;
    }
    // Text size, and it works while typing too: Ctrl is not a character, so the note being
    // written can be resized without leaving it.
    if (event.ctrlKey && !event.altKey && (event.key === '+' || event.key === '=')) {
      nudgeTextSize(1);
      event.preventDefault();
      return;
    }
    if (event.ctrlKey && !event.altKey && (event.key === '-' || event.key === '_')) {
      nudgeTextSize(-1);
      event.preventDefault();
      return;
    }
    if (event.key === 'Enter' && model.editing && !event.ctrlKey && !event.altKey) {
      // A newline CHARACTER rather than the engine's block, so the bubble stays one text
      // node and what is typed is exactly what is stored (§3.6: Enter inserts a newline).
      document.execCommand('insertText', false, '\n');
      event.preventDefault();
      return;
    }
    // Copy and Return, from anywhere, a note being typed included (§3.6).
    if (event.ctrlKey && !event.shiftKey && !event.altKey && event.key === 'Enter') {
      copyAndReturn().catch((err) => console.error('copy and return failed', err && err.stack ? err.stack : String(err)));
      event.preventDefault();
      return;
    }
    // Save As, a new PNG file every time (§3.6). Taken while typing too, so the web view's
    // own save page dialog never appears.
    if (event.ctrlKey && !event.shiftKey && !event.altKey && event.code === 'KeyS') {
      saveAs().catch((err) => console.error('save as', err));
      event.preventDefault();
      return;
    }
    // Send to Rogers is stage 4: the key is taken and does nothing yet.
    if (event.ctrlKey && event.shiftKey && !event.altKey && event.key === 'Enter') {
      event.preventDefault();
      return;
    }
    if (event.key === 'Escape') {
      if (model.editing) { commitEditing(); event.preventDefault(); return; }
      if (model.selected) { model.selected = null; layoutScene(); event.preventDefault(); return; }
      // Fullscreen leaves first (§3.6); the hide is the Escape after it.
      if (model.fullscreen) { setFullscreen(false).catch((err) => console.error('fullscreen', err)); event.preventDefault(); return; }
      // The idle editor: pending changes are saved, then hide, and the focus goes back to
      // where the capture began (§3.1, §3.8).
      saveNow().catch(() => 'failed').then((state) => {
        if (state === 'failed') {
          notice(`NOT SAVED: ${model.save.error}. The editor stays with your work`, 0);
          return null;
        }
        return invoke('editor_hide');
      }).catch((err) => console.error('hide', err));
      event.preventDefault();
      return;
    }
    if (model.editing) return; // typing owns every other key, the engine's undo included

    // Outside text editing, Ctrl+C copies the composed image (§3.6); while editing it is
    // the text copy it always was, which is why it sits below the line above.
    if (event.ctrlKey && !event.shiftKey && !event.altKey && event.code === 'KeyC') {
      copyComposed().catch((err) => console.error('copy failed', err && err.stack ? err.stack : String(err)));
      event.preventDefault();
      return;
    }
    if (event.ctrlKey && !event.altKey && event.code === 'KeyZ') {
      if (event.shiftKey) redo(); else undo();
      event.preventDefault();
      return;
    }
    if (event.ctrlKey && !event.shiftKey && !event.altKey && event.code === 'KeyY') {
      redo();
      event.preventDefault();
      return;
    }
    if (event.key === 'F11') {
      setFullscreen(!model.fullscreen).catch((err) => console.error('fullscreen', err));
      event.preventDefault();
      return;
    }
    // Ctrl+Delete deletes the document on screen (S2.5, provisional key); plain Delete
    // stays the selected note's.
    if (event.key === 'Delete' && event.ctrlKey && !event.shiftKey && !event.altKey) {
      if (model.image.document_id && model.image.managed) deleteDocument(model.image.document_id).catch((err) => console.error('delete', err));
      event.preventDefault();
      return;
    }
    if (event.key === 'Delete' || event.key === 'Backspace') {
      if (model.selected) { removeCallout(model.selected); settle(); record(); drawHud(); event.preventDefault(); }
      return;
    }
    if (event.key === 'Enter' && model.selected) { startEditing(model.selected); event.preventDefault(); return; }

    // Annotate, and back to viewing (§3.3). A provisional key until the control is
    // decided; by physical key like the others.
    if (event.code === 'KeyA' && !event.ctrlKey && !event.altKey && !event.metaKey) {
      setMode(model.mode === 'annotate' ? 'view' : 'annotate').catch((err) => console.error('mode', err));
      event.preventDefault();
      return;
    }

    // Previous and next through the folder the file came from, first and last at the ends
    // (§3.4, §3.6). The host answers with the image now on screen; at an end that is the
    // same one, and the same document keeps its view.
    const steps = { PageDown: 'next', PageUp: 'previous', Home: 'first', End: 'last' };
    if (steps[event.key] && model.image.total > 0) {
      saveNow().catch(() => {});
      invoke('editor_navigate', { step: steps[event.key] })
        .then((info) => loadImage(info))
        .catch((err) => console.error('navigate', err));
      event.preventDefault();
      return;
    }

    // Frames of an animation or pages of a file, by index, which is §3.7's contract made
    // visible: the frame on screen is the one asked for, never a default first frame.
    if ((event.key === ']' || event.key === '[') && model.image.count > 1) {
      const next = event.key === ']'
        ? Math.min(model.image.count - 1, model.image.index + 1)
        : Math.max(0, model.image.index - 1);
      if (next !== model.image.index) invoke('editor_frame', { index: next }).catch((err) => console.error('frame', err));
      return;
    }
    const step = 120;
    if (event.key === '0') { setZoom(model.fitZoom); return; }
    if (event.key === '1') { setZoom(1); return; }
    if (event.key === '+' || event.key === '=') { setZoom(model.zoom * 1.5); return; }
    if (event.key === '-') { setZoom(model.zoom / 1.5); return; }
    if (event.key === 'ArrowLeft') { model.pan.x -= step; paintRegion(); return; }
    if (event.key === 'ArrowRight') { model.pan.x += step; paintRegion(); return; }
    if (event.key === 'ArrowUp') { model.pan.y -= step; paintRegion(); return; }
    if (event.key === 'ArrowDown') { model.pan.y += step; paintRegion(); return; }
  });

  // Zooms so that one image point stays under one viewport point: the centre for a key,
  // the pointer for the wheel (§3.4). Anything else feels like the image jumped.
  const setZoomAround = (next, cssX, cssY) => {
    const vp = viewport();
    const at = {
      x: model.pan.x + ((cssX - model.offset.x) * dpr()) / model.zoom,
      y: model.pan.y + ((cssY - model.offset.y) * dpr()) / model.zoom,
    };
    model.zoom = Math.min(8, Math.max(model.fitZoom / 4, next));
    model.pan.x = at.x - ((cssX - model.offset.x) * dpr()) / model.zoom;
    model.pan.y = at.y - ((cssY - model.offset.y) * dpr()) / model.zoom;
    return paintRegion();
  };

  const setZoom = (next) => {
    const vp = viewport();
    const before = {
      x: model.pan.x + (vp.w * dpr()) / model.zoom / 2,
      y: model.pan.y + (vp.h * dpr()) / model.zoom / 2,
    };
    model.zoom = Math.min(8, Math.max(model.fitZoom / 4, next));
    // Zooming keeps the centre of the view where it was, which is the only behaviour that
    // does not feel like the image jumped.
    model.pan.x = before.x - (vp.w * dpr()) / model.zoom / 2;
    model.pan.y = before.y - (vp.h * dpr()) / model.zoom / 2;
    // Returned so a caller can wait for the pixels. A check that sleeps instead of waiting
    // measures whatever was on the canvas before, which is how the first version of the
    // detail check passed a fit view while reading a 1:1 one.
    return paintRegion();
  };

  const compositionSize = () => ({
    w: model.image.width + model.margin.left + model.margin.right,
    h: model.image.height + model.margin.top + model.margin.bottom,
  });

  const computeFit = () => {
    const vp = viewport();
    if (!model.image.width) return 1;
    const comp = compositionSize();
    return Math.min((vp.w * dpr()) / comp.w, (vp.h * dpr()) / comp.h, 1);
  };

  const marginString = () =>
    `${model.margin.left},${model.margin.top},${model.margin.right},${model.margin.bottom}`;

  const setMargin = (margin) => {
    for (const edge of ['left', 'top', 'right', 'bottom']) {
      model.marginFloor[edge] = Math.max(0, Math.round(margin[edge] || 0));
      model.margin[edge] = model.marginFloor[edge];
    }
    fitMargin();
    model.fitZoom = computeFit();
    return paintRegion();
  };

  window.addEventListener('resize', async () => {
    await measureRatio();
    model.fitZoom = computeFit();
    paintRegion();
  });

  // ---------------------------------------------------------------- startup and the checks

  const loadImage = async (info) => {
    // The same document again, another frame of it or the same one told twice: the view
    // and the notes stay. A note placed on frame 2 is meant to stay while frame 3 is looked
    // at, and a capture the host announced and the checks loaded is one document.
    const sameDocument = model.image.document_id && info.document_id === model.image.document_id
      && info.width === model.image.width && info.height === model.image.height;
    if (sameDocument) {
      model.image = info;
      await paintRegion();
      return;
    }
    stashCurrent();
    model.image = info;
    canvas.style.display = '';
    let known = documents.get(info.document_id);
    if (!known && info.managed) {
      const saved = await invoke('editor_notes', { documentId: info.document_id }).catch(() => null);
      if (saved && Array.isArray(saved.callouts)) {
        known = {
          callouts: saved.callouts,
          nextNumber: saved.nextNumber || 1,
          margin: saved.margin || { left: 0, top: 0, right: 0, bottom: 0 },
          marginFloor: { left: 0, top: 0, right: 0, bottom: 0 },
          textSize: saved.textSize || model.textSize,
          history: null,
        };
      }
    }
    model.save = { state: 'saved', error: '', dirty: false };
    model.margin = known ? { ...known.margin } : { left: 0, top: 0, right: 0, bottom: 0 };
    model.marginFloor = known ? { ...known.marginFloor } : { left: 0, top: 0, right: 0, bottom: 0 };
    model.callouts = known ? known.callouts : [];
    model.nextNumber = known ? known.nextNumber : 1;
    if (known) model.textSize = known.textSize;
    model.selected = null;
    model.editing = null;
    // A capture opens ready for annotation; a file opens in viewing, and a document
    // resumed for it opens where it left off (§3.3).
    model.mode = info.managed ? 'annotate' : 'view';
    model.history = known && known.history ? known.history : { steps: [snapshot()], index: 0 };
    applyMode();
    model.fitZoom = computeFit();
    model.zoom = model.fitZoom;
    model.pan = { x: 0, y: 0 };
    refreshStrip().catch(() => {});
    await paintRegion();
  };

  // ---------------------------------------------------------------- the export layer
  //
  // Part 5: the text is DOM, and the export is that same DOM. The scene subtree is cloned,
  // every style it was laid out with is written inline, the editing decorations are left
  // out, and the clone goes into an SVG foreignObject at the image's own size. Drawn into a
  // canvas and encoded, only that layer crosses back to the host, which composites it over
  // the untouched source. Whether the canvas can be read back after drawing such an image
  // is the unspecified behaviour S0.6 watches, and this is where it is measured.
  const inlineStyles = (source, target) => {
    const computed = getComputedStyle(source);
    let css = '';
    for (let i = 0; i < computed.length; i += 1) {
      const name = computed[i];
      css += `${name}:${computed.getPropertyValue(name)};`;
    }
    target.setAttribute('style', css);
    target.removeAttribute('class');
    target.removeAttribute('contenteditable');
    target.removeAttribute('spellcheck');
    const sourceChildren = source.children;
    const targetChildren = target.children;
    for (let i = 0; i < sourceChildren.length; i += 1) {
      inlineStyles(sourceChildren[i], targetChildren[i]);
    }
  };

  // Colours only, never layout: the export and the live comparison both read the scene
  // with this on, and the check asserts the text box does not move by a pixel.
  const setPlain = (on) => document.body.classList.toggle('plain', !!on);

  const exportLayer = async () => {
    const { w: width, h: height } = compositionSize();
    // The layer is a SNAPSHOT of the composition as it is, note being typed included
    // (§3.6: copy carries the current text edits). Nothing is committed and nothing loses
    // focus; the editing decorations are stripped by the plain state while the styles are
    // read, and put back before this function returns.
    setPlain(true);
    const root = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
    root.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
    root.setAttribute('style', `position:relative;width:${width}px;height:${height}px;margin:0;overflow:visible;`);
    // Image space sits inside canvas space at the margin offset (part 5).
    const inner = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
    inner.setAttribute('style', `position:absolute;left:${model.margin.left}px;top:${model.margin.top}px;width:${model.image.width}px;height:${model.image.height}px;overflow:visible;`);
    root.appendChild(inner);
    try {
      for (const child of scene.children) {
        if (child.classList && child.classList.contains('anchor')) continue; // editing UI
        const clone = child.cloneNode(true);
        if (child.id === 'arrows') {
          clone.removeAttribute('id');
          clone.setAttribute('style', 'position:absolute;left:0;top:0;overflow:visible;');
        } else {
          inlineStyles(child, clone);
        }
        inner.appendChild(clone);
      }
    } finally {
      setPlain(false);
    }
    const markup = new XMLSerializer().serializeToString(root);
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
      `<foreignObject x="0" y="0" width="${width}" height="${height}">${markup}</foreignObject></svg>`;

    const started = performance.now();
    const image = new Image();
    image.decoding = 'sync';
    const loaded = new Promise((resolve, reject) => {
      image.onload = () => resolve();
      image.onerror = () => reject(new Error('the serialized layer did not load as an image'));
    });
    image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    await loaded;
    const rasterMs = performance.now() - started;

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext('2d');
    context.drawImage(image, 0, 0);
    let blob;
    let originClean = true;
    try {
      blob = await new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob gave nothing'))), 'image/png'));
    } catch (err) {
      originClean = false;
      let more = '';
      try { more = `; toDataURL gave ${canvas.toDataURL('image/png').length} chars`; } catch (e2) { more = `; toDataURL threw ${e2.message}`; }
      throw new Error(`the canvas could not be read back after drawing the layer: ${err.message}${more}`);
    }
    const encodeMs = performance.now() - started - rasterMs;
    const bytes = new Uint8Array(await blob.arrayBuffer());
    return { bytes, svgChars: svg.length, rasterMs, encodeMs, originClean, margin: marginString(), markup };
  };

  // Copy the composed image (§3.6): the layer to the host, which composes it over the
  // untouched source and publishes the clipboard. The success line shows only after the
  // host said it succeeded, and it is a HUD line, not a dialog.
  let noticeTimer = null;
  // A line under the HUD: for a moment when it is good news, until the next notice when it
  // is not. Never a dialog (§3.3: an actionable message, and the work stays). The HUD
  // draws it on every redraw, so a redraw for any other reason cannot wipe it.
  const notice = (text, ms) => {
    currentNotice = text;
    clearTimeout(noticeTimer);
    if (ms) noticeTimer = setTimeout(() => { currentNotice = ''; drawHud(); }, ms);
    drawHud();
  };
  const copyComposed = async () => {
    let layer;
    let report;
    try {
      layer = await exportLayer();
      report = await invoke('editor_copy', layer.bytes, { headers: { margin: layer.margin } });
    } catch (err) {
      notice(`NOT COPIED: ${err}. Your work is here; try again`, 0);
      throw err;
    }
    console.log(`copied ${report.width}x${report.height}: composed ${report.compose_ms} ms, encoded ${report.published.encode_ms} ms, published ${report.published.publish_ms} ms as ${report.published.formats.join(', ')}`);
    notice(`copied ${report.width}x${report.height} to the clipboard`, 1500);
    return report;
  };

  // Copy and Return (§3.3): the note being typed is committed, the image is copied, and
  // the editor hides only after the copy succeeded, unless the document changed meanwhile,
  // in which case the copy is reported and the work stays on screen. The pending save
  // before the hide is S1.8's.
  const copyAndReturn = async () => {
    if (model.editing) commitEditing();
    const document_id = model.image.document_id;
    const before = snapshot();
    let report;
    try {
      report = await copyComposed();
    } catch (err) {
      // Nothing left the editor: the notice is on screen and the work is where it was.
      return { hidden: false, copied: false, reason: String(err) };
    }
    const movedOn = model.image.document_id !== document_id || snapshot() !== before || model.editing;
    if (movedOn) {
      notice(`copied ${report.width}x${report.height}; the editor stays, since you moved on`, 2500);
      return { ...report, hidden: false, copied: true, reason: 'moved on' };
    }
    const saved = await saveNow();
    if (saved === 'failed') {
      notice(`copied ${report.width}x${report.height}, but NOT SAVED: ${model.save.error}. The editor stays with your work`, 0);
      return { ...report, hidden: false, copied: true, reason: 'save failed' };
    }
    const returned = await invoke('editor_hide');
    return { ...report, hidden: true, copied: true, returned };
  };

  // Save As (§3.6, S1.11): the composition as it is now goes to the host, which opens
  // Windows' own Save As with the last export folder and a name derived from the source.
  // The outcome comes back as an event: saved, nothing saved, or NOT SAVED with the
  // reason; a name that exists is never written over, and the notice says which name was
  // offered instead.
  const saveAs = async () => {
    if (!model.image.width) return;
    let layer;
    try {
      layer = await exportLayer();
      await invoke('editor_save_as', layer.bytes, { headers: { margin: layer.margin } });
      notice('Save As is open', 0);
    } catch (err) {
      notice(`NOT SAVED: ${err}`, 0);
      throw err;
    }
  };

  window.reconEditor = {
    model,
    loadImage,
    setZoom,
    paintRegion,
    layoutScene,
    measureRatio,
    ratioOf: () => ratio,
    createCallout,
    removeCallout,
    TEXT_SIZES,
    stepTextSize,
    nudgeTextSize,
    startEditing,
    commitEditing,
    resolveDirection,
    exportLayer,
    copyComposed,
    setZoomAround,
    setFullscreen,
    setMode,
    stage,
    settle,
    record,
    undo,
    redo,
    saveNow,
    markDirty,
    notice,
    saveAs,
    refreshStrip,
    strip,
    deleteDocument,
    renderTrash,
    snapshot,
    copyAndReturn,
    fitMargin,
    heightOf,
    placeCallout,
    documents,
    emptyStateText,
    setMargin,
    marginString,
    setPlain,
    canvas,
    context,
  };

  const boot = async () => {
    console.log('page booted, asking the host for an image');
    await measureRatio();
    // A capture can arrive at any moment after this page booted: the host hands the
    // editor the pixels, tells the page, and shows the window (S0.4b).
    await window.__TAURI__.event.listen('capture-ready', async (event) => {
      const arrived = performance.now();
      await loadImage(event.payload);
      drawHud();
      console.log(`capture shown ${Math.round(performance.now() - arrived)} ms after the page heard of it`);
      // S0.7's two editor marks, each sent the moment it happens and stamped by the host
      // when it arrives, so late by one crossing and never early. Painted: the second
      // animation frame after the new pixels went into the canvas. Focused: the new image
      // is loaded and this page has the keyboard, so a click or a key lands on it.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        invoke('editor_mark', { name: 'page painted' }).catch(() => {});
      }));
      const focused = document.hasFocus() || await Promise.race([
        new Promise((resolve) => window.addEventListener('focus', () => resolve(true), { once: true })),
        new Promise((resolve) => setTimeout(() => resolve(false), 3000)),
      ]);
      if (focused) invoke('editor_mark', { name: 'page focused' }).catch(() => {});
    });
    await window.__TAURI__.event.listen('save-as-offered', (event) => notice(event.payload.line, 0));
    await window.__TAURI__.event.listen('save-as-done', (event) => {
      notice(event.payload.line, event.payload.state === 'failed' ? 0 : 3000);
    });
    await window.__TAURI__.event.listen('save-now', async () => {
      try { await saveNow(); } finally { invoke('editor_saves_flushed').catch(() => {}); }
    });
    invoke('editor_mark', { name: 'page booted' }).catch(() => {});
    try {
      const info = await invoke('editor_image_info');
      await loadImage(info);
    } catch (err) {
      // Nothing captured yet. In a checks build the probe makes the window useful on its
      // own; in the product the window simply waits, hidden, for the first capture.
      try {
        const info = await invoke('editor_load_probe', { width: 3840, height: 2160 });
        await loadImage(info);
      } catch (noProbe) {
        const hotkey = await invoke('editor_hotkey').catch(() => '');
        hud.textContent = emptyStateText(hotkey);
        return;
      }
    }
    drawHud();
    if (await flag('editor_wants_demo')) {
      // A real capture rather than the probe, two notes with the two directions this
      // product exists for, and one of them re-anchored so the arrow is doing something.
      const shot = await invoke('editor_load_screen');
      await loadImage(shot);
      const a = createCallout({ x: Math.round(shot.width * 0.22), y: Math.round(shot.height * 0.28) });
      a.text = 'This label is the wrong one: it shows the group status, not the item.';
      // The second one after a couple of Ctrl+ steps, so the shot shows the default size
      // and a chosen one side by side.
      model.textSize = 40;
      const b = createCallout({ x: Math.round(shot.width * 0.62), y: Math.round(shot.height * 0.55) });
      b.text = 'הכיתוב הזה צריך להיות מיושר לימין, וגם באנגלית in the same bubble.';
      b.box.x += 40;
      b.box.y += 90;
      model.selected = b;
      layoutScene();
      drawHud();
      await new Promise((r) => setTimeout(r, 900));
      await invoke('editor_shoot_window');

      // Then the export spike (S0.6): the same scene, serialized, rasterized, encoded,
      // composited by the host over the untouched capture, and checked pixel by pixel.
      try {
        const layer = await exportLayer();
        console.log(`export layer: ${layer.svgChars} chars of svg, rasterized in ${layer.rasterMs.toFixed(0)} ms, encoded in ${layer.encodeMs.toFixed(0)} ms, ${layer.bytes.length} bytes, origin-clean ${layer.originClean}`);
        const sent = performance.now();
        const report = await invoke('editor_export_check', layer.bytes, { headers: { name: 'demo', margin: layer.margin, mode: 'source' } });
        console.log(`export composed by the host in ${Math.round(performance.now() - sent)} ms round trip: ${JSON.stringify(report)}`);
        const copy = await copyComposed();
        console.log(`and on the clipboard: ${JSON.stringify(copy)}`);
        const ok = report.source_mismatches === 0 && report.covered > 0;
        console.log(ok ? 'EXPORT SPIKE: every untouched source pixel is exact, and the notes are in the file'
                       : 'EXPORT SPIKE FAILED: see the report');
        await invoke('editor_exit', { code: ok ? 0 : 1 });
      } catch (err) {
        console.error('EXPORT SPIKE FAILED', err && err.stack ? err.stack : String(err));
        await invoke('editor_exit', { code: 1 });
      }
      return;
    }
    if (await flag('editor_wants_checks')) {
      console.log('running the S0.4 checks');
      const { runChecks } = await import('./editor-checks.js');
      await runChecks(window.reconEditor, invoke);
    }
  };

  boot().catch((err) => {
    const text = err && err.stack ? err.stack : String(err);
    hud.textContent = `startup failed: ${text}`;
    console.error('startup failed', text);
    // Never hang: a run that cannot start has to end with a verdict, not a timeout.
    invoke('editor_checks_done', { report: `the editor failed to start: ${text}`, failures: 1 }).catch(() => {});
  });
})();
</script>
