        `<polygon points="${shape.b.x},${shape.b.y} ${left.x.toFixed(1)},${left.y.toFixed(1)} ${right.x.toFixed(1)},${right.y.toFixed(1)}" fill="#ff5252" stroke="#ff5252" stroke-width="2" stroke-linejoin="round" /></g>`;
    }
    const r = rectOfShape(shape);
    if (shape.kind === 'rect') {
      return `<g data-shape="${shape.id}"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="2" fill="none" ${stroke} /></g>`;
    }
    if (shape.kind === 'highlight') {
      return `<g data-shape="${shape.id}"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="rgba(255,235,59,0.35)" stroke="none" /></g>`;
    }
    return '';
  };

  // The blur's radius, the same on screen and in the output: an eighth of the shorter
  // side, six to forty pixels. The host applies it to a copy of the source at export; on
  // screen a box blurs what is behind it.
  const blurRadius = (r) => Math.min(40, Math.max(6, Math.floor(Math.min(r.w, r.h) / 8)));
  const blurString = () => model.shapes.filter((s) => s.kind === 'blur').map((s) => { const r = rectOfShape(s); return `${r.x},${r.y},${r.w},${r.h}`; }).join(';');

  // The rectangle a drag from a to b describes, whichever way it was dragged.
  const rectOfShape = (shape) => ({
    x: Math.min(shape.a.x, shape.b.x),
    y: Math.min(shape.a.y, shape.b.y),
    w: Math.abs(shape.b.x - shape.a.x),
    h: Math.abs(shape.b.y - shape.a.y),
  });

  const createShape = (kind, at) => {
    const shape = { id: `s${model.nextShape}`, kind, a: { x: Math.round(at.x), y: Math.round(at.y) }, b: { x: Math.round(at.x), y: Math.round(at.y) } };
    model.nextShape += 1;
    model.shapes.push(shape);
    return shape;
  };

  const removeShape = (shape) => {
    model.shapes = model.shapes.filter((s) => s !== shape);
    if (model.selectedShape === shape) model.selectedShape = null;
  };

  const setTool = (tool) => {
    if (model.placing && tool !== model.tool) cancelPlacing();
    model.tool = tool;
    for (const button of document.querySelectorAll('#tools button')) {
      button.classList.toggle('active', button.dataset.tool === tool);
    }
    document.body.classList.toggle('armed', !!tool);
    layoutScene(); // the crop's frame shows with its tool and goes with it
    drawHud();
  };

  // The rect a crop handle's drag describes (S3.6): the edge it holds, or a corner's two,
  // moved inward from where the picture was when the drag began, never past it, and never
  // past the least a side can be. Inward only: the pixels outside are gone from the screen,
  // and Ctrl+Z is the way back.
  const MIN_CROP = 8; // provisional
  const cropFrom = (from, edge, point) => {
    const r = { ...from };
    const px = Math.round(point.x);
    const py = Math.round(point.y);
    if (edge.includes('w')) { const x = Math.max(from.x, Math.min(px, from.x + from.w - MIN_CROP)); r.w = from.x + from.w - x; r.x = x; }
    if (edge.includes('e')) { r.w = Math.min(from.x + from.w, Math.max(px, from.x + MIN_CROP)) - from.x; }
    if (edge.includes('n')) { const y = Math.max(from.y, Math.min(py, from.y + from.h - MIN_CROP)); r.h = from.y + from.h - y; r.y = y; }
    if (edge.includes('s')) { r.h = Math.min(from.y + from.h, Math.max(py, from.y + MIN_CROP)) - from.y; }
    return r;
  };
  for (const button of document.querySelectorAll('#tools button')) {
    button.addEventListener('click', (event) => { pickTool(button.dataset.tool).catch((err) => console.error('tool', err)); event.currentTarget.blur(); });
  }

  /// Where the line from the anchor meets the bubble's edge, so the arrow touches the box
  /// instead of ending under it.
  const edgePoint = (box, from, centre) => {
    const dx = centre.x - from.x;
    const dy = centre.y - from.y;
    if (dx === 0 && dy === 0) return centre;
    const halfW = box.w / 2;
    const halfH = box.h / 2;
    const scale = Math.min(
      dx === 0 ? Infinity : halfW / Math.abs(dx),
      dy === 0 ? Infinity : halfH / Math.abs(dy)
    );
    return { x: centre.x - dx * scale, y: centre.y - dy * scale };
  };

  let currentNotice = '';
  let emptyText = '';
  // The picture's size in its container above the timeline (Rotem, 2026-09-16), as the HUD writes it.
  const drawImageSize = () => {
    // The picture as it is now: the crop's size once one is set.
    const pic = pictureRect();
    const text = model.image.width ? `${pic.w}x${pic.h}` : '';
    if (imageSize.textContent !== text) imageSize.textContent = text;
  };
  const drawHud = () => {
    drawImageSize();
    if (!model.image.width) {
      hud.textContent = emptyText + (currentNotice ? `\n${currentNotice}` : '');
      return;
    }
    const target = model.editing || model.selected;
    const sizeShown = target ? (target.textSize || model.textSize) : model.textSize;
    const zoomText = Math.abs(model.zoom - model.fitZoom) < 0.0005
      ? `fit (${(model.zoom * 100).toFixed(0)}%)`
      : `${(model.zoom * 100).toFixed(0)}%`;
    const where = (model.image.file
      ? `${model.image.file}  ${model.image.kind}` +
        (model.image.count > 1 ? `  ${model.image.index + 1} of ${model.image.count}  [ ] to step` : '')
      : model.image.source) +
      (model.image.total > 0 ? `  ${model.image.position} of ${model.image.total} in ${model.image.context}` : '') +
      (model.storage.documents > 0 ? `   ${model.storage.documents} documents, ${(model.storage.bytes / (1024 * 1024)).toFixed(1)} MB on disk` : '');
    const ago = (s) => (s < 60 ? 'just now' : s < 3600 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`);
    const saveText = model.save.state === 'failed' ? `   NOT SAVED: ${model.save.error}`
      : model.save.state === 'saving' ? '   saving' : (model.image.managed ? '   saved' : '');
    const modeLine = model.mode === 'annotate'
      ? `mode annotate   tool ${model.tool || 'none'}${model.image.source_changed ? '   the file on disk has changed since; this document keeps its own pixels' : ''}${saveText}`
      : `mode view   a tool annotates${model.image.edited_ago_s != null ? `   annotated before, ${ago(model.image.edited_ago_s)}; a tool resumes it` : ''}`;
    const pointerHint = model.mode === 'annotate' && model.tool ? 'click to add  Space+drag pan  ' : 'drag to pan  ';
    hud.textContent =
      `${model.image.width}x${model.image.height}  ${where}\n` +
      `${modeLine}\n` +
      `zoom ${zoomText}   pan ${Math.round(model.pan.x)},${Math.round(model.pan.y)}   ` +
      `callouts ${model.callouts.length}   text ${sizeShown}px   dpr ${dpr()}\n` +
      `0 fit  1 actual size  +/- zoom  wheel zoom  F11 fullscreen  PgUp/PgDn previous next  Ctrl +/- text size  arrows pan  ${pointerHint}Esc commit  Del remove  Ctrl+Z/Y undo redo  Ctrl+C copy  Ctrl+Enter copy and return  Ctrl+S save as  Ctrl+Del delete document  Ctrl+O open  C callout  L arrow  R rectangle  H highlight  T text  B blur` +
      (currentNotice ? `\n${currentNotice}` : '');
  };

  // ---------------------------------------------------------------- the timeline
  //
  // S2.1: the documents, newest first, as thumbnails the host makes once and keeps beside
  // each document. A click shows that document with its notes; the keys walk the same list
  // as history. Refreshed whenever a document is loaded or created.
  //
  // S2.8: the strip is a window onto the list, never the list. Every document has a cell
  // of one size, placed by arithmetic, and only the cells on screen plus one screen's worth
  // on either side exist as elements and hold their picture; a cell that scrolls further
  // away is dropped with its picture, so the page holds a screenful whatever the library
  // holds, and a startup asks for a screenful. The strip's top edge is a handle: dragged
  // up, the cells grow to 320 wide; past that a row of 320 enters whenever there is room
  // for one, and the strip scrolls vertically. The height is remembered by the page.
  const STRIP_MIN = 96;        // the floor
  const STRIP_DEFAULT = 137;   // the default: the 1 px line, 12 px clear, 112 px thumbnails, the scroller's 12 px band (Rotem, 2026-09-16 for the 112; 2026-09-17 for the band, from 128, which sat 4 px of every cell under it, and for the 12, from 8)
  const STRIP_LINE = 1;        // the line along the strip's top edge, inside its height
  const STRIP_SCROLLER = 12;   // the one row's sideways scroller, a 4 px thumb with 4 px clear above and below: its band replaces the 8 px under the cells, so no cell's bottom edge sits under it
  const STRIP_PAD = 12;        // above, left and right of the cells (Rotem, 2026-09-17, from 8)
  const STRIP_GAP = 12;        // between the cells (Rotem, 2026-09-17, from 8)
  const CELL_MAX_W = 320;
  const CELL_MAX_H = 200;
  const CELL_RATIO = CELL_MAX_W / CELL_MAX_H;
  const STRIP_SHARE = 0.96;    // the most of the window the strip may take (96%, Rotem's word on 2026-09-15; 60% before)
  const FETCHES_AT_ONCE = 8;

  // The pictures: at most eight fetched at once, each held only while its cell exists.
  const thumbUrls = new Map();
  let fetching = 0;
  const fetchQueue = [];
  const pumpFetches = () => {
    while (fetching < FETCHES_AT_ONCE && fetchQueue.length > 0) {
      const job = fetchQueue.shift();
      fetching += 1;
      job().catch(() => {}).finally(() => { fetching -= 1; pumpFetches(); });
    }
  };
  const thumbFor = (id, still) => new Promise((resolve, reject) => {
    fetchQueue.push(async () => {
      if (!still()) return resolve(null);
      try {
        if (!thumbUrls.has(id)) {
          const response = await fetch(`http://region.localhost/?thumb=${id}`, { cache: 'no-store' });
          if (!response.ok) throw new Error(`thumbnail ${id}: ${response.status}`);
          const url = URL.createObjectURL(await response.blob());
          if (!still()) { URL.revokeObjectURL(url); return resolve(null); }
          thumbUrls.set(id, url);
        }
        resolve(thumbUrls.get(id));
      } catch (err) { reject(err); }
    });
    pumpFetches();
  });
  const dropThumb = (id) => {
    const url = thumbUrls.get(id);
    if (url) { URL.revokeObjectURL(url); thumbUrls.delete(id); }
  };

  // The cells, in strip order, and the ones that exist on screen.
  let stripMode = 'documents';
  let stripWanted = false;     // the library or the trash holds something, so the strip shows outside fullscreen
  let cells = [];              // { key, kind: 'doc' | 'trashed' | 'chip', doc?, chip? }
  const rendered = new Map();  // key -> element
  let stripHeight = STRIP_DEFAULT;
  const layout = { rows: 1, cols: 0, w: 0, h: 0 };
  const stripLayout = () => ({ ...layout });

  const stripMax = () => Math.max(STRIP_MIN, Math.floor(window.innerHeight * STRIP_SHARE));
  // A wanted height made lawful: the floor and the share of the window, nothing else. The
  // handle follows the hand exactly and a row of 320 enters the moment there is room for
  // it (Rotem's word, 2026-09-15); until S2.8's first release the height snapped to whole
  // rows, and the handle jumped away from the pointer.
  const snapStripHeight = (wanted) => Math.max(STRIP_MIN, Math.min(stripMax(), Math.round(wanted)));
  const setStripHeight = (wanted) => {
    stripHeight = snapStripHeight(wanted);
    document.documentElement.style.setProperty('--strip-h', `${stripHeight}px`);
    layoutStrip();
    return stripHeight;
  };
  const rememberStripHeight = () => { try { localStorage.setItem('recon.strip-height', String(stripHeight)); } catch (_) { /* no storage: the default each start */ } };
  const recallStripHeight = () => { try { return Number(localStorage.getItem('recon.strip-height')) || STRIP_DEFAULT; } catch (_) { return STRIP_DEFAULT; } };

  const cellRect = (i) => {
    const { rows, cols, w, h } = layout;
    const col = rows === 1 ? i : i % cols;
    const row = rows === 1 ? 0 : Math.floor(i / cols);
    return { x: STRIP_PAD + col * (w + STRIP_GAP), y: STRIP_PAD + row * (h + STRIP_GAP), w, h };
  };
  const layoutStrip = () => {
    const inner = stripHeight - 2 * STRIP_PAD;
    const rows = inner <= CELL_MAX_H ? 1 : Math.floor((inner + STRIP_GAP) / (CELL_MAX_H + STRIP_GAP));
    const h = Math.min(stripHeight - STRIP_LINE - STRIP_PAD - STRIP_SCROLLER, CELL_MAX_H); // the one row ends above its scroller's band; a row never exceeds 320 by 200, and the slack below it waits for the next row
    const w = Math.round(h * CELL_RATIO);
    const cols = rows === 1 ? Math.max(1, cells.length)
      : Math.max(1, Math.floor((strip.clientWidth - 2 * STRIP_PAD + STRIP_GAP) / (w + STRIP_GAP)));
    Object.assign(layout, { rows, cols, w, h });
    const n = cells.length;
    const extentX = rows === 1 && n > 0 ? 2 * STRIP_PAD + n * (w + STRIP_GAP) - STRIP_GAP : 0;
    const extentY = rows > 1 && n > 0 ? 2 * STRIP_PAD + Math.ceil(n / cols) * (h + STRIP_GAP) - STRIP_GAP : 0;
    strip.style.setProperty('--extent-x', `${extentX}px`);
    strip.style.setProperty('--extent-y', `${extentY}px`);
    strip.classList.toggle('grid', rows > 1);
    renderStrip();
  };
  // The cells worth having as elements: the screen, and one screen's worth on either side.
  const cellRange = () => {
    const { rows, cols, w, h } = layout;
    if (cells.length === 0) return [0, 0];
    if (rows === 1) {
      const pitch = w + STRIP_GAP;
      const span = Math.max(1, strip.clientWidth);
      const first = Math.floor((strip.scrollLeft - span) / pitch);
      const last = Math.ceil((strip.scrollLeft + 2 * span) / pitch);
      return [Math.max(0, first), Math.min(cells.length, last)];
    }
    const pitch = h + STRIP_GAP;
    const span = Math.max(1, strip.clientHeight);
    const firstRow = Math.floor((strip.scrollTop - span) / pitch);
    const lastRow = Math.ceil((strip.scrollTop + 2 * span) / pitch);
    return [Math.max(0, firstRow * cols), Math.min(cells.length, lastRow * cols)];
  };
  const dropCell = (key, el) => {
    el.remove();
    rendered.delete(key);
    if (el.dataset.id) dropThumb(Number(el.dataset.id));
  };
  const renderStrip = () => {
    const [from, to] = cellRange();
    const keep = new Set();
    for (let i = from; i < to; i += 1) keep.add(cells[i].key);
    for (const [key, el] of [...rendered]) if (!keep.has(key)) dropCell(key, el);
    let previous = null;
    for (let i = from; i < to; i += 1) {
      const cell = cells[i];
      let el = rendered.get(cell.key);
      const fresh = !el;
      if (fresh) {
        el = makeCell(cell);
        rendered.set(cell.key, el);
      }
      const r = cellRect(i);
      el.style.left = `${r.x}px`;
      el.style.top = `${r.y}px`;
      el.style.width = `${r.w}px`;
      el.style.height = `${r.h}px`;
      if (cell.kind === 'doc') {
        const when = new Date(cell.doc.created_ms);
        el.title = `${cell.doc.file || 'capture'}  ${cell.doc.width}x${cell.doc.height}  ${when.toLocaleString()}`;
        el.classList.toggle('current', !!cell.doc.current);
        if (cell.tab) el.classList.toggle('checked', cell.tab.done.includes(cell.doc.id));
      } else if (cell.kind === 'chip') {
        el.firstChild.textContent = cell.chip.text;
      }
      // Kept in strip order, so the first child is the newest, as the checks read it.
      const wanted = previous ? previous.nextSibling : strip.firstChild;
      if (wanted !== el) strip.insertBefore(el, wanted);
      previous = el;
      // The picture is asked for once the cell is in the strip, since a cell that has
      // left the strip by its turn is not worth a fetch.
      if (fresh && cell.kind !== 'chip') loadThumb(cell.doc.id, el);
    }
  };
  const loadThumb = (id, el) => {
    thumbFor(id, () => el.isConnected).then((url) => {
      if (!url) return;
      const img = document.createElement('img');
      img.src = url;
      img.alt = '';
      el.insertBefore(img, el.firstChild);
      for (const node of [...el.childNodes]) if (node.nodeType === Node.TEXT_NODE) node.remove();
    }).catch((err) => console.warn(String(err)));
  };
  const makeCell = (cell) => {
    if (cell.kind === 'chip') {
      const wrap = document.createElement('div');
      wrap.className = 'chip-cell';
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.type = 'button';
      chip.id = cell.chip.id;
      chip.textContent = cell.chip.text;
      if (cell.chip.title) chip.title = cell.chip.title;
      chip.addEventListener('click', () => { cell.chip.onClick(); chip.blur(); });
      wrap.appendChild(chip);
      return wrap;
    }
    const doc = cell.doc;
    const el = document.createElement('div');
    el.className = cell.kind === 'trashed' ? 'thumb trashed' : 'thumb';
    el.dataset.id = String(doc.id);
    el.textContent = `${doc.width}x${doc.height}`;
    if (cell.kind === 'doc') {
      el.addEventListener('click', () => {
        invoke('editor_show_document', { id: doc.id }).then((info) => loadImage(info)).catch((err) => {
          console.error('timeline', err);
          // An opened file that is gone from where it lived: said, and its thumbnail leaves.
          if (doc.linked) { notice(`NOT OPENED: ${err}`, 0); refreshStrip().catch(() => {}); }
        });
      });
      // The delete (§3.8, S2.5): into Recon's trash for thirty days; one click, no dialog.
      const x = document.createElement('button');
      x.className = 'x';
      x.type = 'button';
      x.textContent = '×';
      x.title = 'Delete this document (Recon keeps it in its trash for 30 days)';
      x.addEventListener('click', (event) => {
        event.stopPropagation();
        deleteDocument(doc.id).catch((err) => console.error('delete', err));
      });
      el.appendChild(x);
      if (cell.tab) {
        // The done mark, in a tab after Main only (Rotem, 2026-09-16).
        const done = document.createElement('button');
        done.className = 'done';
        done.type = 'button';
        done.innerHTML = '<svg viewBox="0 0 20 20"><path class="tick" d="M5 10.5l3.5 3.5 6.5-8.5"/></svg>';
        done.setAttribute('aria-label', 'Done with this picture');
        done.title = 'Done with this picture, in this tab; press again to clear';
        done.addEventListener('pointerdown', (event) => event.stopPropagation()); // no strip scroll from it
        done.addEventListener('click', (event) => {
          event.stopPropagation();
          toggleDone(cell.tab.id, doc.id);
        });
        el.appendChild(done);
      }
    } else {
      el.title = `${doc.file || 'capture'}  ${doc.width}x${doc.height}  deleted ${doc.days} day${doc.days === 1 ? '' : 's'} ago; gone for good after 30`;
      const restore = document.createElement('button');
      restore.className = 'restore';
      restore.type = 'button';
      restore.textContent = 'Restore';
      restore.addEventListener('click', (event) => {
        event.stopPropagation();
        invoke('editor_trash_restore', { id: doc.id }).then(async (info) => {
          stripMode = 'documents';
          await loadImage(info);
          await refreshStrip();
          notice('restored from the trash', 3000);
        }).catch((err) => { notice(`NOT RESTORED: ${err}`, 0); });
      });
      el.appendChild(restore);
    }
    return el;
  };
  const dropCellsNotIn = (list) => {
    const keys = new Set(list.map((c) => c.key));
    for (const [key, el] of [...rendered]) if (!keys.has(key)) dropCell(key, el);
  };
  // The current document's cell brought onto the screen, the nearest way.
  const scrollToCurrent = () => {
    const i = cells.findIndex((c) => c.kind === 'doc' && c.doc.current);
    if (i < 0) return;
    const r = cellRect(i);
    if (layout.rows === 1) {
      if (r.x - STRIP_PAD < strip.scrollLeft) strip.scrollLeft = r.x - STRIP_PAD;
      else if (r.x + r.w + STRIP_PAD > strip.scrollLeft + strip.clientWidth) strip.scrollLeft = r.x + r.w + STRIP_PAD - strip.clientWidth;
    } else if (r.y - STRIP_PAD < strip.scrollTop) strip.scrollTop = r.y - STRIP_PAD;
    else if (r.y + r.h + STRIP_PAD > strip.scrollTop + strip.clientHeight) strip.scrollTop = r.y + r.h + STRIP_PAD - strip.clientHeight;
    renderStrip();
  };
  strip.addEventListener('scroll', renderStrip);

  // A press anywhere on the one-row strip and a move sideways scrolls it (Rotem, 2026-09-15).
  // Past a few pixels the press is a scroll, and the click that ends it shows nothing.
  const STRIP_SCROLL_SLOP = 4;
  let stripScroll = null;
  let stripScrolled = false;
  strip.addEventListener('pointerdown', (event) => {
    stripScrolled = false;
    // The one row only, and never a press on the strip's own scroller below its content.
    const contentBottom = strip.getBoundingClientRect().top + strip.clientTop + strip.clientHeight;
    if (event.button !== 0 || layout.rows !== 1 || event.clientY >= contentBottom) return;
    stripScroll = { x: event.clientX, left: strip.scrollLeft, id: event.pointerId, moving: false };
    event.preventDefault(); // a thumbnail's picture would otherwise start the system's own drag
  });
  strip.addEventListener('pointermove', (event) => {
    if (!stripScroll || event.pointerId !== stripScroll.id) return;
    const dx = event.clientX - stripScroll.x;
    if (!stripScroll.moving) {
      if (Math.abs(dx) < STRIP_SCROLL_SLOP) return;
      stripScroll.moving = true;
      try { strip.setPointerCapture(event.pointerId); } catch (_) { /* a synthetic pointer has no capture */ }
    }
    strip.scrollLeft = stripScroll.left - dx;
  });
  const endStripScroll = (event) => {
    if (!stripScroll || event.pointerId !== stripScroll.id) return;
    stripScrolled = stripScroll.moving;
    stripScroll = null;
  };
  strip.addEventListener('pointerup', endStripScroll);
  strip.addEventListener('pointercancel', endStripScroll);
  strip.addEventListener('click', (event) => {
    if (!stripScrolled) return;
    stripScrolled = false;
    event.stopPropagation();
    event.preventDefault();
  }, true);
  // Over the one-row strip the wheel scrolls it sideways, down to the right (Rotem, 2026-09-16).
  // A sideways wheel keeps its own scroll, and the rows keep the wheel's up and down.
  strip.addEventListener('wheel', (event) => {
    if (layout.rows !== 1 || event.deltaY === 0 || Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
    event.preventDefault();
    strip.scrollLeft += event.deltaY * (event.deltaMode === 1 ? 40 : 1);
  }, { passive: false });

  // ---------------------------------------------------------------- the tabs
  //
  // Rotem, 2026-09-16: a plus at the left of the picture's size band. Its first press puts two
  // tabs beside it, Main and New tab, and every press after adds another New tab; the new tab
  // is selected. Main is the whole library as the timeline always was, pinned first and never
  // deleted. Every other tab is a feed: a capture taken while it is selected lands in the
  // library, so in Main, and in that tab too; a click on a tab shows its feed in the timeline.
  // A tab is deleted by the × on it, pressed twice, its captures staying in Main, and dragged
  // into another place after Main; a click on the selected tab's name edits it, Enter keeps
  // it. Adding, deleting and renaming a tab are in undo and redo with the notes and the
  // deletions (Rotem, 2026-09-16). The host keeps the list whole in tabs.json beside the
  // documents and never reads it, like a document's notes.
  const tabbar = document.getElementById('tabbar');
  const tabAdd = document.getElementById('tab-add');
  const MAIN_TAB = 0;
  const tabs = { list: [], selected: MAIN_TAB }; // list: { id, name, docs: [document ids], done: [document ids] }; selected: a tab's id
  const tabElements = new Map();                 // id -> element, MAIN_TAB for Main
  const selectedTab = () => tabs.list.find((t) => t.id === tabs.selected) || null;
  const tabsOf = () => ({ list: tabs.list.map((t) => ({ ...t, docs: [...t.docs], done: [...t.done] })), selected: tabs.selected });
  // One write at a time, each carrying the list as it was when asked for, so two changes in
  // the same moment cannot land on disk in the wrong order (review).
  let tabsSaving = Promise.resolve();
  const saveTabs = () => {
    const body = JSON.parse(JSON.stringify({ schema: 1, selected: tabs.selected, tabs: tabs.list }));
    tabsSaving = tabsSaving.then(() => invoke('editor_save_tabs', { tabs: body }))
      .catch((err) => { console.error('the tabs were not saved', err); notice(`TABS NOT SAVED: ${err}`, 0); });
    return tabsSaving;
  };
  const loadTabs = async () => {
    const saved = await invoke('editor_tabs').catch((err) => { console.error('tabs', err); return null; });
    const list = saved && Array.isArray(saved.tabs) ? saved.tabs : [];
    tabs.list = list
      .filter((t) => t && Number.isFinite(t.id) && t.id !== MAIN_TAB)
      .map((t) => ({ id: t.id, name: String(t.name || 'New tab'), docs: Array.isArray(t.docs) ? t.docs.filter((d) => Number.isFinite(d)) : [],
        done: Array.isArray(t.done) ? t.done.filter((d) => Number.isFinite(d)) : [] }));
    tabs.selected = saved && tabs.list.some((t) => t.id === saved.selected) ? saved.selected : MAIN_TAB;
    // The bar is rebuilt: an element keeps the tab it was made for, and these are new objects.
    for (const el of tabElements.values()) el.remove();
    tabElements.clear();
    renderTabs();
  };
  let tabDragged = false;
  let renaming = null; // the name element being edited
  // The name is edited in place: a click on the selected tab's name, Enter keeps it, leaving
  // the field keeps it too; an empty name keeps the old one. Main keeps its name.
  const startRename = (tab, name) => {
    if (renaming || tab.id === MAIN_TAB) return;
    renaming = name;
    name.contentEditable = 'true';
    name.focus();
    const range = document.createRange();
    range.selectNodeContents(name);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  };
  const endRename = (tab, name) => {
    if (renaming !== name) return;
    renaming = null;
    name.contentEditable = 'false';
    const text = name.textContent.replace(/\s+/g, ' ').trim();
    if (text && text !== tab.name) renameTab(tab.id, text);
    name.textContent = tab.name;
  };
  const makeTab = (tab) => {
    const el = document.createElement('div');
    el.className = 'tab';
    el.setAttribute('role', 'tab');
    el.tabIndex = 0;
    el.dataset.tab = String(tab.id);
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = tab.name;
    el.appendChild(name);
    el.addEventListener('click', (event) => {
      if (tabDragged) { tabDragged = false; return; }
      // The selected tab's name, clicked, is edited; any other click on a tab selects it.
      if (tab.id === tabs.selected && event.target === name) { startRename(tab, name); return; }
      selectTab(tab.id);
      el.blur();
    });
    el.addEventListener('keydown', (event) => {
      if (renaming === name) {
        // Typing owns the keys while the name is edited; Enter keeps the name.
        event.stopPropagation();
        if (event.key === 'Enter') { event.preventDefault(); endRename(tab, name); }
        return;
      }
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectTab(tab.id); }
    });
    name.addEventListener('blur', () => endRename(tab, name));
    // A right press on a tab after Main opens its menu; Main has none (Rotem, 2026-09-18).
    el.addEventListener('contextmenu', (event) => {
      event.preventDefault();
      if (tab.id !== MAIN_TAB && !renaming) openTabMenu(tab.id, event.clientX, event.clientY);
    });
    return el;
  };
  // The tab's menu: Delete, which deletes the tab at once, its captures staying in Main and
  // Ctrl+Z bringing it back. A press anywhere else, Escape, or the window losing focus closes it.
  const tabMenu = document.getElementById('tab-menu');
  let tabMenuFor = null;
  const closeTabMenu = () => { tabMenuFor = null; tabMenu.classList.remove('open'); };
  const openTabMenu = (id, x, y) => {
    tabMenuFor = id;
    tabMenu.classList.add('open');
    const box = tabMenu.getBoundingClientRect();
    tabMenu.style.left = `${Math.max(0, Math.min(window.innerWidth - box.width, x))}px`;
    tabMenu.style.top = `${Math.max(0, y - box.height)}px`;
    tabMenu.firstElementChild.focus();
  };
  tabMenu.firstElementChild.addEventListener('click', () => {
    const id = tabMenuFor;
    closeTabMenu();
    if (id != null) deleteTab(id);
  });
  tabMenu.addEventListener('contextmenu', (event) => event.preventDefault());
  tabMenu.addEventListener('keydown', (event) => {
    event.stopPropagation(); // the editor's keys stay out while the menu is open
    if (event.key === 'Escape') { event.preventDefault(); closeTabMenu(); }
  });
  window.addEventListener('pointerdown', (event) => { if (tabMenuFor != null && !tabMenu.contains(event.target)) closeTabMenu(); }, true);
  window.addEventListener('blur', closeTabMenu);
  // The bar holds the plus, then Main, then the tabs in their order; Main shows once any tab exists.
  const renderTabs = () => {
    const order = tabs.list.length ? [{ id: MAIN_TAB, name: 'Main' }, ...tabs.list] : [];
    const wanted = new Set(order.map((t) => t.id));
    for (const [id, el] of [...tabElements]) if (!wanted.has(id)) { el.remove(); tabElements.delete(id); }
    let previous = tabAdd;
    for (const tab of order) {
      let el = tabElements.get(tab.id);
      if (!el) { el = makeTab(tab); tabElements.set(tab.id, el); }
      el.classList.toggle('selected', tab.id === tabs.selected);
      el.setAttribute('aria-selected', tab.id === tabs.selected ? 'true' : 'false');
      const nameEl = el.querySelector('.name');
      if (renaming !== nameEl && nameEl.textContent !== tab.name) nameEl.textContent = tab.name;
      if (previous.nextSibling !== el) tabbar.insertBefore(el, previous.nextSibling);
      previous = el;
    }
  };
  const selectTab = (id) => {
    if (id !== MAIN_TAB && !tabs.list.some((t) => t.id === id)) return;
    if (id === tabs.selected) return;
    tabs.selected = id;
    renderTabs();
    saveTabs();
    refreshStrip().catch(() => {});
  };
  const applyTabs = () => {
    renderTabs();
    saveTabs();
    refreshStrip().catch(() => {});
  };
  // The two moves undo and redo are made of: a tab put into the list at a place and
  // selected, and a tab taken out, the selection falling back to Main.
  const putTab = (tab, at, select) => {
    if (tabs.list.some((t) => t.id === tab.id)) return;
    tabs.list.splice(Math.max(0, Math.min(tabs.list.length, at)), 0, tab);
    if (select) tabs.selected = tab.id;
    applyTabs();
  };
  const takeTab = (id, selectAfter) => {
    const at = tabs.list.findIndex((t) => t.id === id);
    if (at < 0) return -1;
    tabs.list.splice(at, 1);
    if (tabs.selected === id) tabs.selected = selectAfter != null && (selectAfter === MAIN_TAB || tabs.list.some((t) => t.id === selectAfter)) ? selectAfter : MAIN_TAB;
    applyTabs();
    return at;
  };
  const addTab = () => {
    let id = Date.now();
    while (id === MAIN_TAB || tabs.list.some((t) => t.id === id)) id += 1;
    const tab = { id, name: 'New tab', docs: [], done: [] };
    const before = tabs.selected;
    const at = tabs.list.length;
    putTab(tab, at, true);
    recordAct(() => takeTab(id, before), () => putTab(tab, at, true));
    return tab;
  };
  // Main is never deleted; a deleted tab's captures stay in the library, so in Main. Ctrl+Z
  // puts the tab back in its place with its feed, selected again if it was.
  const deleteTab = (id) => {
    const tab = tabs.list.find((t) => t.id === id);
    if (id === MAIN_TAB || !tab) return false;
    const wasSelected = tabs.selected === id;
    const at = takeTab(id, MAIN_TAB);
    recordAct(() => putTab(tab, at, wasSelected), () => takeTab(id, MAIN_TAB));
    return true;
  };
  const renameTab = (id, name) => {
    const tab = tabs.list.find((t) => t.id === id);
    if (id === MAIN_TAB || !tab || !name || name === tab.name) return false;
    const was = tab.name;
    const set = (text) => { tab.name = text; applyTabs(); };
    set(name);
    recordAct(() => set(was), () => set(name));
    return true;
  };
  // Moves a tab to a place among the tabs after Main, 0 being right after it.
  const moveTab = (id, index) => {
    const at = tabs.list.findIndex((t) => t.id === id);
    if (id === MAIN_TAB || at < 0) return false;
    const to = Math.max(0, Math.min(tabs.list.length - 1, index));
    if (to === at) return false;
    const [tab] = tabs.list.splice(at, 1);
    tabs.list.splice(to, 0, tab);
    renderTabs();
    return true;
  };
  // The done mark on a picture in a tab: pressed, the picture is marked dealt with in that tab
  // and the mark stays shown; pressed again, the mark goes. In undo with the rest.
  const toggleDone = (tabId, documentId) => {
    const tab = tabs.list.find((t) => t.id === tabId);
    if (!tab) return false;
    const set = (on) => {
      tab.done = tab.done.filter((d) => d !== documentId);
      if (on) tab.done.push(documentId);
      saveTabs();
      renderStrip();
    };
    const on = !tab.done.includes(documentId);
    set(on);
    recordAct(() => set(!on), () => set(on));
    return on;
  };
  // A capture taken while a tab other than Main is selected joins that tab's feed as well.
  const captureIntoTab = (documentId) => {
    const tab = selectedTab();
    if (!tab || !Number.isFinite(documentId) || tab.docs.includes(documentId)) return;
    tab.docs.push(documentId);
    saveTabs();
  };
  tabAdd.addEventListener('click', (event) => { addTab(); event.currentTarget.blur(); });
  // A press on a tab after Main and a move sideways drags it: past a few pixels the press is
  // a drag, the tab follows the hand, and it takes the place of whichever tab the hand is over.
  const TAB_DRAG_SLOP = 4;
  let tabDrag = null;
  tabbar.addEventListener('pointerdown', (event) => {
    tabDragged = false; // a drag that ended off the bar must not swallow the next click
    const el = event.target.closest('.tab');
    if (event.button !== 0 || !el || Number(el.dataset.tab) === MAIN_TAB || renaming) return;
    tabDrag = { id: Number(el.dataset.tab), el, x: event.clientX, left: el.getBoundingClientRect().left, pointer: event.pointerId, moving: false, moved: false, translate: 0 };
  });
  tabbar.addEventListener('pointermove', (event) => {
    if (!tabDrag || event.pointerId !== tabDrag.pointer) return;
    const dx = event.clientX - tabDrag.x;
    if (!tabDrag.moving) {
      if (Math.abs(dx) < TAB_DRAG_SLOP) return;
      tabDrag.moving = true;
      tabDrag.el.classList.add('dragging');
      try { tabDrag.el.setPointerCapture(event.pointerId); } catch (_) { /* a synthetic pointer has no capture */ }
    }
    // The place under the hand: past the middle of a tab, the dragged one takes its place.
    let index = 0;
    for (const tab of tabs.list) {
      if (tab.id === tabDrag.id) continue;
      const r = tabElements.get(tab.id).getBoundingClientRect();
      if (event.clientX > r.left + r.width / 2) index += 1;
    }
    if (moveTab(tabDrag.id, index)) tabDrag.moved = true;
    // The tab follows the hand from where it was pressed, whatever place it now holds.
    const laidOut = tabDrag.el.getBoundingClientRect().left - tabDrag.translate;
    tabDrag.translate = tabDrag.left + dx - laidOut;
    tabDrag.el.style.transform = `translateX(${tabDrag.translate}px)`;
  });
  const endTabDrag = (event) => {
    if (!tabDrag || event.pointerId !== tabDrag.pointer) return;
    tabDrag.el.classList.remove('dragging');
    tabDrag.el.style.transform = '';
    tabDragged = tabDrag.moving;
    if (tabDrag.moved) saveTabs();
    tabDrag = null;
  };
  tabbar.addEventListener('pointerup', endTabDrag);
  tabbar.addEventListener('pointercancel', endTabDrag);

  const refreshStrip = async () => {
    if (stripMode === 'trash') return renderTrash();
    document.body.classList.remove('trash');
    const docs = await invoke('editor_documents').catch(() => []);
    const trashed = await invoke('editor_trash_documents').catch(() => []);
    model.storage = await invoke('editor_storage').catch(() => model.storage);
    // Whether the timeline is wanted at all is the library's, not the cells': a tab with an empty
    // feed shows an empty timeline, and fullscreen ending brings it back (found by the tabs check).
    stripWanted = docs.length > 0 || trashed.length > 0;
    document.body.classList.toggle('strip', stripWanted && !model.fullscreen);
    if (followFit()) paintRegion(); // the stage changed height (Rotem, 2026-09-15)
    // Newest first, at the left (Rotem's word, 2026-09-14); the host lists oldest first.
    // A tab after Main shows its own feed; Main, or no tab yet, shows the whole library.
    const tab = selectedTab();
    const feed = tab ? new Set(tab.docs) : null;
    cells = [...docs].reverse().filter((doc) => !feed || feed.has(doc.id))
      .map((doc) => ({ key: tab ? `doc:${tab.id}:${doc.id}` : `doc:${doc.id}`, kind: 'doc', doc, tab }));
    if (trashed.length > 0) {
      cells.push({ key: 'chip:trash', kind: 'chip', chip: {
        id: 'trash-chip', text: `Trash · ${trashed.length}`, title: 'What was deleted in the last 30 days',
        onClick: () => { stripMode = 'trash'; renderTrash().catch(() => {}); },
      } });
    }
    dropCellsNotIn(cells);
    layoutStrip();
    scrollToCurrent();
  };

  const renderTrash = async () => {
    const trashed = await invoke('editor_trash_documents').catch(() => []);
    document.body.classList.add('trash');
    stripWanted = true;
    document.body.classList.toggle('strip', !model.fullscreen);
    if (followFit()) paintRegion(); // the stage changed height (Rotem, 2026-09-15)
    cells = [{ key: 'chip:back', kind: 'chip', chip: {
      id: 'trash-back', text: trashed.length ? 'Back' : 'The trash is empty; back', title: '',
      onClick: () => { stripMode = 'documents'; refreshStrip().catch(() => {}); },
    } }];
    for (const doc of trashed) cells.push({ key: `trashed:${doc.id}`, kind: 'trashed', doc });
    dropCellsNotIn(cells);
    strip.scrollLeft = 0;
    strip.scrollTop = 0;
    layoutStrip();
  };

  // The handle on the strip's top edge (S2.8): a drag resizes, a double-click resets.
  const stripHandle = document.getElementById('strip-handle');
  let stripDrag = null;
  stripHandle.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) return;
    stripDrag = { y: event.clientY, h: stripHeight };
    try { stripHandle.setPointerCapture(event.pointerId); } catch (_) { /* a synthetic pointer has no capture */ }
    event.preventDefault();
  });
  stripHandle.addEventListener('pointermove', (event) => {
    if (!stripDrag) return;
    const before = stripHeight;
    setStripHeight(stripDrag.h + (stripDrag.y - event.clientY));
    if (stripHeight !== before) stageResized();
  });
  const endStripDrag = () => {
    if (!stripDrag) return;
    stripDrag = null;
    rememberStripHeight();
  };
  stripHandle.addEventListener('pointerup', endStripDrag);
  stripHandle.addEventListener('pointercancel', endStripDrag);
  stripHandle.addEventListener('dblclick', () => {
    setStripHeight(STRIP_DEFAULT);
    rememberStripHeight();
    stageResized();
  });
  setStripHeight(recallStripHeight());

  // A document deleted: out of the timeline and, when it was the one on screen, the
  // neighbour shows or the editor is empty. The host says what remains.
  // The deletion is recorded for Ctrl+Z (S2.9), and the document's stash is kept, not
  // dropped, so it comes back with its notes and their undo.
  const deleteDocument = async (id, again = false) => {
    const shown = id === model.image.document_id;
    const linked = cells.some((c) => c.kind === 'doc' && c.doc.id === id && c.doc.linked);
    let info;
    try {
      info = await invoke('editor_delete_document', { id });
    } catch (err) {
      // The host keeps the document when its move to the trash failed (review T10): said
      // on screen, and the timeline is as it was.
      notice(`NOT DELETED: ${err}`, 0);
      throw err;
    }
    // Done again by redo, it is not a new action, so what else was undone stays redoable.
    const seq = again ? (actionSeq += 1) : newAction(); // newAction replaces the list, so it goes first
    deletions.push({ id, seq, shown, undone: false });
    if (info) {
      await loadImage(info);
      await refreshStrip();
    } else {
      stashCurrent(false); // the folder is in the trash already, so there is nothing to save into
      await showEmpty();
    }
    notice(linked ? 'taken off the timeline; the file itself is untouched' : 'deleted; Recon keeps it in its trash for 30 days', 4000);
  };

  const showEmpty = async () => {
    model.image = { width: 0, height: 0, source: '' };
    model.callouts = [];
    model.selected = null;
    model.editing = null;
    model.placing = null;
    // The shapes, the crop and the margin go with the picture too, or the empty stage would
    // still draw the arrows and boxes of the picture just deleted (review 4, T4).
    model.shapes = [];
    model.nextShape = 1;
    model.selectedShape = null;
    model.crop = null;
    model.cropping = null;
    model.margin = { left: 0, top: 0, right: 0, bottom: 0 };
    model.marginFloor = { left: 0, top: 0, right: 0, bottom: 0 };
    // No document, no steps: Ctrl+Z here reaches the deletion that emptied the editor.
    model.history = { steps: [], index: -1, seq: [] };
    canvas.style.display = 'none';
    mat.style.display = 'none';
    layoutScene();
    applyMode();
    await refreshStrip();
    const hotkey = await invoke('editor_hotkey').catch(() => '');
    emptyText = emptyStateText(hotkey);
    drawHud();
  };

  // ---------------------------------------------------------------- the top bar
  //
  // Recon draws its own (Rotem's call, 2026-09-14). The three buttons do what Windows'
  // did: close goes through the host's close handler, so it hides rather than quits
  // (§3.1). Dragging the bar moves the window and a double-click on it toggles maximize,
  // both the runtime's own from the drag-region attribute. The title is the window's.
  const currentWindow = window.__TAURI__.window.getCurrentWindow();
  const maxButton = document.getElementById('win-max');
  const maxGlyph = {
    maximize: '<svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg>',
    restore: '<svg viewBox="0 0 10 10"><path d="M2.5 2.5v-2h7v7h-2"/><rect x=".5" y="2.5" width="7" height="7"/></svg>',
  };
  const refreshMaxButton = async () => {
    const maximized = await currentWindow.isMaximized().catch(() => false);
    maxButton.title = maximized ? 'Restore' : 'Maximize';
    maxButton.innerHTML = maximized ? maxGlyph.restore : maxGlyph.maximize;
  };
  const windowButton = (id, action) => {
    const button = document.getElementById(id);
    button.addEventListener('click', () => {
      action().catch((err) => console.error(id, err));
      // The keys stay the page's: a focused button would swallow Space and Enter.
      button.blur();
    });
  };
  windowButton('win-min', () => currentWindow.minimize());
  windowButton('win-max', () => currentWindow.toggleMaximize().then(refreshMaxButton));
  windowButton('win-close', () => currentWindow.close());

  // ---------------------------------------------------------------- settings
  //
  // The chevron left of minimize opens a modal with the two global shortcuts (Rotem,
  // 2026-09-18): one that shows Recon's window from anywhere, none until it is picked, and
  // the capture's. A press on a field waits for a shortcut; while it waits the host lets
  // both global shortcuts go, so pressing the current one picks it instead of firing it.
  // The host tries the new one before it drops the old: a shortcut another application
  // holds is refused in words under the field, and the old one keeps working (§3.1).
  // While the modal is open the keyboard is its own: nothing reaches the editor under it.
  const settingsVeil = document.getElementById('settings-veil');
  const settingsPanel = document.getElementById('settings');
  const settingRows = [...settingsPanel.querySelectorAll('.setting')];
  const settingsState = { open: false, recording: null, keys: null };
  const settingRow = (which) => settingRows.find((row) => row.dataset.which === which);
  const drawSettings = () => {
    for (const row of settingRows) {
      const which = row.dataset.which;
      const label = settingsState.keys ? settingsState.keys[which] : '';
      const field = row.querySelector('.key');
      const recording = settingsState.recording === which;
      field.textContent = recording ? 'Press a shortcut' : (label || 'None');
      field.classList.toggle('recording', recording);
      field.classList.toggle('none', !recording && !label);
      const clear = row.querySelector('.clear');
      if (clear) clear.classList.toggle('shown', !!label && !recording);
    }
  };
  const saySetting = (which, text) => {
    const said = settingRow(which).querySelector('.said');
    said.textContent = text || '';
    said.classList.toggle('shown', !!text);
  };
  // A shortcut the host could not get at startup is said under its field, as a refusal is.
  const sayUnavailable = () => {
    for (const which of ['open', 'capture']) {
      const keys = settingsState.keys;
      const dead = keys && keys[which] && !keys[`${which}_active`];
      saySetting(which, dead ? `${keys[which]} is taken by another application. Pick another.` : '');
    }
  };
  const stopRecording = async () => {
    if (!settingsState.recording) return;
    settingsState.recording = null;
    drawSettings();
    await invoke('editor_settings_recording', { on: false }).catch((err) => console.error('settings', err));
  };
  const startRecording = async (which) => {
    if (settingsState.recording === which) return;
    await stopRecording();
    saySetting(which, '');
    settingsState.recording = which;
    drawSettings();
    await invoke('editor_settings_recording', { on: true }).catch((err) => console.error('settings', err));
  };
  const setShortcut = async (which, shortcut) => {
    await stopRecording();
    try {
      settingsState.keys = await invoke('editor_settings_set', { which, shortcut });
      saySetting(which, '');
      if (which === 'capture') {
        emptyText = emptyStateText(settingsState.keys.capture);
        drawHud();
      }
    } catch (err) {
      saySetting(which, String(err));
    }
    drawSettings();
  };
  const openSettings = async () => {
    if (settingsState.open) return;
    // Every way out of a note keeps it: one being typed is committed before the modal
    // takes the keyboard, as a click outside the bubble would.
    if (model.editing) commitEditing();
    settingsState.keys = await invoke('editor_settings').catch(() => null);
    settingsState.open = true;
    document.body.classList.add('settings');
    drawSettings();
    sayUnavailable();
    settingsPanel.focus();
  };
  const closeSettings = async () => {
    if (!settingsState.open) return;
    await stopRecording();
    settingsState.open = false;
    document.body.classList.remove('settings');
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  };
  // By the physical key, so the shortcut is the same under a Hebrew layout.
  const MODIFIER_CODES = new Set(['ControlLeft', 'ControlRight', 'ShiftLeft', 'ShiftRight', 'AltLeft', 'AltRight', 'MetaLeft', 'MetaRight']);
  const shortcutOf = (event) => {
    if (MODIFIER_CODES.has(event.code) || !event.code) return null;
    const key = event.code.startsWith('Key') ? event.code.slice(3) : event.code.startsWith('Digit') ? event.code.slice(5) : event.code;
    const mods = [event.ctrlKey && 'Ctrl', event.altKey && 'Alt', event.shiftKey && 'Shift', event.metaKey && 'Win'].filter(Boolean);
    return { text: [...mods, key].join('+'), bare: mods.length === 0 && !/^F\d+$/.test(key) };
  };
  window.addEventListener('keydown', (event) => {
    if (!settingsState.open) return;
    // The modal owns the keyboard: the editor under it hears nothing.
    event.stopImmediatePropagation();
    const which = settingsState.recording;
    if (which) {
      event.preventDefault();
      if (event.code === 'Escape' && !event.ctrlKey && !event.altKey && !event.shiftKey && !event.metaKey) { stopRecording(); return; }
      const pressed = shortcutOf(event);
      if (!pressed) return;
      if (pressed.bare) { saySetting(which, 'Hold Ctrl, Alt, Shift or Win with the key.'); return; }
      setShortcut(which, pressed.text);
      return;
    }
    if (event.code === 'Escape') { event.preventDefault(); closeSettings(); return; }
    // Tab, Enter and Space work the modal's own buttons; everything else stops here.
    if (event.code !== 'Tab' && event.code !== 'Enter' && event.code !== 'Space') event.preventDefault();
  }, true);
  for (const type of ['keyup', 'paste', 'copy', 'cut', 'wheel']) {
    window.addEventListener(type, (event) => { if (settingsState.open) event.stopImmediatePropagation(); }, true);
  }
  for (const row of settingRows) {
    const which = row.dataset.which;
    row.querySelector('.key').addEventListener('click', () => startRecording(which));
    const clear = row.querySelector('.clear');
    if (clear) clear.addEventListener('click', () => setShortcut(which, ''));
  }
  document.getElementById('settings-close').addEventListener('click', () => closeSettings());
  settingsVeil.addEventListener('pointerdown', (event) => { if (event.target === settingsVeil) closeSettings(); });
  window.addEventListener('blur', () => { stopRecording(); });
  document.getElementById('win-settings').addEventListener('click', (event) => { const button = event.currentTarget; openSettings(); button.blur(); });
  window.addEventListener('resize', () => { refreshMaxButton(); });

  // ---------------------------------------------------------------- the mode
  //
  // §3.3: viewing arms no tool. The mode is the page's; the document behind it is the
  // host's, and the first tool picked asks the host for it (pickTool): created for the
  // file on screen, or resumed if one exists for that file and frame, never a second one.
  const applyMode = () => {
    document.body.classList.toggle('viewing', model.mode !== 'annotate');
    controls.hidden = !model.image.width;
    // The picture's size shows while a picture does, and the stage ends above it, so this comes
    // before any fit is measured (Rotem, 2026-09-16).
    document.body.classList.toggle('sized', !!model.image.width);
    drawHud();
  };
  // The image, with the note being typed if there is one, as Ctrl+C outside typing does.
  document.getElementById('copy').addEventListener('click', (event) => {
    copyComposed().catch(() => {});
    event.currentTarget.blur();
  });
  document.getElementById('saveas').addEventListener('click', (event) => {
    saveAs().catch(() => {});
    event.currentTarget.blur();
  });

  const setMode = async (mode) => {
    if (mode === model.mode) return model.mode;
    if (mode === 'annotate') {
      const info = await invoke('editor_annotate');
      // A resumed document is another number, so its notes come back through loadImage;
      // the view stays where it was when the image is the same size, so nothing jumps.
      const view = { zoom: model.zoom, pan: { ...model.pan } };
      const sameSize = info.width === model.image.width && info.height === model.image.height;
      await loadImage(info);
      if (sameSize) {
        model.zoom = view.zoom;
        model.pan = view.pan;
        // The view put back is the user's own, so a follow when the space returns keeps it.
        openedWithoutArea = false;
        await paintRegion();
      }
      model.mode = 'annotate';
      refreshStrip().catch(() => {});
    } else {
      if (model.editing) commitEditing();
      if (model.placing) cancelPlacing();
      model.selected = null;
      layoutScene();
      model.mode = 'view';
    }
    applyMode();
    return model.mode;
  };

  // The mode follows what is done, with no control of its own (Rotem, 2026-09-18): a tool
  // picked over a file only viewed starts its annotation first, once however many picks
  // arrive while the host answers, and the tool is in hand when the document is.
  let annotating = null;
  const pickTool = async (tool) => {
    if (model.mode !== 'annotate' && model.image.width) {
      annotating = annotating || setMode('annotate').finally(() => { annotating = null; });
      await annotating;
      // Another picture shown meanwhile is only viewed, and takes no tool it was not picked over.
      if (model.mode !== 'annotate') return;
    }
    setTool(tool);
  };

  // ---------------------------------------------------------------- editing

  const startEditing = (callout) => {
    // Another note still being typed is committed first. Without this its typed text was
    // never read back: layoutScene rewrote its element from the stale model text, and what
    // had been typed was gone (review of 2026-09-13, R1).
    if (model.editing && model.editing !== callout) commitEditing();
    model.editing = callout;
    model.selected = callout;
    layoutScene();
    const el = scene.querySelector(`[data-id="${callout.id}"] .t`);
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  };

  const commitEditing = () => {
    const callout = model.editing;
    if (!callout) return;
    const el = scene.querySelector(`[data-id="${callout.id}"] .t`);
    // innerText, not textContent: the engine keeps a typed line break as a block, and
    // textContent joins blocks with nothing between them, so a two-line note came back as
    // one line (review T6). innerText turns the blocks into newlines, which pre-wrap shows.
    callout.text = el
      ? el.innerText.replace(/\u00a0/g, ' ').replace(/\r\n?/g, '\n').replace(/\n+$/, '')
      : callout.text;
    model.editing = null;
    if (el) el.blur();
    // An empty bubble is discarded when editing ends, so it never reaches the output. It
    // was never a note, so its number comes back when it is the newest, as it does between
    // the two clicks (review 4, T5); a text note has no number to give back.
    if (callout.text.trim() === '') {
      removeCallout(callout);
      if (callout.kind !== 'text' && callout.number === model.nextNumber - 1) model.nextNumber -= 1;
    }
    // A note finished puts its tool down, so the pointer is the ordinary one and a drag pans
    // until a tool is picked again (Rotem, 2026-09-18).
    if (model.tool) setTool(null);
    settle();
    record();
    drawHud();
  };

  // ---------------------------------------------------------------- input

  let drag = null;

  // A pan drag from where the pointer went down: viewing's drag, a drag on the empty picture
  // with no tool in hand, and any drag while Space is held.
  const startPan = (event) => {
    drag = { kind: 'pan', x: event.clientX, y: event.clientY, pan: { ...model.pan } };
    // The copy of the whole picture shows under the canvas for the drag, when it is this picture's.
    if (backdropFor === imageKey()) document.body.classList.add('panning');
    try { stage.setPointerCapture(event.pointerId); } catch (e) { /* a synthetic pointer */ }
    event.preventDefault();
  };

  // Space held gives any tool the ordinary pointer and a drag that pans, and lets go with the
  // key or when the window loses the keyboard (Rotem, 2026-09-14). The page's class takes the
  // pointer off the notes while it is held.
  let spaceHeld = false;
  const setSpaceHeld = (held) => {
    if (spaceHeld === held) return;
    spaceHeld = held;
    document.body.classList.toggle('space', held);
  };

  // The callout in two clicks (Rotem, 2026-09-16): the first click marks where the line
  // ends and the bubble appears at its automatic place, the starting position §3.5 promises;
  // from there it moves with the pointer, keeping that offset, so it never covers the point
  // it names and the second click lands on the picture. The second click locks it where it
  // is and starts the typing. Between the clicks Escape, Ctrl+Z or a change of tool drops
  // the unplaced bubble and gives its number back, as a drawn shape shorter than four
  // pixels gives back its own: nothing was ever shown as a note, so there is no gap to keep.
  let placingOffset = { x: 0, y: 0 };
  const beginPlacing = (callout, at) => {
    model.placing = callout;
    placingOffset = { x: callout.box.x - at.x, y: callout.box.y - at.y };
  };
  const followPointer = (point) => {
    model.placing.box.x = Math.round(point.x + placingOffset.x);
    model.placing.box.y = Math.round(point.y + placingOffset.y);
  };
  const cancelPlacing = () => {
    const callout = model.placing;
    if (!callout) return;
    model.placing = null;
    removeCallout(callout);
    model.nextNumber -= 1;
    settle();
    drawHud();
  };

  stage.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) return;
    const target = event.target;

    // Viewing mode, or Space held: the drag pans, whatever it started on, and nothing is
    // created or selected (§3.3). The scene takes no pointer then, so the target is the
    // stage or the canvas either way.
    if (model.mode !== 'annotate' || spaceHeld) {
      if (!model.image.width) return;
      startPan(event);
      return;
    }

    // The second click of a callout: wherever it lands, the bubble or the picture, it locks
    // the bubble where it is and the typing begins.
    if (model.placing) {
      const callout = model.placing;
      followPointer(toImage(event));
      model.placing = null;
      settle();
      startEditing(callout);
      event.preventDefault();
      return;
    }

    if (target.classList.contains('t')) {
      const callout = model.callouts.find((c) => c.id === target.closest('.callout').dataset.id);
      startEditing(callout);
      return;
    }

    // A crop handle (S3.6): the drag moves its edge, or a corner's two, inward, and the
    // release cuts the picture to the frame.
    const handleEl = target.closest && target.closest('#crop .h');
    if (handleEl && model.tool === 'crop') {
      if (model.editing) commitEditing();
      const from = pictureRect();
      model.cropping = { ...from };
      drag = { kind: 'crop', edge: handleEl.dataset.edge, from };
      try { stage.setPointerCapture(event.pointerId); } catch (e) { /* a synthetic pointer */ }
      layoutScene();
      event.preventDefault();
      return;
    }

    if (target.classList.contains('anchor')) {
      const callout = model.callouts.find((c) => c.id === target.dataset.anchorFor);
      const point = toImage(event);
      drag = { kind: 'anchor', callout, dx: callout.anchor.x - point.x, dy: callout.anchor.y - point.y };
      try { target.setPointerCapture(event.pointerId); } catch (e) { /* a synthetic pointer */ }
      event.preventDefault();
      return;
    }

    const shapeEl = target.closest && target.closest('[data-shape]');
    if (shapeEl) {
      const shape = model.shapes.find((s) => s.id === shapeEl.dataset.shape);
      // The ruler's x (Rotem, 2026-09-16): one press deletes it, one step of undo.
      if (target.closest('.ruler .x')) {
        if (model.editing) commitEditing();
        removeShape(shape);
        settle();
        record();
        drawHud();
        event.preventDefault();
        return;
      }
      if (model.editing) commitEditing();
      model.selected = null;
      model.selectedShape = shape;
      const point = toImage(event);
      drag = { kind: 'shape', shape, dx: shape.a.x - point.x, dy: shape.a.y - point.y, bx: shape.b.x - point.x, by: shape.b.y - point.y, moved: false };
      try { stage.setPointerCapture(event.pointerId); } catch (e) { /* a synthetic pointer */ }
      layoutScene();
      event.preventDefault();
      return;
    }

    const box = target.closest('.callout');
    if (box) {
      const callout = model.callouts.find((c) => c.id === box.dataset.id);
      model.selected = callout;
      const point = toImage(event);
      drag = { kind: 'box', callout, dx: callout.box.x - point.x, dy: callout.box.y - point.y };
      try { stage.setPointerCapture(event.pointerId); } catch (e) { /* a synthetic pointer */ }
      layoutScene();
      event.preventDefault();
      return;
    }

    // Empty canvas with no tool in hand: a click creates nothing and a drag pans, as in
    // viewing; a note being typed is committed and a selection cleared on the way
    // (Rotem, 2026-09-14).
    if (!model.tool) {
      if (model.editing) commitEditing();
      if (model.selected || model.selectedShape) {
        model.selected = null;
        model.selectedShape = null;
        layoutScene();
      }
      startPan(event);
      return;
    }
    // Empty canvas. Committing first means a click somewhere else ends the note being
    // typed, which is what "no Apply step" has to feel like.
    if (model.editing) {
      commitEditing();
      return;
    }
    if (model.selected || model.selectedShape) {
      model.selected = null;
      model.selectedShape = null;
      layoutScene();
      return;
    }
    // The crop tool makes nothing by a click on the picture: only its handles cut, and a
    // drag on the picture pans, as with no tool in hand.
    if (model.tool === 'crop') {
      startPan(event);
      return;
    }
    if (model.tool === 'arrow' || model.tool === 'rect' || model.tool === 'highlight' || model.tool === 'blur' || model.tool === 'ruler') {
      const shape = createShape(model.tool, toImage(event));
      drag = { kind: 'draw', shape };
      try { stage.setPointerCapture(event.pointerId); } catch (e) { /* a synthetic pointer */ }
      layoutScene();
      event.preventDefault();
      return;
    }
    const at = toImage(event);
    if (model.tool === 'text') {
      const note = createTextNote(at);
      layoutScene();
      startEditing(note);
      return;
    }
    // The first click: the anchor, and a bubble that follows the pointer until the second.
    const callout = createCallout(at);
    beginPlacing(callout, at);
    layoutScene();
    event.preventDefault();
  });

  // A drag moves faster than a region comes back, and every newer request makes the answer
  // still on its way stale (part 5), so asking on every move painted nothing until the
  // pointer stopped. During a pan drag one region is asked for at a time, the newest pan as
  // soon as the last one lands (Rotem, 2026-09-15).
  let dragRegion = null;
  let dragRegionAgain = false;
  const paintWhileDragging = () => {
    if (dragRegion) { dragRegionAgain = true; return; }
    dragRegion = paintRegion().catch((err) => console.error('pan', err)).finally(() => {
      dragRegion = null;
      if (dragRegionAgain) { dragRegionAgain = false; paintWhileDragging(); }
    });
  };

  stage.addEventListener('pointermove', (event) => {
    if (!drag && model.placing) {
      followPointer(toImage(event));
      layoutScene();
      return;
    }
    if (!drag) return;
    if (drag.kind === 'pan') {
      model.pan.x = drag.pan.x - ((event.clientX - drag.x) * dpr()) / model.zoom;
      model.pan.y = drag.pan.y - ((event.clientY - drag.y) * dpr()) / model.zoom;
      // What is already painted, and the notes, follow the pointer at once; the region under
      // the new pan comes in behind them.
      clampPan();
      placeComposition(viewport());
      slideCanvas(lastRegion);
      layoutScene();
      paintWhileDragging();
      return;
    }
    const point = toImage(event);
    if (drag.kind === 'crop') {
      model.cropping = cropFrom(drag.from, drag.edge, point);
      layoutScene();
      return;
    }
    if (drag.kind === 'draw') {
      drag.shape.b = { x: Math.round(point.x), y: Math.round(point.y) };
      if (drag.shape.kind === 'blur' || drag.shape.kind === 'ruler') layoutScene(); else drawArrows();
      return;
    }
    if (drag.kind === 'shape') {
      drag.shape.a = { x: Math.round(point.x + drag.dx), y: Math.round(point.y + drag.dy) };
      drag.shape.b = { x: Math.round(point.x + drag.bx), y: Math.round(point.y + drag.by) };
      drag.moved = true;
      if (drag.shape.kind === 'blur' || drag.shape.kind === 'ruler') layoutScene(); else drawArrows();
      return;
    }
    if (drag.kind === 'anchor') {
      drag.callout.anchor.x = Math.round(point.x + drag.dx);
      drag.callout.anchor.y = Math.round(point.y + drag.dy);
    } else {
      drag.callout.box.x = Math.round(point.x + drag.dx);
      drag.callout.box.y = Math.round(point.y + drag.dy);
    }
    layoutScene();
  });

  // The ruler's magnifier follows the pointer over the stage and goes when it leaves.
  stage.addEventListener('pointermove', (event) => {
    magPointer = { clientX: event.clientX, clientY: event.clientY };
    drawMag();
  });
  stage.addEventListener('pointerleave', () => {
    magPointer = null;
    drawMag();
  });

  // Pasted text arrives as text. Rich HTML in a bubble would be markup the export never
  // agreed to carry.
  stage.addEventListener('paste', (event) => {
    if (!model.editing) return;
    event.preventDefault();
    const text = (event.clipboardData || window.clipboardData).getData('text/plain');
    if (text) document.execCommand('insertText', false, text.replace(/\r\n?/g, '\n'));
  });

  const endDrag = () => {
    if (!drag) return;
    // A crop handle released cuts the picture to the frame, one step of history; released
    // where it was, nothing changes.
    if (drag.kind === 'crop') {
      const rect = model.cropping;
      const was = drag.from;
      model.cropping = null;
      drag = null;
      if (rect.x !== was.x || rect.y !== was.y || rect.w !== was.w || rect.h !== was.h) {
        applyCrop(rect);
        record();
      } else {
        layoutScene();
      }
      return;
    }
    const moved = drag.kind !== 'pan';
    // A pan that moved ends painted the ordinary way, the canvas back on a physical pixel
    // (F74) after sliding by its region's origin while the drag lasted (Rotem, 2026-09-15).
    const panned = drag.kind === 'pan' && (model.pan.x !== drag.pan.x || model.pan.y !== drag.pan.y);
    // A drawn shape with no length is a click, not a shape, and it takes no number, so
    // nothing of it reaches the history.
    let drew = drag.kind === 'draw';
    if (drew && Math.hypot(drag.shape.b.x - drag.shape.a.x, drag.shape.b.y - drag.shape.a.y) < 4) {
      removeShape(drag.shape);
      model.nextShape -= 1;
      drew = false;
    }
    drag = null;
    if (panned) paintRegion();
    else document.body.classList.remove('panning');
    // A dropped bubble takes, or gives back, its margin, and is one step of history.
    settle();
    if (moved) record();
    // A shape drawn puts its tool down, as a note finished does (Rotem, 2026-09-18).
    if (drew) setTool(null);
  };
  // A note growing as it is typed takes its room as it goes, so nothing it holds is ever
  // outside the composition an export would cut at.
  stage.addEventListener('input', () => {
    if (!model.editing) return;
    // The typed text is read into the model at commit; saving it before that would save
    // the previous text under the new timestamp, so a keystroke commits the text to the
    // model first, without ending the editing.
    const el = scene.querySelector(`[data-id="${model.editing.id}"] .t`);
    if (el) model.editing.text = el.innerText.replace(/\u00a0/g, ' ').replace(/\r\n?/g, '\n').replace(/\n+$/, '');
    markDirty();
    if (fitMargin()) paintRegion();
  });
  // The wheel zooms around the pointer, with Ctrl or without, so the point under it stays
  // put (§3.4; Rotem, 2026-09-14). A sideways wheel still pans: its numbers are CSS pixels,
  // so they become image pixels through the ratio and the zoom.
  stage.addEventListener('wheel', (event) => {
    if (!model.image.width) return;
    event.preventDefault();
    if (event.deltaY !== 0) {
      const factor = event.deltaY < 0 ? 1.25 : 1 / 1.25;
      const box = stage.getBoundingClientRect();
      setZoomAround(model.zoom * factor, event.clientX - box.left, event.clientY - box.top);
      return;
    }
    const step = event.deltaMode === 1 ? 40 : 1;
    model.pan.x += (event.deltaX * step * dpr()) / model.zoom;
    paintRegion();
  }, { passive: false });

  const setFullscreen = async (on) => {
    model.fullscreen = await invoke('editor_fullscreen', { on });
    document.body.classList.toggle('fullscreen', model.fullscreen);
    document.body.classList.toggle('strip', stripWanted && !model.fullscreen);
    if (!model.fullscreen) layoutStrip(); // the window may have changed size while the strip was away
    await measureRatio();
    followFit();
    await paintRegion();
    return model.fullscreen;
  };

  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', (event) => {
    // Copy the composed image, current text edits included, from anywhere (§3.6).
    // By physical key, so the shortcut is the same under a Hebrew layout, where event.key
    // for that key is a Hebrew letter. The rest of the keyboard contract is S1.7.
    if (event.ctrlKey && event.shiftKey && !event.altKey && event.code === 'KeyC') {
      copyComposed().catch((err) => console.error('copy failed', err && err.stack ? err.stack : String(err)));
      event.preventDefault();
      return;
    }
    // Ctrl+O opens a file through Windows' own picker (§3.1); by physical key, like the
    // copy above.
    if (event.ctrlKey && !event.shiftKey && !event.altKey && event.code === 'KeyO') {
      invoke('editor_open_dialog').catch((err) => console.error('open', err));
      event.preventDefault();
      return;
    }
    // Text size, and it works while typing too: Ctrl is not a character, so the note being
    // written can be resized without leaving it.
    if (event.ctrlKey && !event.altKey && (event.key === '+' || event.key === '=')) {
      nudgeTextSize(1);
      event.preventDefault();
      return;
    }
    if (event.ctrlKey && !event.altKey && (event.key === '-' || event.key === '_')) {
      nudgeTextSize(-1);
      event.preventDefault();
      return;
    }
    if (event.key === 'Enter' && model.editing && !event.altKey && !(event.ctrlKey && event.shiftKey)) {
      // Enter keeps the text and leaves the typing, as a click outside the bubble does;
      // Ctrl+Enter breaks the line (Rotem, 2026-09-17; Enter broke it before). Shift+Enter
      // breaks it as it did. The break is a newline CHARACTER rather than the engine's
      // block, so the bubble stays one text node and what is typed is exactly what is stored.
      if (event.ctrlKey || event.shiftKey) document.execCommand('insertText', false, '\n');
      else commitEditing();
      event.preventDefault();
      return;
    }
    // Copy and Return, from anywhere, a note being typed included (§3.6).
    if (event.ctrlKey && !event.shiftKey && !event.altKey && event.key === 'Enter') {
      copyAndReturn().catch((err) => console.error('copy and return failed', err && err.stack ? err.stack : String(err)));
      event.preventDefault();
      return;
    }
    // Save As, a new PNG file every time (§3.6). Taken while typing too, so the web view's
    // own save page dialog never appears.
    if (event.ctrlKey && !event.shiftKey && !event.altKey && event.code === 'KeyS') {
      saveAs().catch((err) => console.error('save as', err));
      event.preventDefault();
      return;
    }
    // Send to Rogers is stage 4: the key is taken and does nothing yet.
    if (event.ctrlKey && event.shiftKey && !event.altKey && event.key === 'Enter') {
      event.preventDefault();
      return;
    }
    if (event.key === 'Escape') {
      if (model.placing) { cancelPlacing(); event.preventDefault(); return; }
      if (model.editing) { commitEditing(); event.preventDefault(); return; }
      if (model.selected || model.selectedShape) { model.selected = null; model.selectedShape = null; layoutScene(); event.preventDefault(); return; }
      // Fullscreen leaves first (§3.6); the hide is the Escape after it.
      if (model.fullscreen) { setFullscreen(false).catch((err) => console.error('fullscreen', err)); event.preventDefault(); return; }
      // The idle editor: pending changes are saved, then hide, and the focus goes back to
      // where the capture began (§3.1, §3.8).
      saveNow().catch(() => 'failed').then((state) => {
        if (state === 'failed') {
          notice(`NOT SAVED: ${model.save.error}. The editor stays with your work`, 0);
          return null;
        }
        return invoke('editor_hide');
      }).catch((err) => console.error('hide', err));
      event.preventDefault();
      return;
    }
    if (model.editing) return; // typing owns every other key, the engine's undo included

    // Space held: the ordinary pointer and a drag that pans, whatever tool is in hand
    // (Rotem, 2026-09-14); by physical key, and never while a note is typed, above.
    if (event.code === 'Space' && !event.ctrlKey && !event.altKey && !event.metaKey) {
      if (model.image.width) setSpaceHeld(true);
      event.preventDefault();
      return;
    }

    // Outside text editing, Ctrl+C copies the composed image (§3.6); while editing it is
    // the text copy it always was, which is why it sits below the line above.
    if (event.ctrlKey && !event.shiftKey && !event.altKey && event.code === 'KeyC') {
      copyComposed().catch((err) => console.error('copy failed', err && err.stack ? err.stack : String(err)));
      event.preventDefault();
      return;
    }
    if (event.ctrlKey && !event.altKey && event.code === 'KeyZ') {
      // Between a callout's two clicks the last thing done is the first click: Ctrl+Z takes
      // it back, the unplaced bubble goes, and there is nothing of it to redo.
      if (model.placing && !event.shiftKey) { cancelPlacing(); event.preventDefault(); return; }
      if (event.shiftKey) redo(); else undo();
      event.preventDefault();
      return;
    }
    if (event.ctrlKey && !event.shiftKey && !event.altKey && event.code === 'KeyY') {
      redo();
      event.preventDefault();
      return;
    }
    if (event.key === 'F11') {
      setFullscreen(!model.fullscreen).catch((err) => console.error('fullscreen', err));
      event.preventDefault();
      return;
    }
    // Ctrl+Delete deletes the document on screen (S2.5, provisional key); plain Delete
    // stays the selected note's.
    if (event.key === 'Delete' && event.ctrlKey && !event.shiftKey && !event.altKey) {
      if (model.image.document_id && model.image.managed) deleteDocument(model.image.document_id).catch((err) => console.error('delete', err));
      event.preventDefault();
      return;
    }
    if (event.key === 'Delete' || event.key === 'Backspace') {
      if (model.selected) { removeCallout(model.selected); settle(); record(); drawHud(); event.preventDefault(); }
      else if (model.selectedShape) { removeShape(model.selectedShape); settle(); record(); drawHud(); event.preventDefault(); }
      return;
    }
    // The tools, by physical key (Stage 3); over a file only viewed the pick starts the
    // annotation (Rotem, 2026-09-18).
    if (model.image.width && !event.ctrlKey && !event.altKey && !event.metaKey) {
      if (event.code === 'KeyC') { pickTool('callout').catch((err) => console.error('tool', err)); event.preventDefault(); return; }
      if (event.code === 'KeyL') { pickTool('arrow').catch((err) => console.error('tool', err)); event.preventDefault(); return; }
      if (event.code === 'KeyR') { pickTool('rect').catch((err) => console.error('tool', err)); event.preventDefault(); return; }
      if (event.code === 'KeyH') { pickTool('highlight').catch((err) => console.error('tool', err)); event.preventDefault(); return; }
      if (event.code === 'KeyT') { pickTool('text').catch((err) => console.error('tool', err)); event.preventDefault(); return; }
      if (event.code === 'KeyB') { pickTool('blur').catch((err) => console.error('tool', err)); event.preventDefault(); return; }
      if (event.code === 'KeyM') { pickTool('ruler').catch((err) => console.error('tool', err)); event.preventDefault(); return; }
      if (event.code === 'KeyK') { pickTool('crop').catch((err) => console.error('tool', err)); event.preventDefault(); return; } // provisional key
    }
    if (event.key === 'Enter' && model.selected) { startEditing(model.selected); event.preventDefault(); return; }

    // Previous and next through the folder the file came from, first and last at the ends
    // (§3.4, §3.6). The host answers with the image now on screen; at an end that is the
    // same one, and the same document keeps its view.
    const steps = { PageDown: 'next', PageUp: 'previous', Home: 'first', End: 'last' };
    if (steps[event.key] && model.image.total > 0) {
      saveNow().catch(() => {});
      invoke('editor_navigate', { step: steps[event.key] })
        .then((info) => loadImage(info))
        .catch((err) => console.error('navigate', err));
      event.preventDefault();
      return;
    }

    // Frames of an animation or pages of a file, by index, which is §3.7's contract made
    // visible: the frame on screen is the one asked for, never a default first frame.
    if ((event.key === ']' || event.key === '[') && model.image.count > 1) {
      const next = event.key === ']'
        ? Math.min(model.image.count - 1, model.image.index + 1)
        : Math.max(0, model.image.index - 1);
      if (next !== model.image.index) invoke('editor_frame', { index: next }).catch((err) => console.error('frame', err));
      return;
    }
    const step = 120;
    if (event.key === '0') { setZoom(model.fitZoom); return; }
    if (event.key === '1') { setZoom(1); return; }
    if (event.key === '+' || event.key === '=') { setZoom(model.zoom * 1.5); return; }
    if (event.key === '-') { setZoom(model.zoom / 1.5); return; }
    if (event.key === 'ArrowLeft') { model.pan.x -= step; paintRegion(); return; }
    if (event.key === 'ArrowRight') { model.pan.x += step; paintRegion(); return; }
    if (event.key === 'ArrowUp') { model.pan.y -= step; paintRegion(); return; }
    if (event.key === 'ArrowDown') { model.pan.y += step; paintRegion(); return; }
  });
  // Space lets go with the key, and when the window loses the keyboard, since a key released
  // in another window never reaches this page (Rotem, 2026-09-14).
  window.addEventListener('keyup', (event) => { if (event.code === 'Space') setSpaceHeld(false); });
  window.addEventListener('blur', () => setSpaceHeld(false));

  // Zooms so that one image point stays under one viewport point: the centre for a key,
  // the pointer for the wheel (§3.4). Anything else feels like the image jumped.
  const setZoomAround = (next, cssX, cssY) => {
    const vp = viewport();
    const at = {
      x: model.pan.x + ((cssX - model.offset.x) * dpr()) / model.zoom,
      y: model.pan.y + ((cssY - model.offset.y) * dpr()) / model.zoom,
    };
    // The whole picture, as the stage is now, is the most it zooms out (Rotem, 2026-09-15):
    // read live, the kept fit on a stage with no area, and never above the zoom on screen, so a
    // zoom out never enlarges the picture.
    model.zoom = Math.min(8, Math.max(Math.min(wholeNow(), model.zoom), next));
    model.pan.x = at.x - ((cssX - model.offset.x) * dpr()) / model.zoom;
    model.pan.y = at.y - ((cssY - model.offset.y) * dpr()) / model.zoom;
    return paintRegion();
  };

  const setZoom = (next) => {
    const vp = viewport();
    const before = {
      x: model.pan.x + (vp.w * dpr()) / model.zoom / 2,
