<!doctype html>
<meta charset="utf-8" />
<title>Recon</title>
<style>
  /* S0.4: the editor window, the scene, and one callout.
     No toolbar, no document strip, no persistence, no export. Those are later steps, and
     this file has to stay small enough to be the thing the composition contract is proved
     on rather than the thing it is buried in. */
  :root { color-scheme: dark; --ink: #f0f0f0; --paper: #101214; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink);
               font: 13px/1.45 ui-sans-serif, "Segoe UI", system-ui, sans-serif;
               overflow: hidden; }

  #stage { position: absolute; inset: 0; overflow: hidden; cursor: crosshair; }
  #canvas { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; }
  /* The annotation margin, drawn under the picture in the same colour the host puts in the
     output, so what is on screen is what a copy contains (§3.5, §3.6). */
  #mat { position: absolute; left: 0; top: 0; display: none; background: #e9eaec; }

  /* Everything below is laid out in IMAGE pixels and scaled by one transform on this
     container. Part 5: layout is computed before the transform exists, so zoom cannot
     re-wrap a single line of text. */
  #scene { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #arrows { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

  /* The text size is set per note, from the model, in image pixels. Everything else
     about the bubble is a proportion of it, so a bigger note is a bigger note rather than
     a large font crammed into a small box. At the default of 20 these ems are exactly the
     6, 8, 10 and 8 pixels the first version hard-coded. */
  .callout { position: absolute; display: flex; gap: .3em; align-items: flex-start;
             padding: .4em .5em; border-radius: .4em; background: #1b1f24; color: #f2f2f2;
             border: 1px solid #3a4149; box-shadow: 0 2px 10px rgba(0,0,0,.45);
             line-height: 1.35; }
  .callout.selected { border-color: #7aa7ff; }
  .callout .n { flex: 0 0 auto; font-size: .7em; min-width: 1.6em; height: 1.6em;
                border-radius: .8em; background: #7aa7ff; color: #0d1014; font-weight: 700;
                display: grid; place-items: center; }
  /* Outline and background only: a caret or a selection ring must never change layout,
     because the export has to agree with what is on screen (part 5's third remedy). */
  .callout .t { flex: 1 1 auto; min-width: 1ch; outline: none; white-space: pre-wrap;
                word-break: break-word; }
  .callout .t:focus { background: rgba(122,167,255,.14); outline: 1px solid #7aa7ff;
                      outline-offset: 2px; }
  .anchor { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px;
            border-radius: 50%; background: #7aa7ff; border: 2px solid #0d1014;
            cursor: grab; }
  /* Plain: no editing decoration at all, for the moment the scene is serialized into the
     output and for the moment the screen is compared against it (S0.6 check 3). Colours
     only, never a layout property, so switching it cannot move a pixel of text. */
  body.plain .callout.selected { border-color: #3a4149; }
  body.plain .callout .t:focus { background: transparent; outline: none; }
  body.plain .callout .t { caret-color: transparent; }

  #hud { position: absolute; left: 12px; bottom: 10px; padding: 6px 10px; border-radius: 6px;
         background: rgba(10,12,14,.82); color: #cfd4da; font-size: 12px;
         font-family: ui-monospace, Consolas, monospace; pointer-events: none;
         white-space: pre; }
  #probe { position: absolute; inset: 0; display: none; }
  body.checking #stage { cursor: progress; }
  #report { position: absolute; inset: 0; display: none; padding: 18px 22px; overflow: auto;
            background: #0c0e10; font-family: ui-monospace, Consolas, monospace;
            font-size: 12px; white-space: pre-wrap; }
  body.reporting #report { display: block; }
</style>

<div id="stage">
  <div id="mat"></div>
  <canvas id="canvas"></canvas>
  <div id="scene">
    <svg id="arrows"></svg>
  </div>
</div>
<div id="hud"></div>
<div id="report"></div>

<script>
(() => {
  const invoke = window.__TAURI__.core.invoke;
  // A command that only the stage0-checks build registers answers false in the product,
  // where asking for it is an error rather than a no.
  const flag = async (name) => { try { return await invoke(name); } catch { return false; } };

  // Everything this page says goes to the terminal as well. A web view that throws inside a
  // hidden window is otherwise completely silent, which cost one whole run.
  const toHost = (level, line) => { invoke('editor_log', { level, line }).catch(() => {}); };
  for (const level of ['log', 'warn', 'error']) {
    const original = console[level].bind(console);
    console[level] = (...args) => {
      original(...args);
      toHost(level, args.map((a) => (a && a.stack) ? a.stack : String(a)).join(' '));
    };
  }
  window.addEventListener('error', (e) => toHost('error', `${e.message} at ${e.filename}:${e.lineno}`));
  window.addEventListener('unhandledrejection', (e) => toHost('error', `unhandled rejection: ${e.reason && e.reason.stack ? e.reason.stack : e.reason}`));
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const mat = document.getElementById('mat');
  const scene = document.getElementById('scene');
  const arrows = document.getElementById('arrows');
  const hud = document.getElementById('hud');
  const context = canvas.getContext('2d', { alpha: false });

  // ---------------------------------------------------------------- the scene
  //
  // Coordinates. There are exactly two spaces in this file and they are never mixed:
  //
  //   image  pixels of the source image, origin at its top-left. Everything stored lives
  //          here: anchors, bubbles, text boxes.
  //   view   what is on screen. Reached from image space by ONE transform on #scene, and
  //          from a pointer event by the inverse. Nothing is stored in this space.
  //
  // zoom is DEVICE pixels per image pixel, so zoom === 1 is actual size on this display
  // whatever its scaling. The canvas backing store is in device pixels and its CSS size is
  // that divided by the device pixel ratio, which is what makes a 1:1 view genuinely 1:1.

  const model = {
    image: { width: 0, height: 0, source: '' },
    zoom: 1,
    fitZoom: 1,
    // Top-left of the visible region, in image pixels.
    pan: { x: 0, y: 0 },
    // Where the canvas sits inside the viewport, in CSS pixels. Non-zero whenever the
    // image is smaller than the window, which at fit-to-window is most of the time: found
    // by looking at the thing, where a 5120x1440 capture sat in the top-left corner of a
    // 1280x800 window with two thirds of the window empty below it.
    offset: { x: 0, y: 0 },
    // The size the NEXT note gets, in image pixels. Each note then carries its own, so
    // changing the size later never rewrites the notes already written.
    textSize: 20,
    // The annotation margin, image pixels per edge (§3.5). Canvas space is image space
    // plus this, and the output is the source plus this (§3.6). Set explicitly for now;
    // growing it automatically when a bubble cannot fit is the placement work of S1.2.
    margin: { left: 0, top: 0, right: 0, bottom: 0 },
    callouts: [],
    nextNumber: 1,
    selected: null,
    editing: null,
  };

  // The ratio of physical pixels to CSS pixels for THIS window, measured rather than
  // believed. This web view reports devicePixelRatio 1 on a 225% display, so trusting it
  // would make "actual size" wrong by a factor of the display scale, quietly.
  let ratio = 1;
  const dpr = () => ratio;

  const measureRatio = async () => {
    const metrics = await invoke('editor_window_metrics');
    const css = viewport();
    const measured = css.w > 0 ? metrics.physical_width / css.w : 1;
    ratio = Math.max(0.5, Math.min(4, measured));
    console.log(
      `window ${metrics.physical_width}x${metrics.physical_height} physical, ` +
      `${css.w}x${css.h} css, ratio ${ratio.toFixed(3)}, ` +
      `scale factor ${metrics.scale_factor}, window dpi ${metrics.window_dpi} (${Math.round(metrics.window_dpi/96*100)}%), devicePixelRatio ${window.devicePixelRatio}`
    );
    return ratio;
  };
  const viewport = () => ({ w: stage.clientWidth, h: stage.clientHeight });

  const clampPan = () => {
    const vp = viewport();
    const visibleW = (vp.w * dpr()) / model.zoom;
    const visibleH = (vp.h * dpr()) / model.zoom;
    const maxX = Math.max(0, model.image.width - visibleW);
    const maxY = Math.max(0, model.image.height - visibleH);
    model.pan.x = Math.min(Math.max(0, model.pan.x), maxX);
    model.pan.y = Math.min(Math.max(0, model.pan.y), maxY);
  };

  const toImage = (event) => {
    const box = stage.getBoundingClientRect();
    const cssX = event.clientX - box.left - model.offset.x;
    const cssY = event.clientY - box.top - model.offset.y;
    return {
      x: model.pan.x + (cssX * dpr()) / model.zoom,
      y: model.pan.y + (cssY * dpr()) / model.zoom,
    };
  };

  // ---------------------------------------------------------------- the pixels
  //
  // The host is asked for the region that is visible, at the size it will be shown. At
  // zoom 1 that is a 1:1 copy and the host does not resample at all; at fit it is a
  // downscale of only what is on screen. An enlarged preview of a smaller view is never
  // what a closer view is made of, which is the policy in part 5.

  let regionRequest = 0;
  let lastRegion = null;

  // The notes of every document this page has held, by the host's document number, so a
  // new capture never overwrites the previous one's work (§3.3): the current document's
  // notes are stashed here when another arrives, and S1.9 brings them back.
  const documents = new Map();

  const stashCurrent = () => {
    if (!model.image.document_id) return;
    if (model.editing) commitEditing();
    documents.set(model.image.document_id, {
      callouts: model.callouts,
      nextNumber: model.nextNumber,
      margin: { ...model.margin },
      textSize: model.textSize,
    });
  };

  const emptyStateText = (hotkey) => (hotkey ? `Press ${hotkey} to capture` : 'no capture yet');

  const paintRegion = async () => {
    const vp = viewport();
    if (!model.image.width || vp.w < 2 || vp.h < 2) return;
    clampPan();

    const outW = Math.max(1, Math.round(vp.w * dpr()));
    const outH = Math.max(1, Math.round(vp.h * dpr()));
    const srcW = Math.max(1, Math.round(outW / model.zoom));
    const srcH = Math.max(1, Math.round(outH / model.zoom));
    const x = Math.round(model.pan.x);
    const y = Math.round(model.pan.y);

    const ticket = ++regionRequest;
    const url = `http://region.localhost/?x=${x}&y=${y}&w=${srcW}&h=${srcH}&ow=${outW}&oh=${outH}`;
    const askedAt = performance.now();
    const response = await fetch(url, { cache: 'no-store' });
    // 409 is the host saying a newer request replaced this one, which is the design, not
    // an error: the newer one paints. Anything else is a real refusal.
    if (response.status === 409) return;
    if (!response.ok) throw new Error(`the region was refused: ${response.status}`);
    const whole = new Uint8Array(await response.arrayBuffer());
    const header = new DataView(whole.buffer, 0, 8);
    const width = header.getUint32(0, true);
    const height = header.getUint32(4, true);
    const bytes = whole.subarray(8);
    // A late answer for a view the user has already left is dropped rather than painted,
    // which is the stale-response half of part 5's display policy.
    if (ticket !== regionRequest) return;
    if (bytes.length !== width * height * 4) {
      throw new Error(`the region is ${bytes.length} bytes for ${width}x${height}`);
    }

    canvas.width = width;
    canvas.height = height;
    const cssW = width / dpr();
    const cssH = height / dpr();
    canvas.style.width = `${cssW}px`;
    canvas.style.height = `${cssH}px`;
    // Centred when the composition does not fill the window, which is what anyone expects
    // of a viewer and is not what the first version did. The offset is where the IMAGE
    // starts; with a margin the composition is centred and the image sits inside it.
    const comp = compositionSize();
    const compW = (comp.w * model.zoom) / dpr();
    const compH = (comp.h * model.zoom) / dpr();
    // The offset lands on a PHYSICAL pixel, so it may be a fraction of a CSS pixel. On a
    // 225% display a whole CSS pixel is 2.25 physical ones, and a picture or a note placed
    // at a whole CSS offset sits between physical pixels and is resampled: the live editor
    // and the copy then differed on 12% of the text's pixels while agreeing at 100%
    // (S1.1, F74).
    const snap = (css) => Math.round(css * dpr()) / dpr();
    model.offset.x = compW <= vp.w
      ? snap((vp.w - compW) / 2 + (model.margin.left * model.zoom) / dpr())
      : Math.max(0, snap((vp.w - cssW) / 2));
    model.offset.y = compH <= vp.h
      ? snap((vp.h - compH) / 2 + (model.margin.top * model.zoom) / dpr())
      : Math.max(0, snap((vp.h - cssH) / 2));
    canvas.style.left = `${model.offset.x}px`;
    canvas.style.top = `${model.offset.y}px`;
    const hasMargin = comp.w !== model.image.width || comp.h !== model.image.height;
    mat.style.display = hasMargin ? 'block' : 'none';
    if (hasMargin) {
      mat.style.left = `${model.offset.x - ((model.pan.x + model.margin.left) * model.zoom) / dpr()}px`;
      mat.style.top = `${model.offset.y - ((model.pan.y + model.margin.top) * model.zoom) / dpr()}px`;
      mat.style.width = `${compW}px`;
      mat.style.height = `${compH}px`;
    }
    context.putImageData(new ImageData(new Uint8ClampedArray(bytes), width, height), 0, 0);
    lastRegion = { x, y, w: srcW, h: srcH, width, height, ms: Math.round(performance.now() - askedAt) };
    console.log(`painted ${width}x${height} at zoom ${model.zoom.toFixed(3)} in ${lastRegion.ms} ms`);
    layoutScene();
    drawHud();
  };

  // ---------------------------------------------------------------- the callout layer

  const strongDirection = (text) => {
    // The first strong character decides, which is §3.5's rule written out rather than
    // handed to a CSS keyword that resolves per paragraph and ignores an override (F36).
    for (const ch of text) {
      if (/[֐-ࣿיִ-﷿ﹰ-﻿]/.test(ch)) return 'rtl';
      if (/[A-Za-zÀ-ʯͰ-֏]/.test(ch)) return 'ltr';
    }
    return null;
  };

  const resolveDirection = (callout) => {
    if (callout.dirMode === 'ltr' || callout.dirMode === 'rtl') return callout.dirMode;
    return strongDirection(callout.text) || 'ltr';
  };

  // The sizes a note can take, in image pixels, with 20 as the default. A ladder rather
  // than a multiplier: the same key press has to land on the same size every time.
  const TEXT_SIZES = [10, 12, 14, 16, 18, 20, 24, 28, 32, 40, 48, 64, 80];

  const stepTextSize = (from, direction) => {
    const at = TEXT_SIZES.findIndex((size) => size >= from);
    const index = at < 0 ? TEXT_SIZES.length - 1 : at;
    return TEXT_SIZES[Math.min(TEXT_SIZES.length - 1, Math.max(0, index + direction))];
  };

  // One step up or down. It applies to the note being edited, or the selected one, and it
  // always becomes the default for the next note: the size last used is the size wanted.
  const nudgeTextSize = (direction) => {
    const target = model.editing || model.selected;
    const next = stepTextSize(target ? target.textSize : model.textSize, direction);
    model.textSize = next;
    if (target) target.textSize = next;
    layoutScene();
    drawHud();
    return next;
  };

  const createCallout = (anchor) => {
    const textSize = model.textSize;
    // Proportional to the text, so a note at 48 px is not three words per line. Thirteen
    // times the size is the 260 px the first version used, at the default of 20.
    const width = Math.round(textSize * 13);
    const callout = {
      id: `c${model.nextNumber}`,
      number: model.nextNumber++,
      anchor: { x: Math.round(anchor.x), y: Math.round(anchor.y) },
      // A deterministic first position, offset from the anchor. The candidate set is S1.2.
      box: { x: Math.round(anchor.x) + 28, y: Math.round(anchor.y) + 24, width },
      text: '',
      textSize,
      dirMode: 'auto',
      resolvedDir: 'ltr',
    };
    model.callouts.push(callout);
    return callout;
  };

  const removeCallout = (callout) => {
    model.callouts = model.callouts.filter((c) => c !== callout);
    if (model.selected === callout) model.selected = null;
    if (model.editing === callout) model.editing = null;
    // The number is NOT reused and the others are not renumbered: gaps stay, in the editor
    // and in every output, which is the decision in §3.5.
  };

  const layoutScene = () => {
    // The same offset the canvas got, so the callout layer stays registered with the
    // pixels it is annotating.
    scene.style.transform =
      `translate(${model.offset.x - (model.pan.x * model.zoom) / dpr()}px, ` +
      `${model.offset.y - (model.pan.y * model.zoom) / dpr()}px)` +
      ` scale(${model.zoom / dpr()})`;

    for (const callout of model.callouts) {
      let el = scene.querySelector(`[data-id="${callout.id}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'callout';
        el.dataset.id = callout.id;
        el.innerHTML = '<div class="n"></div><div class="t" contenteditable="true" spellcheck="false"></div>';
        scene.appendChild(el);

        const anchorEl = document.createElement('div');
        anchorEl.className = 'anchor';
        anchorEl.dataset.anchorFor = callout.id;
        scene.appendChild(anchorEl);
      }
      callout.resolvedDir = resolveDirection(callout);
      el.style.left = `${callout.box.x}px`;
      el.style.top = `${callout.box.y}px`;
      el.style.width = `${callout.box.width}px`;
      // In IMAGE pixels, like every other number in this layer, so one transform scales
      // the text with the picture and the wrapping is decided before the zoom exists.
      el.style.fontSize = `${callout.textSize || model.textSize}px`;
      el.style.direction = callout.resolvedDir;
      el.style.textAlign = callout.resolvedDir === 'rtl' ? 'right' : 'left';
      el.classList.toggle('selected', model.selected === callout);
      el.querySelector('.n').textContent = String(callout.number);
      const textEl = el.querySelector('.t');
      if (textEl.textContent !== callout.text && model.editing !== callout) {
        textEl.textContent = callout.text;
      }

      const anchorEl = scene.querySelector(`[data-anchor-for="${callout.id}"]`);
      anchorEl.style.left = `${callout.anchor.x}px`;
      anchorEl.style.top = `${callout.anchor.y}px`;
    }

    for (const el of [...scene.querySelectorAll('.callout')]) {
      if (!model.callouts.some((c) => c.id === el.dataset.id)) el.remove();
    }
    for (const el of [...scene.querySelectorAll('.anchor')]) {
      if (!model.callouts.some((c) => c.id === el.dataset.anchorFor)) el.remove();
    }

    drawArrows();
  };

  const drawArrows = () => {
    arrows.setAttribute('width', String(model.image.width || 1));
    arrows.setAttribute('height', String(model.image.height || 1));
    let markup = '';
    for (const callout of model.callouts) {
      const el = scene.querySelector(`[data-id="${callout.id}"]`);
      const height = el ? el.offsetHeight : 40;
      const box = {
        x: callout.box.x,
        y: callout.box.y,
        w: callout.box.width,
        h: height,
      };
      const centre = { x: box.x + box.w / 2, y: box.y + box.h / 2 };
      const end = edgePoint(box, callout.anchor, centre);
      markup +=
        `<line x1="${callout.anchor.x}" y1="${callout.anchor.y}" x2="${end.x}" y2="${end.y}"` +
        ` stroke="#7aa7ff" stroke-width="2" stroke-linecap="round" />`;
    }
    arrows.innerHTML = markup;
  };

  /// Where the line from the anchor meets the bubble's edge, so the arrow touches the box
  /// instead of ending under it.
  const edgePoint = (box, from, centre) => {
    const dx = centre.x - from.x;
    const dy = centre.y - from.y;
    if (dx === 0 && dy === 0) return centre;
    const halfW = box.w / 2;
    const halfH = box.h / 2;
    const scale = Math.min(
      dx === 0 ? Infinity : halfW / Math.abs(dx),
      dy === 0 ? Infinity : halfH / Math.abs(dy)
    );
    return { x: centre.x - dx * scale, y: centre.y - dy * scale };
  };

  const drawHud = () => {
    const target = model.editing || model.selected;
    const sizeShown = target ? (target.textSize || model.textSize) : model.textSize;
    const zoomText = Math.abs(model.zoom - model.fitZoom) < 0.0005
      ? `fit (${(model.zoom * 100).toFixed(0)}%)`
      : `${(model.zoom * 100).toFixed(0)}%`;
    const where = model.image.file
      ? `${model.image.file}  ${model.image.kind}` +
        (model.image.count > 1 ? `  ${model.image.index + 1} of ${model.image.count}  [ ] to step` : '')
      : model.image.source;
    hud.textContent =
      `${model.image.width}x${model.image.height}  ${where}\n` +
      `zoom ${zoomText}   pan ${Math.round(model.pan.x)},${Math.round(model.pan.y)}   ` +
      `callouts ${model.callouts.length}   text ${sizeShown}px   dpr ${dpr()}\n` +
      `0 fit  1 actual size  +/- zoom  Ctrl +/- text size  arrows pan  click to add  Esc commit  Del remove  Ctrl+O open`;
  };

  // ---------------------------------------------------------------- editing

  const startEditing = (callout) => {
    // Another note still being typed is committed first. Without this its typed text was
    // never read back: layoutScene rewrote its element from the stale model text, and what
    // had been typed was gone (review of 2026-09-13, R1).
    if (model.editing && model.editing !== callout) commitEditing();
    model.editing = callout;
    model.selected = callout;
    layoutScene();
    const el = scene.querySelector(`[data-id="${callout.id}"] .t`);
    el.focus();
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  };

  const commitEditing = () => {
    const callout = model.editing;
    if (!callout) return;
    const el = scene.querySelector(`[data-id="${callout.id}"] .t`);
    // innerText, not textContent: the engine keeps a typed line break as a block, and
    // textContent joins blocks with nothing between them, so a two-line note came back as
    // one line (review T6). innerText turns the blocks into newlines, which pre-wrap shows.
    callout.text = el
      ? el.innerText.replace(/\u00a0/g, ' ').replace(/\r\n?/g, '\n').replace(/\n+$/, '')
      : callout.text;
    model.editing = null;
    if (el) el.blur();
    // An empty bubble is discarded when editing ends, so it never reaches the output.
    if (callout.text.trim() === '') {
      removeCallout(callout);
    }
    layoutScene();
    drawHud();
  };

  // ---------------------------------------------------------------- input

  let drag = null;

  stage.addEventListener('pointerdown', (event) => {
    if (event.button !== 0) return;
    const target = event.target;

    if (target.classList.contains('t')) {
      const callout = model.callouts.find((c) => c.id === target.closest('.callout').dataset.id);
      startEditing(callout);
      return;
    }

    if (target.classList.contains('anchor')) {
      const callout = model.callouts.find((c) => c.id === target.dataset.anchorFor);
      const point = toImage(event);
      drag = { kind: 'anchor', callout, dx: callout.anchor.x - point.x, dy: callout.anchor.y - point.y };
      target.setPointerCapture(event.pointerId);
      event.preventDefault();
      return;
    }

    const box = target.closest('.callout');
    if (box) {
      const callout = model.callouts.find((c) => c.id === box.dataset.id);
      model.selected = callout;
      const point = toImage(event);
      drag = { kind: 'box', callout, dx: callout.box.x - point.x, dy: callout.box.y - point.y };
      stage.setPointerCapture(event.pointerId);
      layoutScene();
      event.preventDefault();
      return;
    }

    // Empty canvas. Committing first means a click somewhere else ends the note being
    // typed, which is what "no Apply step" has to feel like.
    if (model.editing) {
      commitEditing();
      return;
    }
    if (model.selected) {
      model.selected = null;
      layoutScene();
      return;
    }
    const callout = createCallout(toImage(event));
    layoutScene();
    startEditing(callout);
  });

  stage.addEventListener('pointermove', (event) => {
    if (!drag) return;
    const point = toImage(event);
    if (drag.kind === 'anchor') {
      drag.callout.anchor.x = Math.round(point.x + drag.dx);
      drag.callout.anchor.y = Math.round(point.y + drag.dy);
    } else {
      drag.callout.box.x = Math.round(point.x + drag.dx);
      drag.callout.box.y = Math.round(point.y + drag.dy);
    }
    layoutScene();
  });

  // Pasted text arrives as text. Rich HTML in a bubble would be markup the export never
  // agreed to carry.
  stage.addEventListener('paste', (event) => {
    if (!model.editing) return;
    event.preventDefault();
    const text = (event.clipboardData || window.clipboardData).getData('text/plain');
    if (text) document.execCommand('insertText', false, text.replace(/\r\n?/g, '\n'));
  });

  const endDrag = () => { drag = null; };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', (event) => {
    // Copy the composed image, current text edits included, from anywhere (§3.6).
    // By physical key, so the shortcut is the same under a Hebrew layout, where event.key
    // for that key is a Hebrew letter. The rest of the keyboard contract is S1.7.
    if (event.ctrlKey && event.shiftKey && !event.altKey && event.code === 'KeyC') {
      copyComposed().catch((err) => console.error('copy failed', err && err.stack ? err.stack : String(err)));
      event.preventDefault();
      return;
    }
    // Ctrl+O opens a file through Windows' own picker (§3.1); by physical key, like the
    // copy above.
    if (event.ctrlKey && !event.shiftKey && !event.altKey && event.code === 'KeyO') {
      invoke('editor_open_dialog').catch((err) => console.error('open', err));
      event.preventDefault();
      return;
    }
    // Text size, and it works while typing too: Ctrl is not a character, so the note being
    // written can be resized without leaving it.
    if (event.ctrlKey && !event.altKey && (event.key === '+' || event.key === '=')) {
      nudgeTextSize(1);
      event.preventDefault();
      return;
    }
    if (event.ctrlKey && !event.altKey && (event.key === '-' || event.key === '_')) {
      nudgeTextSize(-1);
      event.preventDefault();
      return;
    }
    if (event.key === 'Enter' && model.editing && !event.ctrlKey && !event.altKey) {
      // A newline CHARACTER rather than the engine's block, so the bubble stays one text
      // node and what is typed is exactly what is stored (§3.6: Enter inserts a newline).
      document.execCommand('insertText', false, '\n');
      event.preventDefault();
      return;
    }
    if (event.key === 'Escape') {
      if (model.editing) { commitEditing(); event.preventDefault(); return; }
      if (model.selected) { model.selected = null; layoutScene(); event.preventDefault(); return; }
      // The idle editor: hide, and the focus goes back to where the capture began (§3.1).
      // Pending changes are in memory until S1.8 gives them a store.
      invoke('editor_hide').catch((err) => console.error('hide', err));
      event.preventDefault();
      return;
    }
    if (model.editing) return; // typing owns every other key

    if (event.key === 'Delete' || event.key === 'Backspace') {
      if (model.selected) { removeCallout(model.selected); layoutScene(); drawHud(); event.preventDefault(); }
      return;
    }
    if (event.key === 'Enter' && model.selected) { startEditing(model.selected); event.preventDefault(); return; }

    // Frames of an animation or pages of a file, by index, which is §3.7's contract made
    // visible: the frame on screen is the one asked for, never a default first frame.
    if ((event.key === ']' || event.key === '[') && model.image.count > 1) {
      const next = event.key === ']'
        ? Math.min(model.image.count - 1, model.image.index + 1)
        : Math.max(0, model.image.index - 1);
      if (next !== model.image.index) invoke('editor_frame', { index: next }).catch((err) => console.error('frame', err));
      return;
    }
    const step = 120;
    if (event.key === '0') { setZoom(model.fitZoom); return; }
    if (event.key === '1') { setZoom(1); return; }
    if (event.key === '+' || event.key === '=') { setZoom(model.zoom * 1.5); return; }
    if (event.key === '-') { setZoom(model.zoom / 1.5); return; }
    if (event.key === 'ArrowLeft') { model.pan.x -= step; paintRegion(); return; }
    if (event.key === 'ArrowRight') { model.pan.x += step; paintRegion(); return; }
    if (event.key === 'ArrowUp') { model.pan.y -= step; paintRegion(); return; }
    if (event.key === 'ArrowDown') { model.pan.y += step; paintRegion(); return; }
  });

  const setZoom = (next) => {
    const vp = viewport();
    const before = {
      x: model.pan.x + (vp.w * dpr()) / model.zoom / 2,
      y: model.pan.y + (vp.h * dpr()) / model.zoom / 2,
    };
    model.zoom = Math.min(8, Math.max(model.fitZoom / 4, next));
    // Zooming keeps the centre of the view where it was, which is the only behaviour that
    // does not feel like the image jumped.
    model.pan.x = before.x - (vp.w * dpr()) / model.zoom / 2;
    model.pan.y = before.y - (vp.h * dpr()) / model.zoom / 2;
    // Returned so a caller can wait for the pixels. A check that sleeps instead of waiting
    // measures whatever was on the canvas before, which is how the first version of the
    // detail check passed a fit view while reading a 1:1 one.
    return paintRegion();
  };

  const compositionSize = () => ({
    w: model.image.width + model.margin.left + model.margin.right,
    h: model.image.height + model.margin.top + model.margin.bottom,
  });

  const computeFit = () => {
    const vp = viewport();
    if (!model.image.width) return 1;
    const comp = compositionSize();
    return Math.min((vp.w * dpr()) / comp.w, (vp.h * dpr()) / comp.h, 1);
  };

  const marginString = () =>
    `${model.margin.left},${model.margin.top},${model.margin.right},${model.margin.bottom}`;

  const setMargin = (margin) => {
    for (const edge of ['left', 'top', 'right', 'bottom']) {
      model.margin[edge] = Math.max(0, Math.round(margin[edge] || 0));
    }
    model.fitZoom = computeFit();
    return paintRegion();
  };

  window.addEventListener('resize', async () => {
    await measureRatio();
    model.fitZoom = computeFit();
    paintRegion();
  });

  // ---------------------------------------------------------------- startup and the checks

  const loadImage = async (info) => {
    // The same document again, another frame of it or the same one told twice: the view
    // and the notes stay. A note placed on frame 2 is meant to stay while frame 3 is looked
    // at, and a capture the host announced and the checks loaded is one document.
    const sameDocument = model.image.document_id && info.document_id === model.image.document_id
      && info.width === model.image.width && info.height === model.image.height;
    if (sameDocument) {
      model.image = info;
      await paintRegion();
      return;
    }
    stashCurrent();
    model.image = info;
    const known = documents.get(info.document_id);
    model.margin = known ? { ...known.margin } : { left: 0, top: 0, right: 0, bottom: 0 };
    model.callouts = known ? known.callouts : [];
    model.nextNumber = known ? known.nextNumber : 1;
    if (known) model.textSize = known.textSize;
    model.selected = null;
    model.editing = null;
    model.fitZoom = computeFit();
    model.zoom = model.fitZoom;
    model.pan = { x: 0, y: 0 };
    await paintRegion();
  };

  // ---------------------------------------------------------------- the export layer
  //
  // Part 5: the text is DOM, and the export is that same DOM. The scene subtree is cloned,
  // every style it was laid out with is written inline, the editing decorations are left
  // out, and the clone goes into an SVG foreignObject at the image's own size. Drawn into a
  // canvas and encoded, only that layer crosses back to the host, which composites it over
  // the untouched source. Whether the canvas can be read back after drawing such an image
  // is the unspecified behaviour S0.6 watches, and this is where it is measured.
  const inlineStyles = (source, target) => {
    const computed = getComputedStyle(source);
    let css = '';
    for (let i = 0; i < computed.length; i += 1) {
      const name = computed[i];
      css += `${name}:${computed.getPropertyValue(name)};`;
    }
    target.setAttribute('style', css);
    target.removeAttribute('class');
    target.removeAttribute('contenteditable');
    target.removeAttribute('spellcheck');
    const sourceChildren = source.children;
    const targetChildren = target.children;
    for (let i = 0; i < sourceChildren.length; i += 1) {
      inlineStyles(sourceChildren[i], targetChildren[i]);
    }
  };

  // Colours only, never layout: the export and the live comparison both read the scene
  // with this on, and the check asserts the text box does not move by a pixel.
  const setPlain = (on) => document.body.classList.toggle('plain', !!on);

  const exportLayer = async () => {
    const { w: width, h: height } = compositionSize();
    // The layer is a SNAPSHOT of the composition as it is, note being typed included
    // (§3.6: copy carries the current text edits). Nothing is committed and nothing loses
    // focus; the editing decorations are stripped by the plain state while the styles are
    // read, and put back before this function returns.
    setPlain(true);
    const root = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
    root.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
    root.setAttribute('style', `position:relative;width:${width}px;height:${height}px;margin:0;overflow:visible;`);
    // Image space sits inside canvas space at the margin offset (part 5).
    const inner = document.createElementNS('http://www.w3.org/1999/xhtml', 'div');
    inner.setAttribute('style', `position:absolute;left:${model.margin.left}px;top:${model.margin.top}px;width:${model.image.width}px;height:${model.image.height}px;overflow:visible;`);
    root.appendChild(inner);
    try {
      for (const child of scene.children) {
        if (child.classList && child.classList.contains('anchor')) continue; // editing UI
        const clone = child.cloneNode(true);
        if (child.id === 'arrows') {
          clone.removeAttribute('id');
          clone.setAttribute('style', 'position:absolute;left:0;top:0;overflow:visible;');
        } else {
          inlineStyles(child, clone);
        }
        inner.appendChild(clone);
      }
    } finally {
      setPlain(false);
    }
    const markup = new XMLSerializer().serializeToString(root);
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
      `<foreignObject x="0" y="0" width="${width}" height="${height}">${markup}</foreignObject></svg>`;

    const started = performance.now();
    const image = new Image();
    image.decoding = 'sync';
    const loaded = new Promise((resolve, reject) => {
      image.onload = () => resolve();
      image.onerror = () => reject(new Error('the serialized layer did not load as an image'));
    });
    image.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    await loaded;
    const rasterMs = performance.now() - started;

    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext('2d');
    context.drawImage(image, 0, 0);
    let blob;
    let originClean = true;
    try {
      blob = await new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('toBlob gave nothing'))), 'image/png'));
    } catch (err) {
      originClean = false;
      let more = '';
      try { more = `; toDataURL gave ${canvas.toDataURL('image/png').length} chars`; } catch (e2) { more = `; toDataURL threw ${e2.message}`; }
      throw new Error(`the canvas could not be read back after drawing the layer: ${err.message}${more}`);
    }
    const encodeMs = performance.now() - started - rasterMs;
    const bytes = new Uint8Array(await blob.arrayBuffer());
    return { bytes, svgChars: svg.length, rasterMs, encodeMs, originClean, margin: marginString() };
  };

  // Copy the composed image (§3.6): the layer to the host, which composes it over the
  // untouched source and publishes the clipboard. The success line shows only after the
  // host said it succeeded, and it is a HUD line, not a dialog.
  let flashTimer = null;
  const copyComposed = async () => {
    const layer = await exportLayer();
    const report = await invoke('editor_copy', layer.bytes, { headers: { margin: layer.margin } });
    console.log(`copied ${report.width}x${report.height}: composed ${report.compose_ms} ms, encoded ${report.published.encode_ms} ms, published ${report.published.publish_ms} ms as ${report.published.formats.join(', ')}`);
    drawHud();
    hud.textContent += `\ncopied ${report.width}x${report.height} to the clipboard`;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(drawHud, 1500);
    return report;
  };

  window.reconEditor = {
    model,
    loadImage,
    setZoom,
    paintRegion,
    layoutScene,
    measureRatio,
    ratioOf: () => ratio,
    createCallout,
    removeCallout,
    TEXT_SIZES,
    stepTextSize,
    nudgeTextSize,
    startEditing,
    commitEditing,
    resolveDirection,
    exportLayer,
    copyComposed,
    documents,
    emptyStateText,
    setMargin,
    marginString,
    setPlain,
    canvas,
    context,
  };

  const boot = async () => {
    console.log('page booted, asking the host for an image');
    await measureRatio();
    // A capture can arrive at any moment after this page booted: the host hands the
    // editor the pixels, tells the page, and shows the window (S0.4b).
    await window.__TAURI__.event.listen('capture-ready', async (event) => {
      const arrived = performance.now();
      await loadImage(event.payload);
      drawHud();
      console.log(`capture shown ${Math.round(performance.now() - arrived)} ms after the page heard of it`);
      // S0.7's two editor marks, each sent the moment it happens and stamped by the host
      // when it arrives, so late by one crossing and never early. Painted: the second
      // animation frame after the new pixels went into the canvas. Focused: the new image
      // is loaded and this page has the keyboard, so a click or a key lands on it.
      requestAnimationFrame(() => requestAnimationFrame(() => {
        invoke('editor_mark', { name: 'page painted' }).catch(() => {});
      }));
      const focused = document.hasFocus() || await Promise.race([
        new Promise((resolve) => window.addEventListener('focus', () => resolve(true), { once: true })),
        new Promise((resolve) => setTimeout(() => resolve(false), 3000)),
      ]);
      if (focused) invoke('editor_mark', { name: 'page focused' }).catch(() => {});
    });
    invoke('editor_mark', { name: 'page booted' }).catch(() => {});
    try {
      const info = await invoke('editor_image_info');
      await loadImage(info);
    } catch (err) {
      // Nothing captured yet. In a checks build the probe makes the window useful on its
      // own; in the product the window simply waits, hidden, for the first capture.
      try {
        const info = await invoke('editor_load_probe', { width: 3840, height: 2160 });
        await loadImage(info);
      } catch (noProbe) {
        const hotkey = await invoke('editor_hotkey').catch(() => '');
        hud.textContent = emptyStateText(hotkey);
        return;
      }
    }
    drawHud();
    if (await flag('editor_wants_demo')) {
      // A real capture rather than the probe, two notes with the two directions this
      // product exists for, and one of them re-anchored so the arrow is doing something.
      const shot = await invoke('editor_load_screen');
      await loadImage(shot);
      const a = createCallout({ x: Math.round(shot.width * 0.22), y: Math.round(shot.height * 0.28) });
      a.text = 'This label is the wrong one: it shows the group status, not the item.';
      // The second one after a couple of Ctrl+ steps, so the shot shows the default size
      // and a chosen one side by side.
      model.textSize = 40;
      const b = createCallout({ x: Math.round(shot.width * 0.62), y: Math.round(shot.height * 0.55) });
      b.text = 'הכיתוב הזה צריך להיות מיושר לימין, וגם באנגלית in the same bubble.';
      b.box.x += 40;
      b.box.y += 90;
      model.selected = b;
      layoutScene();
      drawHud();
      await new Promise((r) => setTimeout(r, 900));
      await invoke('editor_shoot_window');

      // Then the export spike (S0.6): the same scene, serialized, rasterized, encoded,
      // composited by the host over the untouched capture, and checked pixel by pixel.
      try {
        const layer = await exportLayer();
        console.log(`export layer: ${layer.svgChars} chars of svg, rasterized in ${layer.rasterMs.toFixed(0)} ms, encoded in ${layer.encodeMs.toFixed(0)} ms, ${layer.bytes.length} bytes, origin-clean ${layer.originClean}`);
        const sent = performance.now();
        const report = await invoke('editor_export_check', layer.bytes, { headers: { name: 'demo', margin: layer.margin, mode: 'source' } });
        console.log(`export composed by the host in ${Math.round(performance.now() - sent)} ms round trip: ${JSON.stringify(report)}`);
        const copy = await copyComposed();
        console.log(`and on the clipboard: ${JSON.stringify(copy)}`);
        const ok = report.source_mismatches === 0 && report.covered > 0;
        console.log(ok ? 'EXPORT SPIKE: every untouched source pixel is exact, and the notes are in the file'
                       : 'EXPORT SPIKE FAILED: see the report');
        await invoke('editor_exit', { code: ok ? 0 : 1 });
      } catch (err) {
        console.error('EXPORT SPIKE FAILED', err && err.stack ? err.stack : String(err));
        await invoke('editor_exit', { code: 1 });
      }
      return;
    }
    if (await flag('editor_wants_checks')) {
      console.log('running the S0.4 checks');
      const { runChecks } = await import('./editor-checks.js');
      await runChecks(window.reconEditor, invoke);
    }
  };

  boot().catch((err) => {
    const text = err && err.stack ? err.stack : String(err);
    hud.textContent = `startup failed: ${text}`;
    console.error('startup failed', text);
    // Never hang: a run that cannot start has to end with a verdict, not a timeout.
    invoke('editor_checks_done', { report: `the editor failed to start: ${text}`, failures: 1 }).catch(() => {});
  });
})();
</script>
