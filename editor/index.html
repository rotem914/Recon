<!doctype html>
<meta charset="utf-8" />
<title>Recon</title>
<style>
  /* S0.4: the editor window, the scene, and one callout.
     No toolbar, no document strip, no persistence, no export. Those are later steps, and
     this file has to stay small enough to be the thing the composition contract is proved
     on rather than the thing it is buried in. */
  :root { color-scheme: dark; --ink: #f0f0f0; --paper: #09090C; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink);
               font: 13px/1.45 ui-sans-serif, "Segoe UI", system-ui, sans-serif;
               overflow: hidden; }

  /* The top bar (Rotem's call, 2026-09-14): Recon draws its own in place of Windows'
     frame. The logo on the left, no title line beside it (Rotem, 2026-09-18; the window's own title still names the file), the controls in the middle, and minimize, maximize and
     close on the right at 48 wide by 40 tall (Rotem, 2026-09-18), at the top of a bar 64 tall (Rotem, 2026-09-18, from
     40, the buttons' height kept), the logo at its left with 16 px above it and to its left. The bar itself is the
     drag region; fullscreen puts it away. Provisional look, Rotem's to restyle. */
  #bar { position: absolute; left: 0; right: 0; top: 0; height: 64px; display: flex;
         align-items: center; user-select: none; }
  /* No pointer of its own, so a press on it reaches the bar and drags the window. */
  #logo { flex: none; width: 103px; height: 32px; margin-left: 16px; pointer-events: none; }
  /* The bar's empty middle: it holds no text, it keeps the window buttons at the right. */
  #title { flex: 1 1 auto; min-width: 0; }
  #winbtns { display: flex; flex: 0 0 auto; height: 100%; }
  #winbtns button { width: 48px; height: 40px; border: none; padding: 0; background: transparent;
                    color: #cfd4da; display: grid; place-items: center; cursor: default; }
  #winbtns button:hover { background: rgba(255,255,255,.09); color: #f2f2f2; }
  #winbtns #win-close:hover { background: #c42b1c; color: #fff; }
  #winbtns svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 1; }
  body.fullscreen #bar { display: none; }
  /* Settings (Rotem, 2026-09-18): a button left of minimize, a chevron pointing down, the window buttons'
     own box and icon size, opening a modal with the two global shortcuts. The modal's look
     is provisional until Rotem states one, built from values the page already has: the icon
     button hover colour as the panel, the app background as a field, 13 px corners on the
     panel and the tabs' 10 px on a field, the top bar title's #cfd4da, the selected ring's
     #7aa7ff while a shortcut is being pressed, fading in by A1. */
  #settings-veil { position: fixed; inset: 0; z-index: 20; display: none; place-items: center;
                   background: rgba(0,0,0,.5); }
  body.settings #settings-veil { display: grid; animation: settings-in 144ms ease-out; /* A1 */ }
  @keyframes settings-in { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { body.settings #settings-veil { animation: none; } }
  #settings { position: relative; width: 420px; max-width: calc(100vw - 32px); padding: 24px; border-radius: 13px;
              background: #21222C; color: #cfd4da; outline: none;
              font: 14px/20px ui-sans-serif, "Segoe UI", system-ui, sans-serif; }
  #settings h2 { margin: 0 0 16px; font: 500 16px/32px "Google Sans", ui-sans-serif, "Segoe UI", system-ui, sans-serif; color: #f2f2f2; }
  #settings-close { position: absolute; right: 16px; top: 24px; width: 32px; height: 32px; padding: 0; border: none;
                    border-radius: 10px; background: transparent; color: #cfd4da; display: grid; place-items: center; cursor: pointer;
                    transition: background-color 144ms ease-out; /* A1 */ }
  #settings-close:hover, .setting .clear:hover { background: var(--paper); }
  #settings-close svg, .setting .clear svg { width: 10px; height: 10px; stroke: currentColor; fill: none; stroke-width: 1; }
  .setting { display: grid; grid-template-columns: 1fr auto 32px; align-items: center; column-gap: 8px; min-height: 32px; margin-top: 8px; }
  .setting .key { min-width: 168px; height: 32px; padding: 0 12px; border: 1px solid transparent; border-radius: 10px;
                  background: var(--paper); color: #f2f2f2; font: inherit; text-align: center; cursor: pointer; }
  .setting .key.none { color: #8b9098; }
  .setting .key.recording { border-color: #7aa7ff; color: #cfd4da; }
  .setting .clear { width: 32px; height: 32px; padding: 0; border: none; border-radius: 10px; background: transparent;
                    color: #cfd4da; display: grid; place-items: center; cursor: pointer; visibility: hidden;
                    transition: background-color 144ms ease-out; /* A1 */ }
  .setting .clear.shown { visibility: visible; }
  .setting .said { grid-column: 1 / -1; margin-top: 4px; color: #ff5252; display: none; }
  .setting .said.shown { display: block; }
  @media (prefers-reduced-motion: reduce) { #settings-close, .setting .clear { transition: none; } }

  #stage { position: absolute; inset: 64px 0 var(--size-band, 0px) 64px; overflow: hidden; cursor: crosshair; }
  body.fullscreen #stage { top: 0; left: 0; }
  /* The timeline (S2.1): every document along the bottom, newest first, the current one
     marked. The stage ends above it while it is shown; fullscreen puts it away.
     S2.8: its height is the page's --strip-h, dragged by the handle on its top edge; the
     cells are placed by arithmetic, only the ones near the screen exist, and the ::after
     block, the size of the whole list, gives the strip its scroll length without an
     element for it. */
  body.strip #stage { bottom: calc(var(--strip-h, 96px) + var(--size-band, 0px)); }
  /* Google Sans, medium, from Google Fonts under the SIL Open Font License (editor/fonts/OFL.txt):
     the Latin subset Google Fonts serves, bundled with the page, since the web view takes fonts from
     the page's own origin only. The picture's size uses it; the notes keep the system font. */
  @font-face { font-family: "Google Sans"; font-style: normal; font-weight: 500;
               src: url("fonts/google-sans-medium-latin.woff2") format("woff2");
               unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
                              U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  /* The picture's size in pixels (Rotem, 2026-09-16): a container across the whole window above
     the timeline, 16 px clear above and below it, on the app's own background, while a picture is
     shown, its text centred in the window in Google Sans at 16 px, medium (Rotem, 2026-09-17, from 14). The stage and the sidebar
     end above it, and fullscreen puts it away. It never rises into the top bar: past that, a taller
     timeline covers it, as it covers the sidebar. Still provisional: the colour and the 16 px line. */
  body.sized:not(.fullscreen) { --size-band: 48px; } /* 16 above, the 16 px line, 16 below */
  #image-size { position: absolute; left: 0; right: 0; bottom: 0; height: 16px; margin: 16px 0; padding: 0 12px;
                display: none; z-index: 4; background: var(--paper); color: #cfd4da; white-space: nowrap; text-align: center;
                font: 500 16px/16px "Google Sans", ui-sans-serif, "Segoe UI", system-ui, sans-serif; }
  body.sized #image-size { display: block; }
  /* Its margin box ends 48 px above where it starts, so it stops at the top bar's 64 px. */
  body.strip #image-size { bottom: min(var(--strip-h, 96px), calc(100vh - 112px)); }
  body.fullscreen #image-size { display: none; }
  /* The timeline's tabs (Rotem, 2026-09-16): at the left of the picture's size band a plus, an
     icon button as the sidebar's (32 by 32, a 20 by 20 icon with round ends, the hover fill by
     A1); after its first press the tabs sit beside it: Main, the whole library, pinned first and
     never deleted, then the tabs the plus made, each a feed of its own captures, deleted by the
     × on it and dragged into another place after Main. The bar stops short of the size text.
     Provisional until Rotem states a look: 12 px text, the hover colour on the selected tab. */
  #tabbar { position: absolute; left: 8px; bottom: 8px; height: 32px; display: none; z-index: 4;
            max-width: calc(50% - 80px); overflow: hidden; align-items: center; gap: 8px; }
  body.sized #tabbar { display: flex; }
  body.strip #tabbar { bottom: calc(min(var(--strip-h, 96px), calc(100vh - 112px)) + 8px); }
  body.fullscreen #tabbar { display: none; }
  #tab-add { flex: none; width: 32px; height: 32px; padding: 0; border: none; border-radius: 0;
             background: transparent; color: #f2f2f2; cursor: pointer; display: grid; place-items: center;
             transition: background-color 144ms ease-out; /* A1 */ }
  #tab-add:hover { background: #21222C; }
  #tab-add svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; }
  .tab { position: relative; flex: none; height: 32px; padding: 0 10px; border-radius: 10px; box-sizing: border-box;
         background: transparent; color: #cfd4da; font: 14px/32px ui-sans-serif, "Segoe UI", system-ui, sans-serif;
         cursor: pointer; white-space: nowrap; user-select: none; display: flex; align-items: center; gap: 6px;
         transition: background-color 144ms ease-out; /* A1 */ }
  .tab:hover { background: #21222C; }
  .tab.selected { background: #21222C; color: #f2f2f2; }
  .tab.dragging { z-index: 1; transition: none; }
  .tab .name[contenteditable] { outline: none; min-width: 1ch; }
  /* The tab's menu (Rotem, 2026-09-18, in place of the × on the tab): a right press on a tab
     after Main opens it at the pointer, above the bar, with Delete in it. Outside the bar,
     which clips. Provisional look until Rotem states one: the tabs' fill, text and corners. */
  #tab-menu { position: fixed; display: none; z-index: 6; padding: 4px; border-radius: 10px; background: #21222C; }
  #tab-menu.open { display: block; }
  #tab-menu button { display: block; width: 100%; height: 32px; padding: 0 10px; border: none; border-radius: 6px; text-align: left;
                     background: transparent; color: #f2f2f2; font: 14px/32px ui-sans-serif, "Segoe UI", system-ui, sans-serif;
                     cursor: pointer; transition: background-color 144ms ease-out; /* A1 */ }
  #tab-menu button:hover, #tab-menu button:focus-visible { background: #c0392b; color: #fff; outline: none; }
  @media (prefers-reduced-motion: reduce) { #tab-add, .tab, #tab-menu button { transition: none; } }
  /* Above the sidebar, so a strip dragged taller covers it (Rotem, 2026-09-15); the handle above both. */
  #strip { position: absolute; left: 0; right: 0; bottom: 0; height: var(--strip-h, 96px); display: none;
           overflow-x: auto; overflow-y: hidden; z-index: 4;
           background: #14171b; border-top: 1px solid #2a3037; }
  body.strip #strip { display: block; }
  #strip.grid { overflow-x: hidden; overflow-y: auto; }
  /* The rows' scroller, once the strip wraps and scrolls vertically: Rotem's own on
     2026-09-15, a 4 px thumb of #21222C, fully rounded, on no track, 4 px clear of the
     screen's bottom and of the strip's top (project-os/Design.md). */
  #strip.grid::-webkit-scrollbar { width: 4px; }
  #strip.grid::-webkit-scrollbar-track { margin: 4px 0; }
  #strip.grid::-webkit-scrollbar-thumb { background: #21222C; border-radius: 2px; }
  /* The one row's sideways scroller, the same spec: a 4 px thumb, 4 px clear of the screen's
     bottom and 4 px clear above, the gaps drawn as a transparent border so the thumb is a
     pill (Rotem, 2026-09-15). */
  #strip:not(.grid)::-webkit-scrollbar { height: 12px; }
  #strip:not(.grid)::-webkit-scrollbar-thumb { background: #21222C; background-clip: padding-box;
                                               border-block: 4px solid transparent; border-radius: 2px / 6px; }
  #strip::after { content: ''; display: block; width: var(--extent-x, 0px); height: var(--extent-y, 0px); }
  #strip-handle { position: absolute; left: 0; right: 0; bottom: calc(var(--strip-h, 96px) - 3px); height: 6px;
                  cursor: ns-resize; display: none; z-index: 5; }
  body.strip #strip-handle { display: block; }
  body.fullscreen #strip-handle { display: none; }
  .thumb, .chip-cell { position: absolute; box-sizing: border-box; }
  .thumb { border-radius: 8px; overflow: hidden; /* 8 px corners (Rotem, 2026-09-17, from 13 the same evening, 4 before) */
           border: 2px solid transparent; background: #1b1f24; cursor: pointer;
           display: grid; place-items: center; color: #6b7480; font-size: 11px; }
  .thumb img { max-width: 100%; max-height: 100%; display: block; border-radius: 8px; /* the picture's own corners, 8 px (Rotem, 2026-09-17, from 13) */ }
  .thumb.current { border-color: #7aa7ff; }
  .thumb .x { position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border-radius: 9px;
              border: none; background: rgba(10,12,14,.75); color: #f2f2f2; font: 13px/18px system-ui, sans-serif;
              cursor: pointer; display: none; padding: 0; }
  .thumb:hover .x { display: block; }
  .thumb .x:hover { background: #c0392b; }
  /* The done mark (Rotem, 2026-09-16): in a tab after Main, a round 24 by 24 button at the
     thumbnail's top left, a 1 px white border, a 20 by 20 tick inside it,
     shown on hover; once pressed it stays shown and the tick fades in by A1, to say this
     picture is dealt with. Nothing else follows from it. */
  .thumb .done { position: absolute; left: 2px; top: 2px; width: 24px; height: 24px; border-radius: 12px; box-sizing: border-box;
                 border: 1px solid #fff; padding: 0; background: rgba(10,12,14,.75); color: #f2f2f2; cursor: pointer;
                 display: none; place-items: center; }
  .thumb .done svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; } /* a 2 px tick in a 1 px border (Rotem, 2026-09-16) */
  .thumb .done .tick { opacity: 0; }
  .thumb:hover .done, .thumb.checked .done { display: grid; }
  .thumb.checked .done { background: #2e7d32; }
  .thumb.checked .done .tick { opacity: 1; transition: opacity 144ms ease-out; /* A1, on the marking only */ }
  @media (prefers-reduced-motion: reduce) { .thumb.checked .done .tick { transition: none; } }
  /* The trash (S2.7): a chip at the end of the timeline opens it in the same strip, each
     trashed document with a way back; another chip returns. Provisional, Rotem's to restyle. */
  .chip-cell { display: grid; place-items: center; }
  .chip { padding: 6px 10px; border-radius: 6px; border: 1px solid #3a4149;
          background: #1b1f24; color: #cfd4da; font: 12px system-ui, sans-serif; cursor: pointer; }
  .chip:hover { border-color: #7aa7ff; }
  body.trash #strip { background: #1a1416; }
  .thumb .restore { position: absolute; left: 2px; bottom: 2px; padding: 2px 6px; border-radius: 4px; border: none;
                    background: rgba(10,12,14,.8); color: #f2f2f2; font: 11px system-ui, sans-serif; cursor: pointer; }
  .thumb .restore:hover { background: #2e7d32; }
  #canvas { position: absolute; left: 0; top: 0; display: block; image-rendering: pixelated; }
  /* A small copy of the whole picture under the canvas, shown only while a pan drag lasts,
     so an edge the drag uncovers is never empty (Rotem, 2026-09-15). */
  #backdrop { position: absolute; left: 0; top: 0; display: none; }
  body.panning #backdrop { display: block; }
  /* The annotation margin, drawn under the picture in the same colour the host puts in the
     output, so what is on screen is what a copy contains (§3.5, §3.6). */
  #mat { position: absolute; left: 0; top: 0; display: none; background: #e9eaec; }

  /* Everything below is laid out in IMAGE pixels and scaled by one transform on this
     container. Part 5: layout is computed before the transform exists, so zoom cannot
     re-wrap a single line of text. */
  #scene { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  #arrows { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

  /* The text size is set per note, from the model, in image pixels. Everything else
     about the bubble is a proportion of it, so a bigger note is a bigger note rather than
     a large font crammed into a small box. */
  /* The bubble (Rotem, 2026-09-17): #2D41D7, 32 px of padding, 15 px corners, the shadow of
     his Figma (0, 8, blur 16, spread 6, black at 25%), no number shown, the text box 36 px
     tall and unmarked. The padding, the corners and the text box's height are ems that are
     exactly his pixels at the default size of 20, so a bigger note stays a bigger note. */
  .callout { position: absolute; display: flex; gap: .3em; align-items: flex-start;
             padding: 1.6em; border-radius: .75em; background: #2D41D7; color: #f2f2f2;
             border: 1px solid transparent; box-shadow: 0 8px 16px 6px rgba(0,0,0,.25);
             line-height: 1.35; }
  .callout.selected { border-color: #7aa7ff; }
  .callout.text { background: transparent; border-color: transparent; box-shadow: none; padding: 0;
                  color: #ff5252; font-weight: 700;
                  text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 4px #fff; }
  .callout.text .n { display: none; }
  .callout.text .t { min-height: 0; } /* the bubble's 36 px floor is the callout's, not the text note's */
  .callout.text.selected { border-color: #7aa7ff; }
  /* The number is kept in the document and not shown in the bubble (Rotem, 2026-09-17). */
  .callout .n { display: none; }
  /* No editing decoration on the text box (Rotem, 2026-09-17): the caret alone shows the
     typing, so nothing can change layout, and the export agrees with the screen (part 5's
     third remedy). Its height is 36 px at the default size, and it grows with the lines. */
  .callout .t { flex: 1 1 auto; min-width: 1ch; min-height: 1.8em; outline: none; white-space: pre-wrap;
                word-break: break-word; }
  .anchor { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px;
            border-radius: 50%; background: #7aa7ff; border: 2px solid #0d1014;
            cursor: grab; }
  /* Plain: no editing decoration at all, for the moment the scene is serialized into the
     output and for the moment the screen is compared against it (S0.6 check 3). Colours
     only, never a layout property, so switching it cannot move a pixel of text. */
  body.plain .callout.selected { border-color: #3a4149; }
  body.plain .callout .t:focus { background: transparent; outline: none; }
  body.plain .callout .t { caret-color: transparent; }
  /* Viewing mode (§3.3): the notes are shown but nothing on the scene takes the pointer,
     so a click or a drag reaches the stage and pans, and can never land on a note or
     create one. */
  body.viewing #scene { pointer-events: none; }

  #hud { position: absolute; left: 12px; bottom: 10px; padding: 6px 10px; border-radius: 6px;
         background: rgba(10,12,14,.82); color: #cfd4da; font-size: 12px;
         font-family: ui-monospace, Consolas, monospace; pointer-events: none;
         white-space: pre; }
  /* With no timeline the HUD, which carries the notices, sits above the picture's size, not under it (2026-09-16). */
  body:not(.strip) #hud { bottom: calc(10px + var(--size-band, 0px)); }
  #probe { position: absolute; inset: 0; display: none; }
  /* The controls (§3.3, S1.5, S2.3, Stage 3): the tools, Copy and Save As, as a
     sidebar of icon buttons down the left edge (Rotem, 2026-09-15). Each button is a 48 by
     48 square with no fill of its own and a 32 by 32 icon in it (Rotem, 2026-09-16, from 32
     and 20; the sidebar 64 wide with it, from 48), 8 px between buttons, and
     a hover fills the square with #21222C, fading in by the design system's A1
     (project-os/Design.md). Outside the stage so a click on them reaches no canvas handler;
     the stage starts at the sidebar's right edge, and fullscreen puts it away with the bar.
     One container holds all ten buttons, centred in the sidebar's height and across it, and each button's
     name opens as a tooltip on its right under the pointer (Rotem, 2026-09-15). Above the
     stage, so a tooltip is not painted under the picture. */
  /* A height, not a bottom: the sidebar sits inside the top bar, so a bottom would be measured
     from the bar's own 64 px. Safe centring falls back to the top when the buttons do not fit. */
  #controls { position: absolute; left: 0; top: 64px; height: calc(100vh - 64px - var(--size-band, 0px)); width: 64px; padding: 8px;
              display: flex; flex-direction: column; align-items: center; justify-content: safe center;
              gap: 8px; z-index: 3; }
  #buttons { flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  body.strip #controls { height: calc(100vh - 64px - var(--strip-h, 96px) - var(--size-band, 0px)); }
  body.fullscreen #controls { display: none; }
  #controls button { position: relative; flex: none; width: 48px; height: 48px; padding: 0; border: none; border-radius: 13px; /* Rotem, 2026-09-17 */
                     background: transparent; color: #f2f2f2; cursor: pointer;
                     display: grid; place-items: center;
                     transition: background-color 144ms ease-out; /* A1 */ }
  #controls button:hover { background: #21222C; }
  /* The tooltip: the button's name, 8 px to its right, centred on it. Its look is provisional
     until Rotem states one: the hover colour, 12 px text, fading in by A1. */
  #controls button::after { content: attr(aria-label); position: absolute; left: calc(100% + 8px); top: 50%;
                            transform: translateY(-50%); padding: 4px 8px; border-radius: 4px;
                            background: #21222C; color: #f2f2f2; white-space: nowrap; pointer-events: none;
                            font: 12px/16px ui-sans-serif, "Segoe UI", system-ui, sans-serif;
                            opacity: 0; visibility: hidden; transition: opacity 144ms ease-out, visibility 0s linear 144ms; }
  #controls button:hover::after { opacity: 1; visibility: visible; transition: opacity 144ms ease-out; /* A1 */ }
  @media (prefers-reduced-motion: reduce) { #controls button, #controls button::after { transition: none; } }
  #controls svg { width: 32px; height: 32px; stroke: #C3C6CA; fill: none; stroke-width: 1.25; /* 2 px on screen at 32 px over the 20-unit drawing (Rotem, 2026-09-16) */
                  stroke-linecap: round; stroke-linejoin: round; }
  /* The tools (Stage 3): which one a click on the picture uses. */
  #tools { flex: none; display: flex; flex-direction: column; gap: 8px; }
  #tools button.active { background: #26303c; }
  /* The stage's crosshair is for a tool in hand in annotation. With no tool, the state every
     picture opens in since Rotem's word on 2026-09-14, in viewing, and while Space is held,
     the pointer is the ordinary one. */
  body:not(.armed) #stage, body.viewing #stage, body.space #stage { cursor: auto; }
  /* Space held takes the pointer off the notes, as viewing does, so a drag pans whatever it
     starts on (Rotem, 2026-09-14). */
  body.space #scene { pointer-events: none; }
  #arrows [data-shape] { pointer-events: visiblePainted; cursor: move; }
  #handles { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .blur { position: absolute; cursor: move; border: 1px dashed rgba(255,82,82,.6); box-sizing: border-box; }
  /* The ruler (Rotem, 2026-09-16): a box in the scene like the blur, its size in image pixels
     written beside the corner the drag ended at, so while the drag lasts the size sits beside
     the pointer, and it stays there once released, on screen and in every copy. Its look is
     provisional until Rotem states one: a 2 px line in the callout line's blue, the label
     dark with white 14 px text, both in image pixels like a note. */
  .ruler { position: absolute; cursor: move; border: 2px solid #7aa7ff; box-sizing: border-box; }
  .ruler .size { position: absolute; padding: 2px 6px; border-radius: 4px; background: #1b1f24; color: #f2f2f2;
                 border: 1px solid #3a4149; font: 500 14px/18px system-ui, sans-serif; white-space: nowrap; pointer-events: none; }
  /* The ruler's x (Rotem, 2026-09-16): a round 16 px button with a 12 px X, shown on hover over the
     ruler, centred on its top right corner. Counter-scaled by the scene's own scale (--k), so it is
     16 screen pixels at every zoom; never in a copy, the export takes it out. Its fill is
     provisional: the thumbnail x's. Hidden while the ruler is being drawn. */

              background: rgba(10,12,14,.75); color: #f2f2f2; cursor: pointer; display: none; place-items: center;
              transform-origin: 0 0; transform: scale(calc(1 / var(--k, 1))) translate(-50%, -50%); }
  .ruler .x svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; }
  .ruler:hover .x { display: grid; }

  .ruler .x:hover { background: #c0392b; }

     tool is in hand, and while a ruler is dragged out its size sits above the circle, as in a
     capture, and returns beside the ruler's corner at the release. Every number is the
     capture's own (project-os/Design.md, Magnifier): a 112 px circle in a panel of the app
     background on 8 px corners, 4 px around it, 8 px to a picture pixel, a 2 px ring in the
     text's white, the size 14 px in Segoe UI with 8 px at its sides and 4 above and below.
     Screen pixels at every zoom, outside the scene, so never in a copy. */

         min-width: 120px; padding: 4px 0; border-radius: 8px; background: #0D0E12; pointer-events: none; }
  #mag.on { display: flex; }
  #mag.sized { padding-top: 0; }
  #mag .size { display: none; padding: 4px 8px; color: #f2f2f2; font: 400 14px/19px "Segoe UI", system-ui, sans-serif; white-space: nowrap; }
  #mag.sized .size { display: block; }
  #mag canvas { display: block; width: 112px; height: 112px; }
  .ruler.drawing .size { display: none; }
  /* The crop (Rotem, 2026-09-17): with the crop tool in hand a frame sits on the picture's edges
     with a handle at each corner and at the middle of each side; a handle dragged inward cuts the
     picture to the frame when it is released, on screen and in every copy, and the source is never
     touched. The frame's line and the handles are screen pixels at every zoom, counter-scaled by
     the scene's own scale (--k) like the ruler's x; while a drag lasts the frame darkens what it
     will cut away. Editing UI, never in a copy: the export leaves the frame out. Its look is
     provisional until Rotem states one: a 1 px white line, 10 px white squares with a 1 px dark

          outline: calc(1px / var(--k, 1)) solid #fff; outline-offset: calc(-1px / var(--k, 1)); }

  #crop.dragging { box-shadow: 0 0 0 100000px rgba(0,0,0,.5); }
  #crop .h { position: absolute; width: 10px; height: 10px; box-sizing: border-box; background: #fff; border: 1px solid #0d1014;
             pointer-events: auto; transform-origin: 0 0; transform: scale(calc(1 / var(--k, 1))) translate(-50%, -50%); }
  #crop .h[data-edge="nw"] { left: 0; top: 0; cursor: nwse-resize; }
  #crop .h[data-edge="n"] { left: 50%; top: 0; cursor: ns-resize; }
  #crop .h[data-edge="ne"] { left: 100%; top: 0; cursor: nesw-resize; }
  #crop .h[data-edge="w"] { left: 0; top: 50%; cursor: ew-resize; }
  #crop .h[data-edge="e"] { left: 100%; top: 50%; cursor: ew-resize; }
  #crop .h[data-edge="sw"] { left: 0; top: 100%; cursor: nesw-resize; }
  #crop .h[data-edge="s"] { left: 50%; top: 100%; cursor: ns-resize; }
  #crop .h[data-edge="se"] { left: 100%; top: 100%; cursor: nwse-resize; }
  body.checking #stage { cursor: progress; }
  #report { position: absolute; inset: 0; display: none; padding: 18px 22px; overflow: auto;
            background: #0c0e10; font-family: ui-monospace, Consolas, monospace;
            font-size: 12px; white-space: pre-wrap; }

<script>
(() => {
  const invoke = window.__TAURI__.core.invoke;
  // A command that only the stage0-checks build registers answers false in the product,
  // where asking for it is an error rather than a no.
  const flag = async (name) => { try { return await invoke(name); } catch { return false; } };

  // Everything this page says goes to the terminal as well. A web view that throws inside a
  // hidden window is otherwise completely silent, which cost one whole run.
  const toHost = (level, line) => { invoke('editor_log', { level, line }).catch(() => {}); };
  for (const level of ['log', 'warn', 'error']) {
    const original = console[level].bind(console);
    console[level] = (...args) => {
      original(...args);
      toHost(level, args.map((a) => (a && a.stack) ? a.stack : String(a)).join(' '));
    };
  }
  window.addEventListener('error', (e) => toHost('error', `${e.message} at ${e.filename}:${e.lineno}`));
  window.addEventListener('unhandledrejection', (e) => toHost('error', `unhandled rejection: ${e.reason && e.reason.stack ? e.reason.stack : e.reason}`));
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const mat = document.getElementById('mat');
  const scene = document.getElementById('scene');
  const arrows = document.getElementById('arrows');
  const handles = document.getElementById('handles');
  const cropFrame = document.getElementById('crop');
  const hud = document.getElementById('hud');
  const imageSize = document.getElementById('image-size');
  const controls = document.getElementById('controls');
  const strip = document.getElementById('strip');
  const context = canvas.getContext('2d', { alpha: false });
  // A small copy of the whole picture, taken whenever the whole picture is painted and shown
  // under the canvas while a pan drag lasts, so an edge the drag uncovers shows the picture at
  // once and sharpens when its region lands (Rotem, 2026-09-15). Two megapixels at most.
  const backdrop = document.getElementById('backdrop');
  const backdropContext = backdrop.getContext('2d');
  let backdropFor = null;
  const imageKey = () => `${model.image.document_id}:${model.image.index || 0}`;
  const captureBackdrop = (width, height) => {
    const scale = Math.min(1, Math.sqrt(2000000 / (width * height)));
    backdrop.width = Math.max(1, Math.round(width * scale));
    backdrop.height = Math.max(1, Math.round(height * scale));
    backdropContext.drawImage(canvas, 0, 0, backdrop.width, backdrop.height);
    backdropFor = imageKey();
  };

  // ---------------------------------------------------------------- the scene
  //
  // Coordinates. There are exactly two spaces in this file and they are never mixed:
  //
  //   image  pixels of the source image, origin at its top-left. Everything stored lives
  //          here: anchors, bubbles, text boxes.
  //   view   what is on screen. Reached from image space by ONE transform on #scene, and
  //          from a pointer event by the inverse. Nothing is stored in this space.
  //
  // zoom is DEVICE pixels per image pixel, so zoom === 1 is actual size on this display
  // whatever its scaling. The canvas backing store is in device pixels and its CSS size is
  // that divided by the device pixel ratio, which is what makes a 1:1 view genuinely 1:1.

  const model = {
    image: { width: 0, height: 0, source: '' },
    zoom: 1,
    fitZoom: 1,
    // Top-left of the visible region, in image pixels.
    pan: { x: 0, y: 0 },
    // Where the canvas sits inside the viewport, in CSS pixels. Non-zero whenever the
    // image is smaller than the window, which at fit-to-window is most of the time: found
    // by looking at the thing, where a 5120x1440 capture sat in the top-left corner of a
    // 1280x800 window with two thirds of the window empty below it.
    offset: { x: 0, y: 0 },
    // The size the NEXT note gets, in image pixels. Each note then carries its own, so
    // changing the size later never rewrites the notes already written.
    textSize: 20,
    // The annotation margin, image pixels per edge (§3.5). Canvas space is image space
    // plus this, and the output is the source plus this (§3.6). Set explicitly for now;
    // growing it automatically when a bubble cannot fit is the placement work of S1.2.
    margin: { left: 0, top: 0, right: 0, bottom: 0 },
    // The least margin, under the automatic one. Zero in the product; the checks raise it
    // to build a document with a margin on purpose.
    marginFloor: { left: 0, top: 0, right: 0, bottom: 0 },
    // Undo and redo over the objects (§3.6): snapshots of the notes, one per completed
    // operation. Typing has the engine's own undo while a note is being edited; the
    // committed text change joins this history as one grouped step.
    history: { steps: [], index: -1, seq: [] },
    // What the store holds, for the HUD (§3.8): refreshed with the timeline.
    storage: { documents: 0, bytes: 0 },
    // The save state of this document's notes (§3.8): 'saved', 'saving', or 'failed' with
    // the reason, which stays on screen until a save succeeds. Never "saved" unless the
    // host said so.
    save: { state: 'saved', error: '', dirty: false },
    callouts: [],
    nextNumber: 1,
    selected: null,
    editing: null,
    // The callout between its two clicks (Rotem, 2026-09-16): anchored by the first, following
    // the pointer until the second locks it and starts the typing.
    placing: null,
    // Stage 3: the tool a click on the picture uses, and the shapes it makes. Shapes live
    // beside the callouts, in the same undo, the same save and the same export, and never
    // in the callouts' numbering. No tool is in hand until one is chosen, and every picture
    // shown starts with none (Rotem, 2026-09-14).
    tool: null,
    shapes: [],
    nextShape: 1,
    selectedShape: null,
    // The crop (S3.6; Rotem, 2026-09-17): the part of the source that is the picture now, in
    // image pixels, or null for the whole source. A cut, never a change to what the notes are
    // placed on: every stored coordinate stays in image space, the source is never touched,
    // and the host cuts a copy at every output. Saved with the notes, one step of undo.
    crop: null,
    // The rect a crop handle is dragging, while the drag lasts; the crop takes it at the release.
    cropping: null,
    fullscreen: false,
    // 'view' or 'annotate' (§3.3). A capture opens in annotation; a file opens in viewing,
    // where no click creates anything, and picking a tool switches (Rotem, 2026-09-18).
    mode: 'view',
  };

  // The ratio of physical pixels to CSS pixels for THIS window, measured rather than
  // believed. This web view reports devicePixelRatio 1 on a 225% display, so trusting it
  // would make "actual size" wrong by a factor of the display scale, quietly.
  let ratio = 1;
  const dpr = () => ratio;

  // The picture as it is now (S3.6): the crop when one is set, the whole source otherwise.
  // Every place the picture's edges matter reads this, so the crop is one rect and the
  // notes, the regions and the pan stay in image space.
  const pictureRect = () => (model.crop ? { ...model.crop } : { x: 0, y: 0, w: model.image.width, h: model.image.height });
  const cropString = () => (model.crop ? `${model.crop.x},${model.crop.y},${model.crop.w},${model.crop.h}` : '');
  // A saved crop is kept only when it lies inside the picture it was saved for.
  const cropFits = (c, width, height) => !!c && c.w >= 1 && c.h >= 1 && c.x >= 0 && c.y >= 0 && c.x + c.w <= width && c.y + c.h <= height;

  const measureRatio = async () => {
    const metrics = await invoke('editor_window_metrics');
    const css = viewport();
    // Against the page's whole width, not the stage's: the sidebar takes 64 px of it.
    const pageW = document.documentElement.clientWidth;
    const measured = pageW > 0 ? metrics.physical_width / pageW : 1;
    ratio = Math.max(0.5, Math.min(4, measured));
    console.log(
      `window ${metrics.physical_width}x${metrics.physical_height} physical, ` +
      `${pageW}x${css.h} css (the stage ${css.w} wide), ratio ${ratio.toFixed(3)}, ` +
      `scale factor ${metrics.scale_factor}, window dpi ${metrics.window_dpi} (${Math.round(metrics.window_dpi/96*100)}%), devicePixelRatio ${window.devicePixelRatio}`
    );
    return ratio;
  };
  const viewport = () => ({ w: stage.clientWidth, h: stage.clientHeight });

  // The pan is the image coordinate at the viewport's top-left. Per axis: when the
  // composition fits the window it is centred and the pan stays 0; when it does not, the
  // pan runs over the whole composition, margin included, so a note placed in the margin
  // can be reached at any zoom (F56).
  const clampPan = () => {
    const vp = viewport();
    const visibleW = (vp.w * dpr()) / model.zoom;
    const visibleH = (vp.h * dpr()) / model.zoom;
    const comp = compositionSize();
    const pic = pictureRect();
    // Centred, the pan is the picture's own origin, so the picture starts at the offset.
    const minX = comp.w <= visibleW ? pic.x : pic.x - model.margin.left;
    const maxX = comp.w <= visibleW ? pic.x : pic.x + pic.w + model.margin.right - visibleW;
    const minY = comp.h <= visibleH ? pic.y : pic.y - model.margin.top;
    const maxY = comp.h <= visibleH ? pic.y : pic.y + pic.h + model.margin.bottom - visibleH;
    model.pan.x = Math.min(Math.max(minX, model.pan.x), maxX);
    model.pan.y = Math.min(Math.max(minY, model.pan.y), maxY);
  };

  const toImage = (event) => {
    const box = stage.getBoundingClientRect();
    const cssX = event.clientX - box.left - model.offset.x;
    const cssY = event.clientY - box.top - model.offset.y;
    return {
      x: model.pan.x + (cssX * dpr()) / model.zoom,
      y: model.pan.y + (cssY * dpr()) / model.zoom,
    };
  };

  // ---------------------------------------------------------------- the pixels
  //
  // The host is asked for the region that is visible, at the size it will be shown. At
  // zoom 1 that is a 1:1 copy and the host does not resample at all; at fit it is a
  // downscale of only what is on screen. An enlarged preview of a smaller view is never
  // what a closer view is made of, which is the policy in part 5.

  let regionRequest = 0;
  let lastRegion = null;

  // The notes of every document this page has held, by the host's document number, so a
  // new capture never overwrites the previous one's work (§3.3): the current document's
  // notes are stashed here when another arrives, and S1.9 brings them back.
  const documents = new Map();

  const stashCurrent = (save = true) => {
    if (!model.image.document_id) return;
    if (model.editing) commitEditing();
    if (model.placing) cancelPlacing(); // an unplaced bubble is not a note; it never reaches the stash or the disk
    if (save) saveNow().catch(() => {});
    documents.set(model.image.document_id, {
      callouts: model.callouts,
      nextNumber: model.nextNumber,
      shapes: model.shapes,
      nextShape: model.nextShape,
      crop: model.crop,
      margin: { ...model.margin },
      marginFloor: { ...model.marginFloor },
      textSize: model.textSize,
      history: model.history,
      // The save state travels with the notes, the object itself, so a save refused after
      // the switch still marks it: coming back never reads "saved" over notes the disk does
      // not hold (review 4, T1).
      save: model.save,
    });
  };

  const emptyStateText = (hotkey) => (hotkey ? `Press ${hotkey} to capture` : 'no capture yet');

  // The canvas is opaque, and a see-through pixel written into an opaque canvas is not
  // cleared on screen: the paint before it stays visible through it, so a transparent
  // picture zoomed in showed every earlier size at once (Rotem, 2026-09-18). Every pixel
  // that is not solid is laid over the page's own colour before it is painted.
  const flattenOntoPaper = (pixels, count) => {
    const paper = (getComputedStyle(document.body).backgroundColor.match(/\d+/g) || [0, 0, 0]).map(Number);
    const words = new Uint32Array(pixels.buffer, 0, count);
    for (let i = 0; i < count; i += 1) {
      const a = words[i] >>> 24;
      if (a === 255) continue;
      const at = i * 4;
      pixels[at] = Math.round((pixels[at] * a + paper[0] * (255 - a)) / 255);
      pixels[at + 1] = Math.round((pixels[at + 1] * a + paper[1] * (255 - a)) / 255);
      pixels[at + 2] = Math.round((pixels[at + 2] * a + paper[2] * (255 - a)) / 255);
      pixels[at + 3] = 255;
    }
  };

  const paintRegion = async () => {
    const vp = viewport();
    if (!model.image.width || vp.w < 2 || vp.h < 2) return;
    clampPan();

    const visibleW = (vp.w * dpr()) / model.zoom;
    const visibleH = (vp.h * dpr()) / model.zoom;
    // The picture's part of the view: a pan inside the margin leaves the picture starting
    // right of, or below, the viewport's edge, and the region stops at the picture's edge,
    // which is the crop's when one is set.
    const pic = pictureRect();
    const x = Math.max(pic.x, Math.round(model.pan.x));
    const y = Math.max(pic.y, Math.round(model.pan.y));
    const srcW = Math.round(Math.min(pic.x + pic.w, model.pan.x + visibleW) - x);
    const srcH = Math.round(Math.min(pic.y + pic.h, model.pan.y + visibleH) - y);
    const shown = srcW >= 1 && srcH >= 1;
    canvas.style.display = shown ? '' : 'none';
    const outW = Math.max(1, Math.round(srcW * model.zoom));
    const outH = Math.max(1, Math.round(srcH * model.zoom));

    const ticket = ++regionRequest;
    if (!shown) {
      // Only margin in view: nothing to fetch, but the mat and the notes still move.
      placeComposition(vp);
      layoutScene();
      drawHud();
      return;
    }
    const url = `http://region.localhost/?x=${x}&y=${y}&w=${srcW}&h=${srcH}&ow=${outW}&oh=${outH}`;
    const askedAt = performance.now();
    const response = await fetch(url, { cache: 'no-store' });
    // 409 is the host saying a newer request replaced this one, which is the design, not
    // an error: the newer one paints. Anything else is a real refusal.
    if (response.status === 409) return;
    if (!response.ok) throw new Error(`the region was refused: ${response.status}`);
    const whole = new Uint8Array(await response.arrayBuffer());
    const header = new DataView(whole.buffer, 0, 8);
    const width = header.getUint32(0, true);
    const height = header.getUint32(4, true);
    const bytes = whole.subarray(8);
    // A late answer for a view the user has already left is dropped rather than painted,
    // which is the stale-response half of part 5's display policy.
    if (ticket !== regionRequest) return;
    if (bytes.length !== width * height * 4) {
      throw new Error(`the region is ${bytes.length} bytes for ${width}x${height}`);
    }

    canvas.width = width;
    canvas.height = height;
    canvas.style.width = `${width / dpr()}px`;
    canvas.style.height = `${height / dpr()}px`;
    placeComposition(vp);
    const pixels = new Uint8ClampedArray(bytes);
    // A capture is opaque; only a file can carry transparency.
    if (model.image.file) flattenOntoPaper(pixels, width * height);
    context.putImageData(new ImageData(pixels, width, height), 0, 0);
    // The whole picture on the canvas is copied under it for the next drag, and an ordinary
    // paint landing ends the copy's showing (Rotem, 2026-09-15).
    if (x === pic.x && y === pic.y && srcW === pic.w && srcH === pic.h) captureBackdrop(width, height);
    if (!drag) document.body.classList.remove('panning');
    lastRegion = { x, y, w: srcW, h: srcH, width, height, zoom: model.zoom, ms: Math.round(performance.now() - askedAt) };
    // A pan drag may have moved on while this region was on its way: it is placed by its own
    // origin, so it lines up with the notes until the next one lands (Rotem, 2026-09-15).
    if (drag && drag.kind === 'pan') slideCanvas(lastRegion);
    console.log(`painted ${width}x${height} at zoom ${model.zoom.toFixed(3)} in ${lastRegion.ms} ms`);
    layoutScene();
    drawHud();
  };

  // Where the image and the mat sit in the viewport. Centred when the composition does
  // not fill the window, which is what anyone expects of a viewer and is not what the
  // first version did; otherwise the pan says where the image starts, which is left of
  // the viewport for a pan into the image and right of it for a pan into the margin. The
  // offset is where the IMAGE starts; the mat is the composition around it.
  const placeComposition = (vp) => {
    const comp = compositionSize();
    const compW = (comp.w * model.zoom) / dpr();
    const compH = (comp.h * model.zoom) / dpr();
    // The offset lands on a PHYSICAL pixel, so it may be a fraction of a CSS pixel. On a
    // 225% display a whole CSS pixel is 2.25 physical ones, and a picture or a note placed
    // at a whole CSS offset sits between physical pixels and is resampled: the live editor
    // and the copy then differed on 12% of the text's pixels while agreeing at 100%
    // (S1.1, F74).
    const snap = (css) => Math.round(css * dpr()) / dpr();
    // The image's origin sits at offset minus the pan, in every formula of this page; when
    // the composition does not fit, the offset is 0 and the pan alone says where it is.
    model.offset.x = compW <= vp.w
      ? snap((vp.w - compW) / 2 + (model.margin.left * model.zoom) / dpr())
      : 0;
    model.offset.y = compH <= vp.h
      ? snap((vp.h - compH) / 2 + (model.margin.top * model.zoom) / dpr())
      : 0;
    // The canvas holds the picture from its first visible column, so it starts at the
    // picture's origin or at the viewport's edge, whichever is further right or down.
    const pic = pictureRect();
    canvas.style.left = `${snap(model.offset.x + ((Math.max(pic.x, model.pan.x) - model.pan.x) * model.zoom) / dpr())}px`;
    canvas.style.top = `${snap(model.offset.y + ((Math.max(pic.y, model.pan.y) - model.pan.y) * model.zoom) / dpr())}px`;
    // The copy of the whole picture sits where the notes' layer puts the picture, at its size.
    backdrop.style.left = `${model.offset.x - ((model.pan.x - pic.x) * model.zoom) / dpr()}px`;
    backdrop.style.top = `${model.offset.y - ((model.pan.y - pic.y) * model.zoom) / dpr()}px`;
    backdrop.style.width = `${(pic.w * model.zoom) / dpr()}px`;
    backdrop.style.height = `${(pic.h * model.zoom) / dpr()}px`;
    const hasMargin = comp.w !== pic.w || comp.h !== pic.h;
    mat.style.display = hasMargin ? 'block' : 'none';
    if (hasMargin) {
      mat.style.left = `${model.offset.x - ((model.pan.x - pic.x + model.margin.left) * model.zoom) / dpr()}px`;
      mat.style.top = `${model.offset.y - ((model.pan.y - pic.y + model.margin.top) * model.zoom) / dpr()}px`;
      mat.style.width = `${compW}px`;
      mat.style.height = `${compH}px`;
    }
  };

  // During a pan drag the picture on the canvas is placed by the origin of the region it
  // holds, under the pan as it is now, so it slides with the pointer and stays registered
  // with the notes until the next region lands (Rotem, 2026-09-15).
  const slideCanvas = (region) => {
    if (!region || region.zoom !== model.zoom) return;
    canvas.style.left = `${model.offset.x + ((region.x - model.pan.x) * model.zoom) / dpr()}px`;
    canvas.style.top = `${model.offset.y + ((region.y - model.pan.y) * model.zoom) / dpr()}px`;
  };

  // ---------------------------------------------------------------- the callout layer

  const strongDirection = (text) => {
    // The first strong character decides, which is §3.5's rule written out rather than
    // handed to a CSS keyword that resolves per paragraph and ignores an override (F36).
    for (const ch of text) {
      if (/[֐-ࣿיִ-﷿ﹰ-﻿]/.test(ch)) return 'rtl';
      if (/[A-Za-zÀ-ʯͰ-֏]/.test(ch)) return 'ltr';
    }
    return null;
  };

  const resolveDirection = (callout) => {
    if (callout.dirMode === 'ltr' || callout.dirMode === 'rtl') return callout.dirMode;
    return strongDirection(callout.text) || 'ltr';
  };

  // The sizes a note can take, in image pixels, with 20 as the default. A ladder rather
  // than a multiplier: the same key press has to land on the same size every time.
  const TEXT_SIZES = [10, 12, 14, 16, 18, 20, 24, 28, 32, 40, 48, 64, 80];

  const stepTextSize = (from, direction) => {
    const at = TEXT_SIZES.findIndex((size) => size >= from);
    const index = at < 0 ? TEXT_SIZES.length - 1 : at;
    return TEXT_SIZES[Math.min(TEXT_SIZES.length - 1, Math.max(0, index + direction))];
  };

  // One step up or down. It applies to the note being edited, or the selected one, and it
  // always becomes the default for the next note: the size last used is the size wanted.
  const nudgeTextSize = (direction) => {
    const target = model.editing || model.selected;
    const next = stepTextSize(target ? target.textSize : model.textSize, direction);
    model.textSize = next;
    if (target) target.textSize = next;
    settle();
    if (target && target !== model.editing) record();
    drawHud();
    return next;
  };

  // A bubble's height: laid out when it is on screen, estimated from its size before
  // that (one line: the padding, the text box at its least, the border).
  const heightOf = (callout) => {
    const el = scene.querySelector(`[data-id="${callout.id}"]`);
    return el ? el.offsetHeight : Math.round((callout.textSize || model.textSize) * 5) + 2;
  };

  const rectOf = (callout) => ({ x: callout.box.x, y: callout.box.y, w: callout.box.width, h: heightOf(callout) });
  const overlaps = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  const covers = (r, point) => point.x >= r.x && point.x < r.x + r.w && point.y >= r.y && point.y < r.y + r.h;

  // Placement (§3.5): a small deterministic set of candidates near the anchor, in a fixed
  // order, none covering the anchor. The first one inside the composition and clear of
  // the existing bubbles and their anchors wins; failing that, the first clear one, and
  // the margin grows to hold it (fitMargin); failing that, the first. Never content-aware.
  // The gaps are proportions of the text size, so the same picture places the same way
  // at every size: 28 and 24 at the default of 20, which the first version hard-coded.
  const placeCallout = (anchor, width, height, textSize, others) => {
    const gx = Math.round(textSize * 1.4);
    const gy = Math.round(textSize * 1.2);
    const candidates = [
      { x: anchor.x + gx, y: anchor.y + gy }, // below right, the first version's one place
      { x: anchor.x - gx - width, y: anchor.y + gy }, // below left
      { x: anchor.x + gx, y: anchor.y - gy - height }, // above right
      { x: anchor.x - gx - width, y: anchor.y - gy - height }, // above left
      { x: anchor.x + gx, y: anchor.y - Math.round(height / 2) }, // right
      { x: anchor.x - gx - width, y: anchor.y - Math.round(height / 2) }, // left
      { x: anchor.x - Math.round(width / 2), y: anchor.y + gy }, // below
      { x: anchor.x - Math.round(width / 2), y: anchor.y - gy - height }, // above
    ];
    const pic = pictureRect();
    const inside = (c) => c.x >= pic.x - model.margin.left && c.y >= pic.y - model.margin.top
      && c.x + width <= pic.x + pic.w + model.margin.right && c.y + height <= pic.y + pic.h + model.margin.bottom;
    const clear = (c) => {
      const r = { x: c.x, y: c.y, w: width, h: height };
      return !others.some((o) => overlaps(r, rectOf(o)) || covers(r, o.anchor));
    };
    return candidates.find((c) => inside(c) && clear(c)) || candidates.find(clear) || candidates[0];
  };

  const createCallout = (anchor) => {
    const textSize = model.textSize;
    // Proportional to the text, so a note at 48 px is not three words per line. Thirteen
    // times the size is the 260 px the first version used, at the default of 20.
    const width = Math.round(textSize * 13);
    const at = { x: Math.round(anchor.x), y: Math.round(anchor.y) };
    const height = Math.round(textSize * 5) + 2;
    const place = placeCallout(at, width, height, textSize, model.callouts);
    const callout = {
      id: `c${model.nextNumber}`,
      number: model.nextNumber++,
      anchor: at,
      box: { x: place.x, y: place.y, width },
      text: '',
      textSize,
      dirMode: 'auto',
      resolvedDir: 'ltr',
    };
    model.callouts.push(callout);
    // A bubble that could not fit gets its margin now, before it is laid out, so the
    // first paint already shows the room it took.
    if (fitMargin()) paintRegion();
    return callout;
  };

  // The margin the notes need (§3.5): every bubble inside the composition, with its own
  // padding as breathing room, over the floor the checks may set. Recomputed when a note
  // is created, committed, resized, removed or dropped after a drag, never during one, so
  // a bubble being moved does not have the picture shift under it. It shrinks back when
  // the notes no longer need it. Returns whether the margin changed; the fit view follows
  // when the view was at fit, so the whole composition stays in sight.
  const fitMargin = () => {
    if (drag || !model.image.width) return false;
    const need = { ...model.marginFloor };
    const pic = pictureRect();
    for (const callout of model.callouts) {
      const r = rectOf(callout);
      const pad = Math.round((callout.textSize || model.textSize) * 0.4);
      need.left = Math.max(need.left, pad - (r.x - pic.x));
      need.top = Math.max(need.top, pad - (r.y - pic.y));
      need.right = Math.max(need.right, r.x + r.w + pad - (pic.x + pic.w));
      need.bottom = Math.max(need.bottom, r.y + r.h + pad - (pic.y + pic.h));
    }
    let changed = false;
    for (const edge of ['left', 'top', 'right', 'bottom']) {
      const value = Math.max(0, Math.round(need[edge]));
      if (value !== model.margin[edge]) { model.margin[edge] = value; changed = true; }
    }
    if (!changed) return false;
    followFit();
    return true;
  };

  // ---------------------------------------------------------------- saving
  //
  // §3.8: new captures save automatically and later edits save with no Apply action. The
  // notes go to the host as one object, keyed by the document's number, so a save that
  // lands after the page moved on still reaches the right document. Debounced while
  // typing; forced on blur, before navigation, before another document, before a hide and
  // at quit. A failure is shown and the work stays; the next change tries again.
  let saveTimer = null;
  let saving = null;
  const notesOf = () => ({
    callouts: model.callouts,
    nextNumber: model.nextNumber,
    shapes: model.shapes,
    nextShape: model.nextShape,
    crop: model.crop ? { ...model.crop } : null,
    margin: { ...model.margin },
    textSize: model.textSize,
  });
  const markDirty = () => {
    if (!model.image.managed) return;
    model.save.dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { saveNow().catch(() => {}); }, 800);
  };
  const saveNow = async () => {
    clearTimeout(saveTimer);
    if (!model.save.dirty || !model.image.managed || !model.image.document_id) {
      if (saving) await saving;
      return model.save.state;
    }
    // Taken now, before any wait: the page may move to another document meanwhile, and
    // what was pending belongs to this one.
    const documentId = model.image.document_id;
    const notes = JSON.parse(JSON.stringify(notesOf()));
    const save = model.save;
    // Cleared before the wait, not after (review T1): a keystroke typed while an earlier
    // save is still on its way marks the document dirty again, and the timer's save
    // carries it. Cleared after the wait, the flag was wiped over that keystroke, and the
    // text stayed in the page's memory only while the HUD said saved.
    save.dirty = false;
    if (saving) await saving;
    save.state = 'saving';
    drawHud();
    saving = invoke('editor_save_notes', { documentId, notes }).then(() => {
      save.state = 'saved';
      save.error = '';
      refreshThumbnail(documentId); // the thumbnail follows the notes; not awaited, a save is a save
    }, (err) => {
      save.dirty = true;
      save.state = 'failed';
      save.error = String(err);
      console.error('save failed', err);
    }).finally(() => { saving = null; drawHud(); });
    await saving;
    return save.state;
  };
  window.addEventListener('blur', () => { saveNow().catch(() => {}); });

  // ---------------------------------------------------------------- undo and redo
  //
  // One snapshot per completed operation: a note committed with its text, moved, its anchor
  // moved, resized, or removed. Recording compares with the step at the cursor, so an
  // operation that changed nothing, an empty bubble discarded at commit for one, adds no
  // step. Undo restores a note with the number it had (§3.5); the margin follows the
  // restored notes through settle.
  const snapshot = () => JSON.stringify({ callouts: model.callouts, nextNumber: model.nextNumber, shapes: model.shapes, nextShape: model.nextShape, crop: model.crop });

  // The last thing done is what Ctrl+Z takes (S2.9; Rotem, 2026-09-16): every note step
  // and every deletion of a document takes a number from this one counter as it happens,
  // and undo compares the current document's newest step with the newest deletion still
  // undoable. Redo walks the undone things back in the order they were undone; a new
  // action, a step or a deletion, ends what could be redone.
  let actionSeq = 0;
  let deletions = [];      // { id, seq, shown, undone }, in the order they happened
  // Everything else undo reaches, numbered on the same counter (Rotem, 2026-09-16: every new
  // feature joins undo and redo, CLAUDE.md rule 23): today a tab added, deleted or renamed.
  let acts = [];           // { seq, undone, undo(), redo() }
  const undoneStack = [];  // { kind: 'note', id }, { kind: 'delete', deletion } or { kind: 'act', act }
  const newAction = () => {
    deletions = deletions.filter((d) => !d.undone);
    acts = acts.filter((a) => !a.undone);
    undoneStack.length = 0;
    actionSeq += 1;
    return actionSeq;
  };
  const recordAct = (undo, redo) => {
    const seq = newAction(); // first: it replaces the list, so the push must come after it
    acts.push({ seq, undone: false, undo, redo });
  };

  const record = () => {
    const h = model.history;
    const now = snapshot();
    if (h.steps[h.index] === now) return false;
    h.steps.splice(h.index + 1);
    h.steps.push(now);
    if (!h.seq) h.seq = [];
    h.seq.splice(h.index + 1);
    h.seq.push(newAction());
    h.index = h.steps.length - 1;
    markDirty();
    return true;
  };

  const restore = (step) => {
    const saved = JSON.parse(step);
    model.callouts = saved.callouts;
    model.nextNumber = saved.nextNumber;
    model.shapes = saved.shapes || [];
    model.nextShape = saved.nextShape || 1;
    const cropBefore = cropString();
    model.crop = saved.crop || null;
    model.selected = null;
    model.selectedShape = null;
    model.editing = null;
    model.placing = null;
    // A crop undone or redone is a new picture: the view and the paint follow it.
    if (cropString() !== cropBefore) applyCrop(model.crop); else settle();
    markDirty();
    drawHud();
  };

  // The crop takes effect (S3.6): the picture is the rect now, or the whole source for none;
  // the view at the whole picture follows to the new whole, the notes take the margin they
  // need around it, and the picture is painted anew. The copy of the whole picture kept for
  // a pan drag was the old picture's, so it is dropped until the new one is painted whole.
  const applyCrop = (rect) => {
    const whole = !rect || (rect.x === 0 && rect.y === 0 && rect.w === model.image.width && rect.h === model.image.height);
    model.crop = whole ? null : { x: rect.x, y: rect.y, w: rect.w, h: rect.h };
    backdropFor = null;
    followFit();
    layoutScene();
    fitMargin();
    return paintRegion();
  };

  // A deleted document comes back the way it went (S2.9): its folder out of the trash by
  // the S2.7 move, into the list in its place, and on screen only if it was on screen when
  // deleted; otherwise the picture on screen stays and only its thumbnail returns. Its notes
  // and their undo were kept in the stash, so loadImage finds them. No notice: the picture
  // coming back is the message. A refused restore says why and leaves the undo path, so
  // the next Ctrl+Z reaches what was done before it instead of the same refusal.
  const undoDeletion = async (deletion) => {
    try {
      await invoke('editor_trash_rejoin', { id: deletion.id });
    } catch (err) {
      console.error('undo of a deletion', err);
      deletions = deletions.filter((d) => d !== deletion);
      notice(`NOT RESTORED: ${err}`, 0);
      return false;
    }
    deletion.undone = true;
    undoneStack.push({ kind: 'delete', deletion });
    if (deletion.shown) await loadImage(await invoke('editor_show_document', { id: deletion.id }));
    await refreshStrip();
    drawHud();
    return true;
  };

  const undo = () => {
    const h = model.history;
    const stepSeq = h.index > 0 && h.seq ? h.seq[h.index] : -1;
    const deletion = deletions.filter((d) => !d.undone).pop();
    const act = acts.filter((a) => !a.undone).pop();
    const actSeq = act ? act.seq : -1;
    if (deletion && deletion.seq > stepSeq && deletion.seq > actSeq) {
      undoDeletion(deletion).catch((err) => console.error('undo', err));
      return true;
    }
    if (act && act.seq > stepSeq) {
      act.undone = true;
      undoneStack.push({ kind: 'act', act });
      act.undo();
      return true;
    }
    if (h.index <= 0) return false;
    h.index -= 1;
    restore(h.steps[h.index]);
    undoneStack.push({ kind: 'note', id: model.image.document_id });
    return true;
  };

  const redo = () => {
    // The most recently undone thing first: a deletion is done again by the same delete,
    // and a step of a document no longer on screen is passed over for the next.
    while (undoneStack.length) {
      const top = undoneStack.pop();
      if (top.kind === 'delete') {
        deletions = deletions.filter((d) => d !== top.deletion);
        deleteDocument(top.deletion.id, true).catch((err) => console.error('redo', err));
        return true;
      }
      if (top.kind === 'act') {
        top.act.undone = false;
        top.act.redo();
        return true;
      }
      if (top.id === model.image.document_id) break;
    }
    const h = model.history;
    if (h.index >= h.steps.length - 1) return false;
    h.index += 1;
    restore(h.steps[h.index]);
    return true;
  };

  // Lay the notes out, then give them the margin they need, then paint if that changed.
  const settle = () => {
    layoutScene();
    if (fitMargin()) return paintRegion();
    return Promise.resolve();
  };

  // A text note (S3.3): typed where it is clicked, with the callout's editing and none of
  // its dressing. It takes no callout number, so the numbering of the notes stays theirs.
  const createTextNote = (at) => {
    const textSize = model.textSize;
    const note = {
      id: `x${model.nextShape}`,
      kind: 'text',
      number: null,
      anchor: { x: Math.round(at.x), y: Math.round(at.y) },
      box: { x: Math.round(at.x), y: Math.round(at.y), width: Math.round(textSize * 13) },
      text: '',
      textSize,
      dirMode: 'auto',
      resolvedDir: 'ltr',
    };
    model.nextShape += 1;
    model.callouts.push(note);
    if (fitMargin()) paintRegion();
    return note;
  };

  const removeCallout = (callout) => {
    model.callouts = model.callouts.filter((c) => c !== callout);
    if (model.selected === callout) model.selected = null;
    if (model.editing === callout) model.editing = null;
    // The number is NOT reused and the others are not renumbered: gaps stay, in the editor
    // and in every output, which is the decision in §3.5.
  };

  // ---------------------------------------------------------------- the ruler's magnifier
  //
  // The capture's circle beside the pointer, the whole time the ruler tool is in hand (Rotem,
  // 2026-09-18). It shows the picture's own pixels whatever the zoom: the few around the
  // pointer are asked of the host 1:1, one ask at a time, the newest place as soon as the
  // last one lands. The middle cell is the pixel right of and below the point a ruler's
  // corner lands on, so the blue lines cross on that corner.
  const mag = document.getElementById('mag');
  const magSize = mag.firstElementChild;
  const magCanvas = mag.lastElementChild;
  const magContext = magCanvas.getContext('2d');
  const magPatch = document.createElement('canvas');
  const MAG_DIAMETER = 112;
  const MAG_CELL = 8;
  const MAG_GAP = 8;
  const MAG_RING = 2;
  const MAG_FILL = [0x0D, 0x0E, 0x12];
  const MAG_BLUE = [0x00, 0xB9, 0xF7];
  let magPointer = null; // where the pointer last was over the stage, in client pixels
  let magKey = '';
  let magAsking = false;
  let magAgain = false;

  // The pixels around one point, as the capture paints them: each a cell wide, the grid's
  // line on the last pixel of every cell, darkened by half, the blue on the middle cell's
  // top and left edges, and the panel's fill where the picture ends.
  const paintMag = (at, count, got) => {
    const diameter = Math.round(MAG_DIAMETER * dpr());
    const cell = Math.max(1, Math.round(MAG_CELL * dpr()));
    const side = count * cell;
    const half = (count - 1) / 2;
    const image = new ImageData(side, side);
    const out = image.data;
    const centre = half * cell - 1;
    for (let y = 0; y < side; y += 1) {
      for (let x = 0; x < side; x += 1) {
        const o = (y * side + x) * 4;
        let rgb = MAG_FILL;
        let line = false;
        if (x === centre || y === centre) {
          rgb = MAG_BLUE;
        } else {
          const sx = at.x - half + Math.floor(x / cell) - got.x;
          const sy = at.y - half + Math.floor(y / cell) - got.y;
          if (sx >= 0 && sy >= 0 && sx < got.w && sy < got.h) {
            const i = (sy * got.w + sx) * 4;
            rgb = [got.pixels[i], got.pixels[i + 1], got.pixels[i + 2]];
          }
          line = x % cell === cell - 1 || y % cell === cell - 1;
        }
        out[o] = line ? rgb[0] >> 1 : rgb[0];
        out[o + 1] = line ? rgb[1] >> 1 : rgb[1];
        out[o + 2] = line ? rgb[2] >> 1 : rgb[2];
        out[o + 3] = 255;
      }
    }
    magPatch.width = side;
    magPatch.height = side;
    magPatch.getContext('2d').putImageData(image, 0, 0);
    if (magCanvas.width !== diameter) { magCanvas.width = diameter; magCanvas.height = diameter; }
    const ring = Math.max(1, Math.round(MAG_RING * dpr()));
    const shift = Math.floor((diameter - side) / 2);
    magContext.clearRect(0, 0, diameter, diameter);
    magContext.save();
    magContext.beginPath();
    magContext.arc(diameter / 2, diameter / 2, diameter / 2, 0, Math.PI * 2);
    magContext.clip();
    magContext.drawImage(magPatch, shift, shift);
    magContext.restore();
    magContext.beginPath();
    magContext.arc(diameter / 2, diameter / 2, (diameter - ring) / 2, 0, Math.PI * 2);
    magContext.lineWidth = ring;
    magContext.strokeStyle = '#f2f2f2';
    magContext.stroke();
  };

  const askMag = async () => {
    if (magAsking) { magAgain = true; return; }
    magAsking = true;
    try {
      const point = toImage(magPointer);
      const at = { x: Math.round(point.x), y: Math.round(point.y) };
      const diameter = Math.round(MAG_DIAMETER * dpr());
      const cell = Math.max(1, Math.round(MAG_CELL * dpr()));
      let count = Math.ceil(diameter / cell);
      if (count % 2 === 0) count += 1;
      const half = (count - 1) / 2;
      // Cut to the picture, which is the crop's when one is set; all margin is all fill.
      const pic = pictureRect();
      const x = Math.max(pic.x, at.x - half);
      const y = Math.max(pic.y, at.y - half);
      const w = Math.min(pic.x + pic.w, at.x - half + count) - x;
      const h = Math.min(pic.y + pic.h, at.y - half + count) - y;
      let got = { x, y, w: 0, h: 0, pixels: new Uint8ClampedArray(0) };
      if (w >= 1 && h >= 1) {
        const response = await fetch(`http://region.localhost/?mag&x=${x}&y=${y}&w=${w}&h=${h}&ow=${w}&oh=${h}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`the magnifier's pixels were refused: ${response.status}`);
        const whole = new Uint8Array(await response.arrayBuffer());
        const header = new DataView(whole.buffer, 0, 8);
        const pixels = new Uint8ClampedArray(whole.subarray(8));
        got = { x, y, w: header.getUint32(0, true), h: header.getUint32(4, true), pixels };
        if (pixels.length !== got.w * got.h * 4) throw new Error(`the magnifier got ${pixels.length} bytes for ${got.w}x${got.h}`);
        if (model.image.file) flattenOntoPaper(pixels, got.w * got.h);
      }
      paintMag(at, count, got);
    } finally {
      magAsking = false;
      if (magAgain) { magAgain = false; magKey = ''; drawMag(); }
    }
  };

  const drawMag = () => {
    const on = model.tool === 'ruler' && !!magPointer && !!model.image.width && model.mode === 'annotate';
    mag.classList.toggle('on', on);
    if (!on) { magKey = ''; return; }
    // The size above the circle while a ruler is dragged out, as in a capture.
    const drawing = drag && drag.kind === 'draw' && drag.shape.kind === 'ruler' ? rectOfShape(drag.shape) : null;
    mag.classList.toggle('sized', !!drawing);
    if (drawing) {
      const text = `${drawing.w}x${drawing.h}`;
      if (magSize.textContent !== text) magSize.textContent = text;
    }
    // Below the pointer and right of it by the gap, and on its other side where that would
    // leave the stage, as the capture's does at a display's edge.
    const box = stage.getBoundingClientRect();
    const px = magPointer.clientX - box.left;
    const py = magPointer.clientY - box.top;
    const w = mag.offsetWidth;
    const h = mag.offsetHeight;
    let left = px + MAG_GAP;
    if (left + w > box.width) left = px - MAG_GAP - w;
    let top = py + MAG_GAP;
    if (top + h > box.height) top = py - MAG_GAP - h;
    mag.style.transform = `translate(${Math.max(0, Math.round(left))}px, ${Math.max(0, Math.round(top))}px)`;
    const point = toImage(magPointer);
    const crop = model.crop ? `${model.crop.x},${model.crop.y},${model.crop.w},${model.crop.h}` : '';
    const key = `${model.image.document_id}|${Math.round(point.x)}|${Math.round(point.y)}|${crop}|${dpr()}`;
    if (key === magKey) return;
    magKey = key;
    askMag().catch((err) => console.error('magnifier', err && err.stack ? err.stack : String(err)));
  };

  const layoutScene = () => {
    // The same offset the canvas got, so the callout layer stays registered with the
    // pixels it is annotating.
    scene.style.transform =
      `translate(${model.offset.x - (model.pan.x * model.zoom) / dpr()}px, ` +
      `${model.offset.y - (model.pan.y * model.zoom) / dpr()}px)` +
      ` scale(${model.zoom / dpr()})`;
    scene.style.setProperty('--k', String(model.zoom / dpr()));

    for (const callout of model.callouts) {
      let el = scene.querySelector(`[data-id="${callout.id}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'callout';
        el.dataset.id = callout.id;
        el.innerHTML = '<div class="n"></div><div class="t" contenteditable="true" spellcheck="false"></div>';
        if (callout.kind === 'text') el.classList.add('text');
        scene.appendChild(el);

        if (callout.kind !== 'text') {
          const anchorEl = document.createElement('div');
          anchorEl.className = 'anchor';
          anchorEl.dataset.anchorFor = callout.id;
          scene.appendChild(anchorEl);
        }
      }
      callout.resolvedDir = resolveDirection(callout);
      el.style.left = `${callout.box.x}px`;
      el.style.top = `${callout.box.y}px`;
      el.style.width = `${callout.box.width}px`;
      // In IMAGE pixels, like every other number in this layer, so one transform scales
      // the text with the picture and the wrapping is decided before the zoom exists.
      el.style.fontSize = `${callout.textSize || model.textSize}px`;
      el.style.direction = callout.resolvedDir;
      el.style.textAlign = callout.resolvedDir === 'rtl' ? 'right' : 'left';
      el.classList.toggle('selected', model.selected === callout);
      el.querySelector('.n').textContent = callout.number == null ? '' : String(callout.number);
      const textEl = el.querySelector('.t');
      if (textEl.textContent !== callout.text && model.editing !== callout) {
        textEl.textContent = callout.text;
      }

      const anchorEl = scene.querySelector(`[data-anchor-for="${callout.id}"]`);
      if (anchorEl) {
        anchorEl.style.left = `${callout.anchor.x}px`;
        anchorEl.style.top = `${callout.anchor.y}px`;
      }
    }

    for (const el of [...scene.querySelectorAll('.callout')]) {
      if (!model.callouts.some((c) => c.id === el.dataset.id)) el.remove();
    }
    for (const el of [...scene.querySelectorAll('.anchor')]) {
      if (!model.callouts.some((c) => c.id === el.dataset.anchorFor)) el.remove();
    }
    for (const shape of model.shapes) {
      if (shape.kind !== 'blur') continue;
      let el = scene.querySelector(`.blur[data-shape="${shape.id}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'blur';
        el.dataset.shape = shape.id;
        scene.appendChild(el);
      }
      const r = rectOfShape(shape);
      el.style.left = `${r.x}px`;
      el.style.top = `${r.y}px`;
      el.style.width = `${r.w}px`;
      el.style.height = `${r.h}px`;
      el.style.backdropFilter = `blur(${blurRadius(r)}px)`;
    }
    for (const el of [...scene.querySelectorAll('.blur')]) {
      if (!model.shapes.some((s) => s.id === el.dataset.shape)) el.remove();
    }
    for (const shape of model.shapes) {
      if (shape.kind !== 'ruler') continue;
      let el = scene.querySelector(`.ruler[data-shape="${shape.id}"]`);
      if (!el) {
        el = document.createElement('div');
        el.className = 'ruler';
        el.dataset.shape = shape.id;
        el.innerHTML = '<div class="size"></div><button type="button" class="x" data-ui="x" aria-label="Delete"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>';
        scene.appendChild(el);
      }
      const r = rectOfShape(shape);
      el.style.left = `${r.x}px`;
      el.style.top = `${r.y}px`;
      el.style.width = `${r.w}px`;
      el.style.height = `${r.h}px`;
      el.classList.toggle('drawing', !!drag && drag.kind === 'draw' && drag.shape === shape);
      // The size, beside the corner the drag ends at: b, which is where the pointer is.
      const size = el.firstElementChild;
      const text = `${r.w}x${r.h}`;
      if (size.textContent !== text) size.textContent = text;
      size.style.left = `${shape.b.x - r.x + 8}px`;
      size.style.top = `${shape.b.y - r.y + 8}px`;
    }
    for (const el of [...scene.querySelectorAll('.ruler')]) {
      if (!model.shapes.some((s) => s.id === el.dataset.shape)) el.remove();
    }
    // The crop's frame (S3.6): on the picture's edges while the crop tool is in hand, on the
    // rect a handle is dragging while the drag lasts.
    const cropRect = model.cropping || pictureRect();
    cropFrame.style.left = `${cropRect.x}px`;
    cropFrame.style.top = `${cropRect.y}px`;
    cropFrame.style.width = `${cropRect.w}px`;
    cropFrame.style.height = `${cropRect.h}px`;
    cropFrame.classList.toggle('dragging', !!model.cropping);
    document.body.classList.toggle('cropping', model.tool === 'crop' && !!model.image.width);

    drawArrows();
    drawMag(); // the ruler's magnifier follows the tool, the zoom and a ruler being dragged out
  };

  const drawArrows = () => {
    arrows.setAttribute('width', String(model.image.width || 1));
    arrows.setAttribute('height', String(model.image.height || 1));
    let markup = '';
    for (const callout of model.callouts) {
      if (callout.kind === 'text') continue; // no arrow, by design
      const el = scene.querySelector(`[data-id="${callout.id}"]`);
      const height = el ? el.offsetHeight : 40;
      const box = {
        x: callout.box.x,
        y: callout.box.y,
        w: callout.box.width,
        h: height,
      };
      const centre = { x: box.x + box.w / 2, y: box.y + box.h / 2 };
      const end = edgePoint(box, callout.anchor, centre);
      // A 4 px line from the bubble's edge to the anchor, ending in an open head there (Rotem,
      // 2026-09-17): two strokes, never a filled polygon, on the arrow shape's 16 by 7 head.
      const dx = callout.anchor.x - end.x;
      const dy = callout.anchor.y - end.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len;
      const uy = dy / len;
      const head = 16;
      const wing = 7;
      const base = { x: callout.anchor.x - ux * head, y: callout.anchor.y - uy * head };
      const left = { x: base.x - uy * wing, y: base.y + ux * wing };
      const right = { x: base.x + uy * wing, y: base.y - ux * wing };
      const stroke = 'stroke="#7aa7ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"';
      markup +=
        `<line x1="${callout.anchor.x}" y1="${callout.anchor.y}" x2="${end.x}" y2="${end.y}" ${stroke} />` +
        `<polyline points="${left.x.toFixed(1)},${left.y.toFixed(1)} ${callout.anchor.x},${callout.anchor.y} ${right.x.toFixed(1)},${right.y.toFixed(1)}" ${stroke} />`;
    }
    for (const shape of model.shapes) markup += shapeMarkup(shape);
    arrows.innerHTML = markup;
    handles.setAttribute('width', String(model.image.width || 1));
    handles.setAttribute('height', String(model.image.height || 1));
    const s = model.selectedShape;
    handles.innerHTML = s
      ? `<circle cx="${s.a.x}" cy="${s.a.y}" r="5" fill="#7aa7ff" stroke="#0d1014" stroke-width="2" /><circle cx="${s.b.x}" cy="${s.b.y}" r="5" fill="#7aa7ff" stroke="#0d1014" stroke-width="2" />`
      : '';
  };

  // ---------------------------------------------------------------- the shapes (Stage 3)
  //
  // An arrow is a line from its tail to its head with the head drawn as a polygon, never
  // a marker, so the export's serialized SVG renders it the same everywhere. Every number
  // is in image pixels; the stroke scales with the picture like a note does.
  const shapeMarkup = (shape) => {
    const stroke = 'stroke="#ff5252" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"';
    if (shape.kind === 'arrow') {
      const dx = shape.b.x - shape.a.x;
      const dy = shape.b.y - shape.a.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len;
      const uy = dy / len;
      const head = 16;
      const wing = 7;
      const base = { x: shape.b.x - ux * head, y: shape.b.y - uy * head };
      const left = { x: base.x - uy * wing, y: base.y + ux * wing };
      const right = { x: base.x + uy * wing, y: base.y - ux * wing };
      return `<g data-shape="${shape.id}"><line x1="${shape.a.x}" y1="${shape.a.y}" x2="${base.x.toFixed(1)}" y2="${base.y.toFixed(1)}" ${stroke} />` +
